<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>三大营养素 - 纯 HTML 工具箱</title>
<meta name="description" content="按每日热量与目标比例拆分蛋白质、脂肪与碳水的克数。">
<meta name="theme-color" content="#f6f5f1">
<link rel="icon" href="../assets/favicon.svg" type="image/svg+xml">
<script type="application/json" id="tool-meta">{"title":"三大营养素","desc":"按每日热量与目标比例拆分蛋白质、脂肪与碳水的克数。","category":"calc","tags":["营养","健身","饮食"],"order":318}</script>
<script>try{var t=localStorage.getItem("pht-theme");if(t!=="light"&&t!=="dark"){t=window.matchMedia&&window.matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light"}document.documentElement.setAttribute("data-theme",t)}catch(e){document.documentElement.setAttribute("data-theme","light")}</script>
<style data-inline="assets/tool-base.css"></style>
<style></style>
</head>
<body>
<header class="toolbar">
  <div class="toolbar-inner">
    <a class="brand" href="../index.html"><img src="../assets/favicon.svg" alt="" width="24" height="24"><span>纯 HTML 工具箱</span></a>
    <span class="spacer"></span>
    <a class="btn ghost" href="../index.html">返回首页</a>
    <button class="icon-btn" type="button" data-theme-toggle aria-label="切换深色主题" aria-pressed="false"><svg class="i-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"></circle><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M19.1 4.9l-1.4 1.4M6.3 17.7l-1.4 1.4"></path></svg><svg class="i-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 14.5A8.5 8.5 0 0 1 9.5 4 8.5 8.5 0 1 0 20 14.5Z"></path></svg></button>
  </div>
</header>

<main class="shell">
  <div class="page-head">
    <span class="badge">计算 · 本地处理</span>
    <h1>三大营养素</h1>
    <p>按每日热量与目标比例拆分蛋白质、脂肪与碳水的克数。</p>
  </div>

  <section class="panel">
<div class="grid-2">
  <div class="field"><label for="calories">热量 (kcal)</label><input type="number" id="calories" value="2000"></div>
  <div class="field"><label for="proteinPct">蛋白质 (%)</label><input type="number" id="proteinPct" value="30"></div>
  <div class="field"><label for="fatPct">脂肪 (%)</label><input type="number" id="fatPct" value="25"></div>
</div>
<dl class="stat-row" style="margin-top:16px">
  <div class="stat"><dt>蛋白质 (g)</dt><dd id="pg">—</dd></div>
  <div class="stat"><dt>脂肪 (g)</dt><dd id="fg">—</dd></div>
  <div class="stat"><dt>碳水 (g)</dt><dd id="cg">—</dd></div>
</dl>
<p class="status" id="status" aria-live="polite"></p>
  </section>

  <footer class="foot">
    <span>所有处理都在浏览器本地完成，数据不会上传。</span>
    <a href="../index.html">返回全部工具</a>
  </footer>
</main>

<script data-inline="assets/tool-base.js"></script>
<script>
(function(){
  var $=PHT.$; var statusEl=$("#status");
  function fnum(n){ if(n===null||n===undefined||!isFinite(n)) return "—"; var a=Math.round(n*1e6)/1e6; return a.toLocaleString("zh-CN",{maximumFractionDigits:6}); }
  var compute = function(args){ return { "pg":(args.calories*args.proteinPct/100/4),"fg":(args.calories*args.fatPct/100/9),"cg":(args.calories*(1-args.proteinPct/100-args.fatPct/100)/4) }; };
  function run(){ var args={};
    args["calories"]=parseFloat($("#calories").value);
    args["proteinPct"]=parseFloat($("#proteinPct").value);
    args["fatPct"]=parseFloat($("#fatPct").value);
    try { var r=compute(args);
    if(r&&r["pg"]!==undefined){ var v=r["pg"]; $("#pg").textContent=(typeof v==="number")?fnum(v):v; }
    if(r&&r["fg"]!==undefined){ var v=r["fg"]; $("#fg").textContent=(typeof v==="number")?fnum(v):v; }
    if(r&&r["cg"]!==undefined){ var v=r["cg"]; $("#cg").textContent=(typeof v==="number")?fnum(v):v; }
      PHT.status(statusEl,(r&&r.__msg)||"计算完成",(r&&r.__type)||"ok"); } catch(e){ PHT.status(statusEl,"出错了："+e.message,"error"); }
  }
  ["calories","proteinPct","fatPct"].forEach(function(k){ $("#"+k).addEventListener("input",run); $("#"+k).addEventListener("change",run); });
  run();
})();
</script>
</body>
</html>
