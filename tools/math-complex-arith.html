<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>复数四则运算 - 纯 HTML 工具箱</title>
<meta name="description" content="对两个复数进行加、减、乘、除运算，输出实部与虚部。">
<meta name="theme-color" content="#f6f5f1">
<link rel="icon" href="../assets/favicon.svg" type="image/svg+xml">
<script type="application/json" id="tool-meta">{"title":"复数四则运算","desc":"对两个复数进行加、减、乘、除运算，输出实部与虚部。","category":"calc","tags":["复数","代数","数学"],"order":3103}</script>
<script>try{var t=localStorage.getItem("pht-theme");if(t!=="light"&&t!=="dark"){t=window.matchMedia&&window.matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light"}document.documentElement.setAttribute("data-theme",t)}catch(e){document.documentElement.setAttribute("data-theme","light")}</script>
<style data-inline="assets/tool-base.css"></style>
<style></style>
</head>
<body>
<header class="toolbar">
  <div class="toolbar-inner">
    <a class="brand" href="../index.html"><img src="../assets/favicon.svg" alt="" width="24" height="24"><span>纯 HTML 工具箱</span></a>
    <span class="spacer"></span>
    <a class="btn ghost" href="../index.html">返回首页</a>
    <button class="icon-btn" type="button" data-theme-toggle aria-label="切换深色主题" aria-pressed="false"><svg class="i-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"></circle><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M19.1 4.9l-1.4 1.4M6.3 17.7l-1.4 1.4"></path></svg><svg class="i-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 14.5A8.5 8.5 0 0 1 9.5 4 8.5 8.5 0 1 0 20 14.5Z"></path></svg></button>
  </div>
</header>

<main class="shell">
  <div class="page-head">
    <span class="badge">计算 · 本地处理</span>
    <h1>复数四则运算</h1>
    <p>对两个复数进行加、减、乘、除运算，输出实部与虚部。</p>
  </div>

  <section class="panel">
<div class="grid-2">
  <div class="field"><label for="r1">复数1 实部</label><input type="number" id="r1" value="3"></div>
  <div class="field"><label for="i1">复数1 虚部</label><input type="number" id="i1" value="2"></div>
  <div class="field"><label for="r2">复数2 实部</label><input type="number" id="r2" value="1"></div>
  <div class="field"><label for="i2">复数2 虚部</label><input type="number" id="i2" value="-4"></div>
  <div class="field"><label for="op">运算</label><select id="op"><option value="+">加 +</option><option value="-">减 -</option><option value="*">乘 ×</option><option value="/">除 ÷</option></select></div>
</div>
<dl class="stat-row" style="margin-top:16px">
  <div class="stat"><dt>结果实部</dt><dd id="re">—</dd></div>
  <div class="stat"><dt>结果虚部</dt><dd id="im">—</dd></div>
</dl>
<p class="status" id="status" aria-live="polite"></p>
  </section>

  <footer class="foot">
    <span>所有处理都在浏览器本地完成，数据不会上传。</span>
    <a href="../index.html">返回全部工具</a>
  </footer>
</main>

<script data-inline="assets/tool-base.js"></script>
<script>
(function(){
  var $=PHT.$; var statusEl=$("#status");
  function fnum(n){ if(n===null||n===undefined||!isFinite(n)) return "—"; var a=Math.round(n*1e6)/1e6; return a.toLocaleString("zh-CN",{maximumFractionDigits:6}); }
  var compute = function compute(args){ 
      var r, i;
      if (a.op === "+") { r = a.r1 + a.r2; i = a.i1 + a.i2; }
      else if (a.op === "-") { r = a.r1 - a.r2; i = a.i1 - a.i2; }
      else if (a.op === "*") { r = a.r1 * a.r2 - a.i1 * a.i2; i = a.r1 * a.i2 + a.i1 * a.r2; }
      else { var d = a.r2 * a.r2 + a.i2 * a.i2; if (d === 0) return { __msg: "除数不能为 0", __type: "error" }; r = (a.r1 * a.r2 + a.i1 * a.i2) / d; i = (a.i1 * a.r2 - a.r1 * a.i2) / d; }
      return { re: r, im: i };
     };
  function run(){ var args={};
    args["r1"]=parseFloat($("#r1").value);
    args["i1"]=parseFloat($("#i1").value);
    args["r2"]=parseFloat($("#r2").value);
    args["i2"]=parseFloat($("#i2").value);
    args["op"]=$("#op").value;
    try { var r=compute(args);
    if(r&&r["re"]!==undefined){ var v=r["re"]; $("#re").textContent=(typeof v==="number")?fnum(v):v; }
    if(r&&r["im"]!==undefined){ var v=r["im"]; $("#im").textContent=(typeof v==="number")?fnum(v):v; }
      PHT.status(statusEl,(r&&r.__msg)||"计算完成",(r&&r.__type)||"ok"); } catch(e){ PHT.status(statusEl,"出错了："+e.message,"error"); }
  }
  ["r1","i1","r2","i2","op"].forEach(function(k){ $("#"+k).addEventListener("input",run); $("#"+k).addEventListener("change",run); });
  run();
})();
</script>
</body>
</html>
