<html lang="zh-CN" data-theme="light">
<head>
<meta charset="utf-8">

<script>try{var t=localStorage.getItem("pht-theme");if(t!=="light"&&t!=="dark"){t=window.matchMedia&&window.matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light"}document.documentElement.setAttribute("data-theme",t)}catch(e){document.documentElement.setAttribute("data-theme","light")}</script>

<body>
<header class="toolbar">
  <div class="toolbar-inner">
    <a class="brand" href="../index.html"><img src="../assets/favicon.svg" alt="" width="24" height="24"><span>纯 HTML 工具箱</span></a>
    <span class="spacer"></span>
    <a class="btn ghost" href="../index.html">返回首页</a>
    <button class="icon-btn" type="button" data-theme-toggle aria-label="切换深色主题" aria-pressed="false"><svg class="i-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"></circle><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M19.1 4.9l-1.4 1.4M6.3 17.7l-1.4 1.4"></path></svg><svg class="i-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 14.5A8.5 8.5 0 0 1 9.5 4 8.5 8.5 0 1 0 20 14.5Z"></path></svg></button>
  </div>
</header>

<main class="shell">
  <div class="page-head">
    <span class="badge">图片 · 本地处理</span>
    <h1>暗角</h1>
    <p>让图片四周变暗，突出中心。</p>
  </div>

  <section class="panel">
<label class="drop" id="drop"><input type="file" id="fileInput" accept="image/*"><strong>拖入图片或点击选择</strong><span>让图片四周变暗，突出中心。</span></label>
<div class="grid-2" style="margin-top:14px">
  <div class="field"><label for="strength">强度 (0-1)</label><input type="number" id="strength" value="0.6" min="0" max="1" step="0.1"></div>
</div>
<canvas id="canvas" style="display:none"></canvas>
<div class="preview-box" id="pv" style="margin-top:14px"><span class="empty">预览会显示在这里</span></div>
<div class="actions" style="margin-top:14px"><button class="btn primary" id="download" type="button" disabled>下载图片</button></div>
<p class="status" id="status" aria-live="polite"></p>
  </section>

  <footer class="foot">
    <span>所有处理都在浏览器本地完成，数据不会上传。</span>
    <a href="../index.html">返回全部工具</a>
  </footer>
</main>

<script data-inline="assets/tool-base.js"></script>
<script>
(function(){
  var $=PHT.$; var statusEl=$("#status"); var canvas=$("#canvas"), img=null, dataUrl=null; var fileInput=$("#fileInput");
  function loadFile(file){ if(!file||!/^image\//.test(file.type)){ PHT.status(statusEl,"请选择图片文件","error"); return; } var reader=new FileReader(); reader.onload=function(e){ var im=new Image(); im.onload=function(){ img=im; render(); PHT.status(statusEl,"已载入，可下载","ok"); }; im.onerror=function(){ PHT.status(statusEl,"图片解析失败","error"); }; im.src=e.target.result; }; reader.readAsDataURL(file); }
  function render(){
    if(!img) return;
    var w=img.naturalWidth, h=img.naturalHeight;
    canvas.width=w; canvas.height=h;
    var ctx=canvas.getContext("2d");
    if(!ctx){ PHT.status(statusEl,"当前浏览器不支持画布","error"); return; }
    var strength=parseFloat($("#strength").value);
    try{
          var idt=ctx.getImageData(0,0,w,h); (function(d,w,h,args){ var cx=w/2, cy=h/2, maxd=Math.sqrt(cx*cx+cy*cy), st=args.strength||0.6; for(var y=0;y<h;y++){ for(var x=0;x<w;x++){ var idx=(y*w+x)*4; var dist=Math.sqrt((x-cx)*(x-cx)+(y-cy)*(y-cy)); var f=1-(dist/maxd)*st; if(f<0.2)f=0.2; d[idx]*=f; d[idx+1]*=f; d[idx+2]*=f; } } })(idt.data,w,h,{strength:strength}); ctx.putImageData(idt,0,0);
      dataUrl=canvas.toDataURL("image/png");
      var pv=$("#pv"); pv.innerHTML=""; var o=new Image(); o.src=dataUrl; pv.appendChild(o); $("#download").disabled=false;
      PHT.status(statusEl,"已处理，可下载","ok");
    }catch(e){ PHT.status(statusEl,"处理失败："+e.message,"error"); }
  }
  fileInput.addEventListener("change",function(){ loadFile(fileInput.files[0]); });
  ["strength"].forEach(function(k){ $("#"+k).addEventListener("input",render); $("#"+k).addEventListener("change",render); });
  $("#download").addEventListener("click",function(){ if(dataUrl) PHT.download("image-vignette.png", dataUrl); });
})();
</script>
</body>
</html>
