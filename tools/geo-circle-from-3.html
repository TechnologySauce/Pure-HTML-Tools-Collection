<script>try{var t=localStorage.getItem("pht-theme");if(t!=="light"&&t!=="dark"){t=window.matchMedia&&window.matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light"}document.documentElement.setAttribute("data-theme",t)}catch(e){document.documentElement.setAttribute("data-theme","light")}</script>

<body>
<header class="toolbar">
  <div class="toolbar-inner">
    <a class="brand" href="../index.html"><img src="../assets/favicon.svg" alt="" width="24" height="24"><span>纯 HTML 工具箱</span></a>
    <span class="spacer"></span>
    <a class="btn ghost" href="../index.html">返回首页</a>
    <button class="icon-btn" type="button" data-theme-toggle aria-label="切换深色主题" aria-pressed="false"><svg class="i-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"></circle><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M19.1 4.9l-1.4 1.4M6.3 17.7l-1.4 1.4"></path></svg><svg class="i-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 14.5A8.5 8.5 0 0 1 9.5 4 8.5 8.5 0 1 0 20 14.5Z"></path></svg></button>
  </div>
</header>

<main class="shell">
  <div class="page-head">
    <span class="badge">计算 · 本地处理</span>
    <h1>三点定圆</h1>
    <p>由不共线的三点求外接圆的圆心与半径。</p>
  </div>

  <section class="panel">
<div class="grid-2">
  <div class="field"><label for="x1">点1 x</label><input type="number" id="x1" value="0"></div>
  <div class="field"><label for="y1">点1 y</label><input type="number" id="y1" value="0"></div>
  <div class="field"><label for="x2">点2 x</label><input type="number" id="x2" value="4"></div>
  <div class="field"><label for="y2">点2 y</label><input type="number" id="y2" value="0"></div>
  <div class="field"><label for="x3">点3 x</label><input type="number" id="x3" value="2"></div>
  <div class="field"><label for="y3">点3 y</label><input type="number" id="y3" value="3"></div>
</div>
<dl class="stat-row" style="margin-top:16px">
  <div class="stat"><dt>圆心 x</dt><dd id="cx">—</dd></div>
  <div class="stat"><dt>圆心 y</dt><dd id="cy">—</dd></div>
  <div class="stat"><dt>半径</dt><dd id="r">—</dd></div>
</dl>
<p class="status" id="status" aria-live="polite"></p>
  </section>

  <footer class="foot">
    <span>所有处理都在浏览器本地完成，数据不会上传。</span>
    <a href="../index.html">返回全部工具</a>
  </footer>
</main>

<script data-inline="assets/tool-base.js"></script>
<script>
(function(){
  var $=PHT.$; var statusEl=$("#status");
  function fnum(n){ if(n===null||n===undefined||!isFinite(n)) return "—"; var a=Math.round(n*1e6)/1e6; return a.toLocaleString("zh-CN",{maximumFractionDigits:6}); }
  var compute = function compute(args){ 
      var A = a.x1 * (a.y2 - a.y3) + a.x2 * (a.y3 - a.y1) + a.x3 * (a.y1 - a.y2);
      if (Math.abs(A) < 1e-12) return { __msg: "三点共线，无法确定圆", __type: "error" };
      var cx = (a.x1 * a.x1 + a.y1 * a.y1) * (a.y2 - a.y3) + (a.x2 * a.x2 + a.y2 * a.y2) * (a.y3 - a.y1) + (a.x3 * a.x3 + a.y3 * a.y3) * (a.y1 - a.y2);
      var cy = (a.x1 * a.x1 + a.y1 * a.y1) * (a.x3 - a.x2) + (a.x2 * a.x2 + a.y2 * a.y2) * (a.x1 - a.x3) + (a.x3 * a.x3 + a.y3 * a.y3) * (a.x2 - a.x1);
      cx /= 2 * A; cy /= 2 * A;
      return { cx: cx, cy: cy, r: Math.hypot(cx - a.x1, cy - a.y1) };
     };
  function run(){ var args={};
    args["x1"]=parseFloat($("#x1").value);
    args["y1"]=parseFloat($("#y1").value);
    args["x2"]=parseFloat($("#x2").value);
    args["y2"]=parseFloat($("#y2").value);
    args["x3"]=parseFloat($("#x3").value);
    args["y3"]=parseFloat($("#y3").value);
    try { var r=compute(args);
    if(r&&r["cx"]!==undefined){ var v=r["cx"]; $("#cx").textContent=(typeof v==="number")?fnum(v):v; }
    if(r&&r["cy"]!==undefined){ var v=r["cy"]; $("#cy").textContent=(typeof v==="number")?fnum(v):v; }
    if(r&&r["r"]!==undefined){ var v=r["r"]; $("#r").textContent=(typeof v==="number")?fnum(v):v; }
      PHT.status(statusEl,(r&&r.__msg)||"计算完成",(r&&r.__type)||"ok"); } catch(e){ PHT.status(statusEl,"出错了："+e.message,"error"); }
  }
  ["x1","y1","x2","y2","x3","y3"].forEach(function(k){ $("#"+k).addEventListener("input",run); $("#"+k).addEventListener("change",run); });
  run();
})();
</script>
</body>
