<script data-inline="assets/tool-base.js"></script>
<script>
(function(){var $=PHT.$;var inp=$("#inp"),out=$("#out");function run(){var s=inp.value.trim().toLowerCase();if(!s){out.textContent="";return;}var d=0,w=/(d+)s*w/.exec(s),dd=w?+w[1]:0;var h=/(d+)s*h/.exec(s),hh=h?+h[1]:0;var m=/(d+)s*m/.exec(s),mm=m?+m[1]:0;var sec=/(d+)s*s/.exec(s),ss=sec?+sec[1]:0;d=(dd*7+hh)*24*3600+mm*60+ss;var parts=[];if(dd)parts.push(dd+" 周");if(hh)parts.push(hh+" 小时");if(mm)parts.push(mm+" 分");if(ss)parts.push(ss+" 秒");out.textContent="总秒数: "+d+"\n分解: "+(parts.join(" ")||"0 秒");}inp.addEventListener("input",run);run();})();
</script>
