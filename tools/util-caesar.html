<div class="field"><label>文本</label><textarea id="inp" rows="4" placeholder="Hello"></textarea></div><div class="field"><label>位移</label><input id="shift" type="number" value="3"><button id="go" class="btn">加密</button> <button id="cp" class="btn ghost">复制</button></div><div class="field"><label>结果</label><pre id="out"></pre></div>

<script>
(function(){var $=PHT.$;var inp=$("#inp"),shift=$("#shift"),out=$("#out"),go=$("#go"),cp=$("#cp");function caesar(s,sh){sh=((sh%26)+26)%26;return s.replace(/[a-z]/gi,function(c){var base=c<="Z"?65:97;return String.fromCharCode((c.charCodeAt(0)-base+sh)%26+base);});}function run(){out.textContent=caesar(inp.value,shift.value*1);}go.addEventListener("click",run);inp.addEventListener("input",run);shift.addEventListener("input",run);cp.addEventListener("click",function(){PHT.copy(out.textContent).then(function(){PHT.flash(cp,"已复制");});});run();})();
</script>
