(function () {
  "use strict";

  var root = document.documentElement;
  var KEY = "pht-theme";

  function readStored() {
    try {
      var v = localStorage.getItem(KEY);
      return v === "light" || v === "dark" ? v : null;
    } catch (e) {
      return null;
    }
  }

  function setTheme(theme, persist) {
    root.setAttribute("data-theme", theme);
    var btn = document.querySelector("[data-theme-toggle]");
    if (btn) {
      btn.setAttribute("aria-pressed", theme === "dark" ? "true" : "false");
      btn.setAttribute("aria-label", theme === "dark" ? "切换到浅色主题" : "切换到深色主题");
      btn.setAttribute("title", theme === "dark" ? "切换到浅色主题" : "切换到深色主题");
    }
    if (persist) {
      try {
        localStorage.setItem(KEY, theme);
      } catch (e) {
        /* 忽略私有模式写入失败 */
      }
    }
  }

  setTheme(root.getAttribute("data-theme") === "dark" ? "dark" : "light", false);

  var toggle = document.querySelector("[data-theme-toggle]");
  if (toggle) {
    toggle.addEventListener("click", function () {
      setTheme(root.getAttribute("data-theme") === "dark" ? "light" : "dark", true);
    });
  }

  if (window.matchMedia) {
    var media = window.matchMedia("(prefers-color-scheme: dark)");
    var onChange = function (e) {
      if (!readStored()) setTheme(e.matches ? "dark" : "light", false);
    };
    if (media.addEventListener) media.addEventListener("change", onChange);
    else if (media.addListener) media.addListener(onChange);
  }

  function legacyCopy(text) {
    var ta = document.createElement("textarea");
    ta.value = text;
    ta.setAttribute("readonly", "");
    ta.style.position = "fixed";
    ta.style.top = "-1000px";
    ta.style.opacity = "0";
    document.body.appendChild(ta);
    var ok = false;
    try {
      ta.select();
      ta.setSelectionRange(0, ta.value.length);
      ok = document.execCommand("copy");
    } catch (e) {
      ok = false;
    }
    document.body.removeChild(ta);
    return ok;
  }

  function copyText(text) {
    if (navigator.clipboard && window.isSecureContext) {
      return navigator.clipboard.writeText(text).then(
        function () {
          return true;
        },
        function () {
          return legacyCopy(text);
        }
      );
    }
    return Promise.resolve(legacyCopy(text));
  }

  function flash(btn, label) {
    if (!btn) return;
    if (!btn.__label) btn.__label = btn.innerHTML;
    btn.textContent = label || "已复制";
    clearTimeout(btn.__flashTimer);
    btn.__flashTimer = setTimeout(function () {
      btn.innerHTML = btn.__label;
    }, 1400);
  }

  function setStatus(el, text, type) {
    if (!el) return;
    el.textContent = text || "";
    el.classList.remove("error", "ok");
    if (type === "error" || type === "ok") el.classList.add(type);
  }

  function download(filename, data, mime) {
    var blob = data instanceof Blob ? data : new Blob([data], { type: mime || "text/plain;charset=utf-8" });
    var url = URL.createObjectURL(blob);
    var a = document.createElement("a");
    a.href = url;
    a.download = filename;
    a.rel = "noopener";
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(function () {
      URL.revokeObjectURL(url);
    }, 1000);
  }

  function bytes(n) {
    if (!isFinite(n) || n < 0) return "-";
    var units = ["B", "KB", "MB", "GB"];
    var i = 0;
    while (n >= 1024 && i < units.length - 1) {
      n /= 1024;
      i++;
    }
    return (i === 0 ? n : n.toFixed(n >= 100 ? 0 : 1)) + " " + units[i];
  }

  function debounce(fn, wait) {
    var t;
    return function () {
      var args = arguments;
      var ctx = this;
      clearTimeout(t);
      t = setTimeout(function () {
        fn.apply(ctx, args);
      }, wait);
    };
  }

  window.PHT = {
    $: function (sel, scope) {
      return (scope || document).querySelector(sel);
    },
    $$: function (sel, scope) {
      return Array.prototype.slice.call((scope || document).querySelectorAll(sel));
    },
    copy: copyText,
    flash: flash,
    status: setStatus,
    download: download,
    bytes: bytes,
    debounce: debounce,
    setTheme: setTheme
  };
})();
/* inline:assets/tool-base.js:end */
</script>
<script>
(function () {
  "use strict";
  var $ = PHT.$;
  var input = $("#caseIn");
  var output = $("#caseOut");
  var statusEl = $("#status");
  var auto = $("#autoConvert");
  var modesWrap = $("#modes");
  var current = "upper";

  function words(str) {
    return str
      .replace(/([a-z0-9])([A-Z])/g, "$1 $2")
      .replace(/([A-Z]+)([A-Z][a-z])/g, "$1 $2")
      .split(/[^A-Za-z0-9\u00C0-\u024F]+/)
      .filter(Boolean);
  }

  function capitalize(w) {
    return w.charAt(0).toUpperCase() + w.slice(1).toLowerCase();
  }

  function titleCase(str) {
    return str.toLowerCase().replace(/(^|[\s\-_/.(\[{])([a-z\u00E0-\u00FF])/g, function (m, p, c) {
      return p + c.toUpperCase();
    });
  }

  function sentenceCase(str) {
    return str.toLowerCase().replace(/(^\s*[a-z\u00E0-\u00FF])|([.!?。！？]\s*[a-z\u00E0-\u00FF])/g, function (m) {
      return m.toUpperCase();
    });
  }

  var transforms = {
    upper: function (s) { return s.toUpperCase(); },
    lower: function (s) { return s.toLowerCase(); },
    title: titleCase,
    sentence: sentenceCase,
    camel: function (s) {
      var w = words(s);
      if (!w.length) return "";
      return w[0].toLowerCase() + w.slice(1).map(capitalize).join("");
    },
    pascal: function (s) {
      return words(s).map(capitalize).join("");
    },
    snake: function (s) {
      return words(s).map(function (w) { return w.toLowerCase(); }).join("_");
    },
    kebab: function (s) {
      return words(s).map(function (w) { return w.toLowerCase(); }).join("-");
    },
    constant: function (s) {
      return words(s).map(function (w) { return w.toUpperCase(); }).join("_");
    },
    dot: function (s) {
      return words(s).map(function (w) { return w.toLowerCase(); }).join(".");
    },
    reverse: function (s) {
      return Array.from(s).reverse().join("");
    }
  };

  function apply(showStatus) {
    var value = input.value;
    if (!value) {
      output.value = "";
      if (showStatus) PHT.status(statusEl, "请先输入内容");
      return;
    }
    try {
      output.value = transforms[current](value);
      if (showStatus) PHT.status(statusEl, "已按 “" + labelOf(current) + "” 转换", "ok");
    } catch (e) {
      output.value = "";
      PHT.status(statusEl, "转换失败：" + e.message, "error");
    }
  }

  function labelOf(mode) {
    var btn = modesWrap.querySelector('[data-mode="' + mode + '"]');
    return btn ? btn.textContent : mode;
  }

  function setMode(mode) {
    if (!transforms[mode]) return;
    current = mode;
    PHT.$$(".mode-btn", modesWrap).forEach(function (btn) {
      btn.setAttribute("aria-pressed", btn.getAttribute("data-mode") === mode ? "true" : "false");
    });
    apply(true);
  }

  modesWrap.addEventListener("click", function (e) {
    var btn = e.target.closest(".mode-btn");
    if (btn) setMode(btn.getAttribute("data-mode"));
  });

  input.addEventListener("input", function () {
    if (auto.checked) apply(false);
  });

  $("#copyBtn").addEventListener("click", function () {
    if (!output.value) {
      PHT.status(statusEl, "没有可复制的内容", "error");
      return;
    }
    PHT.copy(output.value).then(function (ok) {
      if (ok) PHT.flash($("#copyBtn"), "已复制");
      PHT.status(statusEl, ok ? "结果已复制" : "复制失败，请手动选择", ok ? "ok" : "error");
    });
  });

  $("#toInputBtn").addEventListener("click", function () {
    if (!output.value) {
      PHT.status(statusEl, "没有可替换的内容", "error");
      return;
    }
    input.value = output.value;
    apply(false);
    PHT.status(statusEl, "已将结果写回输入框", "ok");
  });

  $("#downloadBtn").addEventListener("click", function () {
    if (!output.value) {
      PHT.status(statusEl, "没有可下载的内容", "error");
      return;
    }
    PHT.download("text-case.txt", output.value, "text/plain;charset=utf-8");
  });

  $("#clearBtn").addEventListener("click", function () {
    input.value = "";
    output.value = "";
    PHT.status(statusEl, "");
    input.focus();
  });

  setMode("upper");
  input.focus();
})();
</script>
</body>
</html>
