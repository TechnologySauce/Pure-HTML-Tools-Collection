<main class="shell">
  <div class="page-head">
    <span class="badge">计算 · 本地处理</span>
    <h1>加权平均值</h1>
    <p>按权重计算一组数值的加权平均值。</p>
  </div>

  <section class="panel">
<div class="grid-2">
  <div class="field"><label for="vals">数值（逗号分隔）</label><input type="text" id="vals" value="80, 90, 70"></div>
  <div class="field"><label for="weights">权重（逗号分隔）</label><input type="text" id="weights" value="2, 3, 1"></div>
</div>
<dl class="stat-row" style="margin-top:16px">
  <div class="stat"><dt>加权均值</dt><dd id="res">—</dd></div>
</dl>
<p class="status" id="status" aria-live="polite"></p>
  </section>

  <footer class="foot">
    <span>所有处理都在浏览器本地完成，数据不会上传。</span>
    <a href="../index.html">返回全部工具</a>
  </footer>
</main>

<script data-inline="assets/tool-base.js"></script>
<script>
(function(){
  var $=PHT.$; var statusEl=$("#status");
  function fnum(n){ if(n===null||n===undefined||!isFinite(n)) return "—"; var a=Math.round(n*1e6)/1e6; return a.toLocaleString("zh-CN",{maximumFractionDigits:6}); }
  var compute = function compute(args){  function p(s) { return s.split(",").map(function (x) { return parseFloat(x); }).filter(function (x) { return !isNaN(x); }); } var v = p(a.vals), w = p(a.weights); if (v.length !== w.length || v.length === 0) return { res: "数值与权重数量需一致" }; var sw = 0, sv = 0; for (var i = 0; i < v.length; i++) { sv += v[i] * w[i]; sw += w[i]; } return { res: sw === 0 ? "权重和为 0" : sv / sw };  };
  function run(){ var args={};
    args["vals"]=$("#vals").value;
    args["weights"]=$("#weights").value;
    try { var r=compute(args);
    if(r&&r["res"]!==undefined){ var v=r["res"]; $("#res").textContent=(typeof v==="number")?fnum(v):v; }
      PHT.status(statusEl,(r&&r.__msg)||"计算完成",(r&&r.__type)||"ok"); } catch(e){ PHT.status(statusEl,"出错了："+e.message,"error"); }
  }
  ["vals","weights"].forEach(function(k){ $("#"+k).addEventListener("input",run); $("#"+k).addEventListener("change",run); });
  run();
})();
</script>
