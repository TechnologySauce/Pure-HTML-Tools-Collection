<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<link rel="icon" href="../assets/favicon.svg" type="image/svg+xml">
<script type="application/json" id="tool-meta">{"title":"统计汇总","desc":"一次性给出计数、和、均值、中位数、众数、方差、标准差、极差、最小/最大值。","category":"calc","tags":["统计","汇总","描述统计"],"order":2385}</script>
<script>try{var t=localStorage.getItem("pht-theme");if(t!=="light"&&t!=="dark"){t=window.matchMedia&&window.matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light"}document.documentElement.setAttribute("data-theme",t)}catch(e){document.documentElement.setAttribute("data-theme","light")}</script>

</head>
<body>
<header class="toolbar">
  <div class="toolbar-inner">
    <a class="brand" href="../index.html"><img src="../assets/favicon.svg" alt="" width="24" height="24"><span>纯 HTML 工具箱</span></a>
    <span class="spacer"></span>
    <a class="btn ghost" href="../index.html">返回首页</a>
    <button class="icon-btn" type="button" data-theme-toggle aria-label="切换深色主题" aria-pressed="false"><svg class="i-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"></circle><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M19.1 4.9l-1.4 1.4M6.3 17.7l-1.4 1.4"></path></svg><svg class="i-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 14.5A8.5 8.5 0 0 1 9.5 4 8.5 8.5 0 1 0 20 14.5Z"></path></svg></button>
  </div>
</header>

<main class="shell">
  <div class="page-head">
    <span class="badge">计算 · 本地处理</span>
    <h1>统计汇总</h1>
    <p>一次性给出计数、和、均值、中位数、众数、方差、标准差、极差、最小/最大值。</p>
  </div>

  <section class="panel">
<div class="grid-2">
  <div class="field"><label for="x">数据（逗号/空格分隔）</label><input type="text" id="x" value="3, 7, 2, 9, 5, 8, 1, 6"></div>
</div>
<dl class="stat-row" style="margin-top:16px">
  <div class="stat"><dt>计数</dt><dd id="n">—</dd></div>
  <div class="stat"><dt>和</dt><dd id="sum">—</dd></div>
  <div class="stat"><dt>均值</dt><dd id="mean">—</dd></div>
  <div class="stat"><dt>中位数</dt><dd id="median">—</dd></div>
  <div class="stat"><dt>众数</dt><dd id="mode">—</dd></div>
  <div class="stat"><dt>方差</dt><dd id="vari">—</dd></div>
  <div class="stat"><dt>标准差</dt><dd id="sd">—</dd></div>
  <div class="stat"><dt>极差</dt><dd id="range">—</dd></div>
  <div class="stat"><dt>最小</dt><dd id="min">—</dd></div>
  <div class="stat"><dt>最大</dt><dd id="max">—</dd></div>
</dl>
<p class="status" id="status" aria-live="polite"></p>
  </section>

  <footer class="foot">
    <span>所有处理都在浏览器本地完成，数据不会上传。</span>
    <a href="../index.html">返回全部工具</a>
  </footer>
</main>

<script data-inline="assets/tool-base.js"></script>
<script>
(function(){
  var $=PHT.$; var statusEl=$("#status");
  function fnum(n){ if(n===null||n===undefined||!isFinite(n)) return "—"; var a=Math.round(n*1e6)/1e6; return a.toLocaleString("zh-CN",{maximumFractionDigits:6}); }
  var compute = function compute(args){  function p(s) { return s.split(/[\s,;]+/).map(Number).filter(function (x) { return !isNaN(x); }); } var d = p(a.x); if (d.length === 0) return { n: 0, sum: "—", mean: "—", median: "—", mode: "—", vari: "—", sd: "—", range: "—", min: "—", max: "—" }; var n = d.length, sum = d.reduce(function (s, x) { return s + x; }, 0), mean = sum / n; var sd = d.slice().sort(function (p, c) { return p - c; }); var med = n % 2 ? sd[(n - 1) / 2] : (sd[n / 2 - 1] + sd[n / 2]) / 2; var f = {}, mode = d[0], mc = 0; d.forEach(function (x) { f[x] = (f[x] || 0) + 1; if (f[x] > mc) { mc = f[x]; mode = x; } }); var v = d.reduce(function (s, x) { return s + (x - mean) * (x - mean); }, 0) / n; return { n: n, sum: sum, mean: mean, median: med, mode: mode, vari: v, sd: Math.sqrt(v), range: sd[n - 1] - sd[0], min: sd[0], max: sd[n - 1] };  };
  function run(){ var args={};
    args["x"]=$("#x").value;
    try { var r=compute(args);
    if(r&&r["n"]!==undefined){ var v=r["n"]; $("#n").textContent=(typeof v==="number")?fnum(v):v; }
    if(r&&r["sum"]!==undefined){ var v=r["sum"]; $("#sum").textContent=(typeof v==="number")?fnum(v):v; }
    if(r&&r["mean"]!==undefined){ var v=r["mean"]; $("#mean").textContent=(typeof v==="number")?fnum(v):v; }
    if(r&&r["median"]!==undefined){ var v=r["median"]; $("#median").textContent=(typeof v==="number")?fnum(v):v; }
    if(r&&r["mode"]!==undefined){ var v=r["mode"]; $("#mode").textContent=(typeof v==="number")?fnum(v):v; }
    if(r&&r["vari"]!==undefined){ var v=r["vari"]; $("#vari").textContent=(typeof v==="number")?fnum(v):v; }
    if(r&&r["sd"]!==undefined){ var v=r["sd"]; $("#sd").textContent=(typeof v==="number")?fnum(v):v; }
    if(r&&r["range"]!==undefined){ var v=r["range"]; $("#range").textContent=(typeof v==="number")?fnum(v):v; }
    if(r&&r["min"]!==undefined){ var v=r["min"]; $("#min").textContent=(typeof v==="number")?fnum(v):v; }
    if(r&&r["max"]!==undefined){ var v=r["max"]; $("#max").textContent=(typeof v==="number")?fnum(v):v; }
      PHT.status(statusEl,(r&&r.__msg)||"计算完成",(r&&r.__type)||"ok"); } catch(e){ PHT.status(statusEl,"出错了："+e.message,"error"); }
  }
  ["x"].forEach(function(k){ $("#"+k).addEventListener("input",run); $("#"+k).addEventListener("change",run); });
  run();
})();
</script>
</body>
</html>
