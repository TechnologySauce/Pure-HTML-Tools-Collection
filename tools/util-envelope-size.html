<script data-inline="assets/tool-base.js"></script>
<script>
(function(){
  var $=PHT.$; var statusEl=$("#status");
  function fnum(n){ if(n===null||n===undefined||!isFinite(n)) return "—"; var a=Math.round(n*1e6)/1e6; return a.toLocaleString("zh-CN",{maximumFractionDigits:6}); }
  var compute = function compute(args){  var t = { "#10": [241, 105], "A2": [111, 146], "A6": [121, 165], "C5": [162, 229], "C4": [229, 324], "DL": [110, 220] }; var r = t[a.size]; return { w: r[0], h: r[1] };  };
  function run(){ var args={};
    args["size"]=$("#size").value;
    try { var r=compute(args);
    if(r&&r["w"]!==undefined){ var v=r["w"]; $("#w").textContent=(typeof v==="number")?fnum(v):v; }
    if(r&&r["h"]!==undefined){ var v=r["h"]; $("#h").textContent=(typeof v==="number")?fnum(v):v; }
      PHT.status(statusEl,(r&&r.__msg)||"计算完成",(r&&r.__type)||"ok"); } catch(e){ PHT.status(statusEl,"出错了："+e.message,"error"); }
  }
  ["size"].forEach(function(k){ $("#"+k).addEventListener("input",run); $("#"+k).addEventListener("change",run); });
  run();
})();
</script>
