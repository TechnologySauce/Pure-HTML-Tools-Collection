<script>try{var t=localStorage.getItem("pht-theme");if(t!=="light"&&t!=="dark"){t=window.matchMedia&&window.matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light"}document.documentElement.setAttribute("data-theme",t)}catch(e){document.documentElement.setAttribute("data-theme","light")}</script>

  <div class="toolbar-inner">
    <a class="brand" href="../index.html"><img src="../assets/favicon.svg" alt="" width="24" height="24"><span>纯 HTML 工具箱</span></a>
    <span class="spacer"></span>

    <button class="icon-btn" type="button" data-theme-toggle aria-label="切换深色主题" aria-pressed="false"><svg class="i-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"></circle><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M19.1 4.9l-1.4 1.4M6.3 17.7l-1.4 1.4"></path></svg><svg class="i-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 14.5A8.5 8.5 0 0 1 9.5 4 8.5 8.5 0 1 0 20 14.5Z"></path></svg></button>

<main class="shell">
  <div class="page-head">
    <span class="badge">开发者 · 本地处理</span>
    <h1>CSV 转 JSON</h1>
    <p>将 CSV 文本（支持引号与转义）转换为 JSON 数组。</p>
  </div>

  <section class="panel">
<div class="field"><label>CSV 文本</label><textarea id="inp" rows="7" placeholder="name,age\nAlice,30\nBob,25"></textarea></div><div class="field"><button id="go" class="btn">转换</button> <button id="cp" class="btn ghost">复制</button></div><div class="field"><label>JSON 结果</label><pre id="out"></pre></div>
  </section>

  <footer class="foot">
    <span>所有处理都在浏览器本地完成，数据不会上传。</span>
    <a href="../index.html">返回全部工具</a>
  </footer>
</main>

<script data-inline="assets/tool-base.js"></script>
<script>
(function(){var $=PHT.$;var inp=$("#inp"),out=$("#out"),go=$("#go"),cp=$("#cp");function parseCSV(text){var rows=[],row=[],field="",i=0,inQ=false;while(i<text.length){var c=text[i];if(inQ){if(c==='"'){if(text[i+1]==='"'){field+='"';i+=2;continue;}inQ=false;i++;continue;}field+=c;i++;}else{if(c==='"'){inQ=true;i++;continue;}if(c===','){row.push(field);field="";i++;continue;}if(c==='\n'){row.push(field);rows.push(row);row=[];field="";i++;continue;}if(c==='\r'){i++;continue;}field+=c;i++;}}if(field.length>0||row.length>0){row.push(field);rows.push(row);}return rows;}function run(){var text=inp.value;if(!text.trim()){out.textContent="";return;}var rows=parseCSV(text);if(rows.length<1){out.textContent="空";return;}var head=rows[0],res=[];for(var r=1;r<rows.length;r++){if(rows[r].length===1&&rows[r][0]==="")continue;var o={};for(var c=0;c<head.length;c++){var val=rows[r][c]!==undefined?rows[r][c]:"";if(val!==""&&!isNaN(val)&&/^-?\d+(\.\d+)?$/.test(val))val=parseFloat(val);o[head[c]]=val;}res.push(o);}out.textContent=JSON.stringify(res,null,2);}go.addEventListener("click",run);inp.addEventListener("input",run);cp.addEventListener("click",function(){PHT.copy(out.textContent).then(function(){PHT.flash(cp,"已复制");});});run();})();
</script>
</body>
