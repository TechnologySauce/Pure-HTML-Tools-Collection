<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>图片信息查看 - 纯 HTML 工具箱</title>
<meta name="description" content="选择本地图片，读取文件名、类型、体积与像素尺寸，无需上传，所有信息在本地读取。">
<meta name="theme-color" content="#f6f5f1">
<link rel="icon" href="../assets/favicon.svg" type="image/svg+xml">
<script type="application/json" id="tool-meta">{"title":"图片信息查看","desc":"选择本地图片，读取文件名、类型、体积与像素尺寸，无需上传，所有信息在本地读取。","category":"image","tags":["图片","元数据","尺寸","体积"],"order":2}</script>
<script>try{var t=localStorage.getItem("pht-theme");if(t!=="light"&&t!=="dark"){t=window.matchMedia&&window.matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light"}document.documentElement.setAttribute("data-theme",t)}catch(e){document.documentElement.setAttribute("data-theme","light")}</script>
<style data-inline="assets/tool-base.css"></style>
<style></style>
</head>
<body>
<header class="toolbar">
  <div class="toolbar-inner">
    <a class="brand" href="../index.html"><img src="../assets/favicon.svg" alt="" width="24" height="24"><span>纯 HTML 工具箱</span></a>
    <span class="spacer"></span>
    <a class="btn ghost" href="../index.html">返回首页</a>
    <button class="icon-btn" type="button" data-theme-toggle aria-label="切换深色主题" aria-pressed="false"><svg class="i-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"></circle><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M19.1 4.9l-1.4 1.4M6.3 17.7l-1.4 1.4"></path></svg><svg class="i-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 14.5A8.5 8.5 0 0 1 9.5 4 8.5 8.5 0 1 0 20 14.5Z"></path></svg></button>
  </div>
</header>

<main class="shell">
  <div class="page-head">
    <span class="badge">图片 · 本地处理</span>
    <h1>图片信息查看</h1>
    <p>选择本地图片，读取文件名、类型、体积与像素尺寸，无需上传，所有信息在本地读取。</p>
  </div>

  <section class="panel">
<label class="drop" id="drop"><input type="file" id="fileInput" accept="image/*"><strong>拖入图片或点击选择</strong><span>查看文件名、类型、大小与尺寸</span></label>
<dl class="stat-row" style="margin-top:16px">
  <div class="stat"><dt>文件名</dt><dd id="mName">-</dd></div>
  <div class="stat"><dt>类型</dt><dd id="mType">-</dd></div>
  <div class="stat"><dt>大小</dt><dd id="mSize">-</dd></div>
  <div class="stat"><dt>尺寸</dt><dd id="mDims">-</dd></div>
</dl>
<p class="status" id="status" aria-live="polite"></p>
  </section>

  <footer class="foot">
    <span>所有处理都在浏览器本地完成，数据不会上传。</span>
    <a href="../index.html">返回全部工具</a>
  </footer>
</main>

<script data-inline="assets/tool-base.js"></script>
<script>
(function(){
  var $ = PHT.$;
  var statusEl=$("#status");
  function loadFile(file){
    if(!file||!/^image\//.test(file.type)){ PHT.status(statusEl,"请选择图片文件","error"); return; }
    $("#mName").textContent=file.name;
    $("#mType").textContent=file.type||"-";
    $("#mSize").textContent=PHT.bytes(file.size);
    var reader=new FileReader();
    reader.onload=function(e){
      var im=new Image();
      im.onload=function(){ $("#mDims").textContent=im.naturalWidth+" x "+im.naturalHeight+" px"; PHT.status(statusEl,"读取完成","ok"); };
      im.onerror=function(){ $("#mDims").textContent="无法读取"; PHT.status(statusEl,"无法解析图片尺寸","error"); };
      im.src=e.target.result;
    };
    reader.readAsDataURL(file);
  }
  var fileInput=$("#fileInput");
  fileInput.addEventListener("change",function(){ loadFile(fileInput.files[0]); });
})();
</script>
</body>
</html>
