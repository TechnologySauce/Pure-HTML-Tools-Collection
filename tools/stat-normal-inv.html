<script>
(function(){

  function fnum(n){ if(n===null||n===undefined||!isFinite(n)) return "—"; var a=Math.round(n*1e6)/1e6; return a.toLocaleString("zh-CN",{maximumFractionDigits:6}); }
  var compute = function compute(args){  function ninv(p) { if (p <= 0) return -Infinity; if (p >= 1) return Infinity; var a0 = [-3.969683028665376e1, 2.209460984245205e2, -2.759285104469687e2, 1.38357751867269e2, -3.066479806614716e1, 2.506628277459239]; var b = [-5.447609879822406e1, 1.615858368580409e2, -1.556989798598866e2, 6.680131188771972e1, -1.328068155288572e1]; var c = [-7.784894002430293e-3, -3.223964580411365e-1, -2.400758277161838, -2.549732539343734, 4.374664141464968, 2.938163982698783]; var d = [7.784695709041462e-3, 3.224671290700398e-1, 2.445134137142996, 3.754408661907416]; var p0 = p - 0.5; if (Math.abs(p0) < 0.42) { var q = p0 * p0; return q * (((((a0[0] * q + a0[1]) * q + a0[2]) * q + a0[3]) * q + a0[4]) * q + a0[5]) / (((((b[0] * q + b[1]) * q + b[2]) * q + b[3]) * q + b[4]) * q + 1); } var r = Math.sqrt(-Math.log(Math.min(p, 1 - p))); if (p < 0.5) r = -r; return (((((c[0] * r + c[1]) * r + c[2]) * r + c[3]) * r + c[4]) * r + c[5]) / (((((d[0] * r + d[1]) * r + d[2]) * r + d[3]) * r + 1)); } return { x: a.mu + a.sigma * ninv(a.p) };  };
  function run(){ var args={};
    args["p"]=parseFloat($("#p").value);
