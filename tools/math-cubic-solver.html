<main class="shell">
  <div class="page-head">
    <span class="badge">计算 · 本地处理</span>
    <h1>一元三次方程</h1>
    <p>数值求解 x³ + ax² + bx + c = 0 的实根。</p>
  </div>

  <section class="panel">
<div class="grid-2">
  <div class="field"><label for="a">a (x² 系数)</label><input type="number" id="a" value="0"></div>
  <div class="field"><label for="b">b (x 系数)</label><input type="number" id="b" value="-1"></div>
  <div class="field"><label for="c">c (常数)</label><input type="number" id="c" value="0"></div>
</div>
<dl class="stat-row" style="margin-top:16px">
  <div class="stat"><dt>根 1</dt><dd id="r1">—</dd></div>
  <div class="stat"><dt>根 2</dt><dd id="r2">—</dd></div>
  <div class="stat"><dt>根 3</dt><dd id="r3">—</dd></div>
</dl>
<p class="status" id="status" aria-live="polite"></p>
  </section>

  <footer class="foot">
    <span>所有处理都在浏览器本地完成，数据不会上传。</span>
    <a href="../index.html">返回全部工具</a>
  </footer>
</main>

<script data-inline="assets/tool-base.js"></script>
<script>
(function(){
  var $=PHT.$; var statusEl=$("#status");
  function fnum(n){ if(n===null||n===undefined||!isFinite(n)) return "—"; var a=Math.round(n*1e6)/1e6; return a.toLocaleString("zh-CN",{maximumFractionDigits:6}); }
  var compute = function compute(args){  function f(x) { return x * x * x + a.a * x * x + a.b * x + a.c; } function df(x) { return 3 * x * x + 2 * a.a * x + a.b; } var roots = [], guesses = [-10, -3, 0, 3, 10]; for (var g = 0; g < guesses.length; g++) { var x = guesses[g]; for (var it = 0; it < 60; it++) { var d = df(x); if (Math.abs(d) < 1e-12) break; var nx = x - f(x) / d; if (Math.abs(nx - x) < 1e-12) { x = nx; break; } x = nx; } var found = false; for (var k = 0; k < roots.length; k++) if (Math.abs(roots[k] - x) < 1e-7) found = true; if (!found && isFinite(x)) roots.push(Math.round(x * 1e9) / 1e9); } roots.sort(function (p, c) { return p - c; }); while (roots.length < 3) roots.push("—"); return { r1: roots[0], r2: roots[1], r3: roots[2] };  };
  function run(){ var args={};
    args["a"]=parseFloat($("#a").value);
    args["b"]=parseFloat($("#b").value);
    args["c"]=parseFloat($("#c").value);
    try { var r=compute(args);
    if(r&&r["r1"]!==undefined){ var v=r["r1"]; $("#r1").textContent=(typeof v==="number")?fnum(v):v; }
    if(r&&r["r2"]!==undefined){ var v=r["r2"]; $("#r2").textContent=(typeof v==="number")?fnum(v):v; }
    if(r&&r["r3"]!==undefined){ var v=r["r3"]; $("#r3").textContent=(typeof v==="number")?fnum(v):v; }
      PHT.status(statusEl,(r&&r.__msg)||"计算完成",(r&&r.__type)||"ok"); } catch(e){ PHT.status(statusEl,"出错了："+e.message,"error"); }
  }
  ["a","b","c"].forEach(function(k){ $("#"+k).addEventListener("input",run); $("#"+k).addEventListener("change",run); });
  run();
})();
</script>
</body>
