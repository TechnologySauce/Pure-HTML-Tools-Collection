age: 3"></textarea></div>

<script data-inline="assets/tool-base.js"></script>
<script>
(function(){
  var $=PHT.$; var statusEl=$("#status"); var out=$("#out");
  function transform(args){
 try { var lines = a.text.split("\n"), obj = {}, list = null, listKey = null; for (var i = 0; i < lines.length; i++) { var ln = lines[i]; if (!ln.trim() || ln.trim()[0] === "#") continue; var mm = ln.match(/^(\s*)-\s*(.*)$/); if (mm) { if (!list) { list = []; if (listKey) obj[listKey] = list; } list.push(mm[2]); continue; } var kv = ln.match(/^([\w\u4e00-\u9fa5]+):\s*(.*)$/); if (kv) { if (kv[2] === "") { list = null; listKey = kv[1]; obj[kv[1]] = obj[kv[1]] || null; } else { obj[kv[1]] = isNaN(kv[2]) ? kv[2] : +kv[2]; } } } return JSON.stringify(obj, null, 2); } catch (e) { return "解析失败：" + e.message; } 
  }
  function run(){ var args={};
    args["text"]=$("#text").value;
    try { out.value=transform(args); PHT.status(statusEl,"已处理","ok"); } catch(e){ PHT.status(statusEl,"出错了："+e.message,"error"); }
  }
  ["text"].forEach(function(k){ $("#"+k).addEventListener("input",run); $("#"+k).addEventListener("change",run); });
  $("#copy").addEventListener("click",function(){ if(!out.value){ PHT.status(statusEl,"没有内容","error"); return; } PHT.copy(out.value).then(function(ok){ PHT.flash($("#copy"),"已复制"); PHT.status(statusEl,ok?"已复制":"复制失败",ok?"ok":"error"); }); });
  run();
})();
</script>
