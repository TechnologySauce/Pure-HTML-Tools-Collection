<script>
(function(){var $=PHT.$;var lat=$("#lat"),lon=$("#lon"),d=$("#d"),out=$("#out");if(!d.value)d.value=new Date().toISOString().slice(0,10);function fmt(min){min=((min%1440)+1440)%1440;var h=Math.floor(min/60),m=Math.round(min%60);return (h<10?"0":"")+h+":"+(m<10?"0":"")+m;}function run(){var date=new Date(d.value+"T12:00:00");var N=Math.floor((date-new Date(date.getFullYear(),0,0))/86400000);var rad=Math.PI/180;var fy=2*Math.PI/365*(N-1);var eqTime=229.18*(0.000075+0.001868*Math.cos(fy)-0.032077*Math.sin(fy)-0.014615*Math.cos(2*fy)-0.040849*Math.sin(2*fy));var decl=0.006918-0.399912*Math.cos(fy)+0.070257*Math.sin(fy)-0.006758*Math.cos(2*fy)+0.000907*Math.sin(2*fy)-0.002697*Math.cos(3*fy)+0.00148*Math.sin(3*fy);var HA=Math.acos(Math.cos(90.833*rad)/(Math.cos(lat.value*rad)*Math.cos(decl))-Math.tan(lat.value*rad)*Math.tan(decl));var sr=720-4*(lon.value*1+HA*180/Math.PI)-eqTime;var ss=720-4*(lon.value*1-HA*180/Math.PI)-eqTime;var tz=date.getTimezoneOffset();out.textContent="日出: "+fmt(sr-tz)+"\n日落: "+fmt(ss-tz);}lat.addEventListener("input",run);lon.addEventListener("input",run);d.addEventListener("change",run);run();})();
</script>
