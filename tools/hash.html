<script>
/* inline:assets/tool-base.js:start */
/* 工具页公共脚本：构建时内联进每个工具 */
(function () {
  "use strict";

  var root = document.documentElement;
  var KEY = "pht-theme";

  function readStored() {
    try {
      var v = localStorage.getItem(KEY);
      return v === "light" || v === "dark" ? v : null;
    } catch (e) {
      return null;
    }
  }

  function setTheme(theme, persist) {
    root.setAttribute("data-theme", theme);
    var btn = document.querySelector("[data-theme-toggle]");
    if (btn) {
      btn.setAttribute("aria-pressed", theme === "dark" ? "true" : "false");
      btn.setAttribute("aria-label", theme === "dark" ? "切换到浅色主题" : "切换到深色主题");
      btn.setAttribute("title", theme === "dark" ? "切换到浅色主题" : "切换到深色主题");
    }
    if (persist) {
      try {
        localStorage.setItem(KEY, theme);
      } catch (e) {
        /* 忽略私有模式写入失败 */
      }
    }
  }

  setTheme(root.getAttribute("data-theme") === "dark" ? "dark" : "light", false);

  var toggle = document.querySelector("[data-theme-toggle]");
  if (toggle) {
    toggle.addEventListener("click", function () {
      setTheme(root.getAttribute("data-theme") === "dark" ? "light" : "dark", true);
    });
  }

  if (window.matchMedia) {
    var media = window.matchMedia("(prefers-color-scheme: dark)");
    var onChange = function (e) {
      if (!readStored()) setTheme(e.matches ? "dark" : "light", false);
    };
    if (media.addEventListener) media.addEventListener("change", onChange);
    else if (media.addListener) media.addListener(onChange);
  }

  function legacyCopy(text) {
    var ta = document.createElement("textarea");
    ta.value = text;
    ta.setAttribute("readonly", "");
    ta.style.position = "fixed";
    ta.style.top = "-1000px";
    ta.style.opacity = "0";
    document.body.appendChild(ta);
    var ok = false;
    try {
      ta.select();
      ta.setSelectionRange(0, ta.value.length);
      ok = document.execCommand("copy");
    } catch (e) {
      ok = false;
    }
    document.body.removeChild(ta);
    return ok;
  }

  function copyText(text) {
    if (navigator.clipboard && window.isSecureContext) {
      return navigator.clipboard.writeText(text).then(
        function () {
          return true;
        },
        function () {
          return legacyCopy(text);
        }
      );
    }
    return Promise.resolve(legacyCopy(text));
  }

  function flash(btn, label) {
    if (!btn) return;
    if (!btn.__label) btn.__label = btn.innerHTML;
    btn.textContent = label || "已复制";
    clearTimeout(btn.__flashTimer);
    btn.__flashTimer = setTimeout(function () {
      btn.innerHTML = btn.__label;
    }, 1400);
  }

  function setStatus(el, text, type) {
    if (!el) return;
    el.textContent = text || "";
    el.classList.remove("error", "ok");
    if (type === "error" || type === "ok") el.classList.add(type);
  }

  function download(filename, data, mime) {
    var blob = data instanceof Blob ? data : new Blob([data], { type: mime || "text/plain;charset=utf-8" });
    var url = URL.createObjectURL(blob);
    var a = document.createElement("a");
    a.href = url;
    a.download = filename;
    a.rel = "noopener";
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(function () {
      URL.revokeObjectURL(url);
    }, 1000);
  }

  function bytes(n) {
    if (!isFinite(n) || n < 0) return "-";
    var units = ["B", "KB", "MB", "GB"];
    var i = 0;
    while (n >= 1024 && i < units.length - 1) {
      n /= 1024;
      i++;
    }
    return (i === 0 ? n : n.toFixed(n >= 100 ? 0 : 1)) + " " + units[i];
  }

  function debounce(fn, wait) {
    var t;
    return function () {
      var args = arguments;
      var ctx = this;
      clearTimeout(t);
      t = setTimeout(function () {
        fn.apply(ctx, args);
      }, wait);
    };
  }

  window.PHT = {
    $: function (sel, scope) {
      return (scope || document).querySelector(sel);
    },
    $$: function (sel, scope) {
      return Array.prototype.slice.call((scope || document).querySelectorAll(sel));
    },
    copy: copyText,
    flash: flash,
    status: setStatus,
    download: download,
    bytes: bytes,
    debounce: debounce,
    setTheme: setTheme
  };
})();
/* inline:assets/tool-base.js:end */
</script>
<script>
(function () {
  "use strict";
  var $ = PHT.$;
  var input = $("#hashInput");
  var list = $("#hashList");
  var statusEl = $("#status");
  var upperBox = $("#upperCase");
  var hmacBox = $("#useHmac");
  var hmacField = $("#hmacField");
  var hmacKey = $("#hmacKey");
  var fileInput = $("#hashFile");
  var fileNote = $("#fileNote");
  var activeFile = null;
  var runId = 0;

  var ALGOS = [
    { id: "md5", label: "MD5", subtle: null, size: 32 },
    { id: "sha1", label: "SHA-1", subtle: "SHA-1", size: 40 },
    { id: "sha256", label: "SHA-256", subtle: "SHA-256", size: 64 },
    { id: "sha384", label: "SHA-384", subtle: "SHA-384", size: 96 },
    { id: "sha512", label: "SHA-512", subtle: "SHA-512", size: 128 },
    { id: "crc32", label: "CRC32", subtle: null, size: 8 }
  ];

  // CRC32
  var crcTable = (function () {
    var table = new Uint32Array(256);
    for (var n = 0; n < 256; n++) {
      var c = n;
      for (var k = 0; k < 8; k++) c = c & 1 ? 0xedb88320 ^ (c >>> 1) : c >>> 1;
      table[n] = c >>> 0;
    }
    return table;
  })();

  function crc32(bytes) {
    var c = 0xffffffff;
    for (var i = 0; i < bytes.length; i++) c = crcTable[(c ^ bytes[i]) & 0xff] ^ (c >>> 8);
    return ((c ^ 0xffffffff) >>> 0).toString(16).padStart(8, "0");
  }

  // MD5（用于兼容旧系统校验，不用于安全场景）
  function md5(bytes) {
    var K = new Uint32Array(64);
    for (var i = 0; i < 64; i++) K[i] = Math.floor(Math.abs(Math.sin(i + 1)) * 4294967296) >>> 0;
    var S = [7, 12, 17, 22, 7, 12, 17, 22, 7, 12, 17, 22, 7, 12, 17, 22,
      5, 9, 14, 20, 5, 9, 14, 20, 5, 9, 14, 20, 5, 9, 14, 20,
      4, 11, 16, 23, 4, 11, 16, 23, 4, 11, 16, 23, 4, 11, 16, 23,
      6, 10, 15, 21, 6, 10, 15, 21, 6, 10, 15, 21, 6, 10, 15, 21];
    var blocks = ((bytes.length + 8) >> 6) + 1;
    var buf = new Uint8Array(blocks * 64);
    buf.set(bytes);
    buf[bytes.length] = 0x80;
    var view = new DataView(buf.buffer);
    var bits = bytes.length * 8;
    view.setUint32(blocks * 64 - 8, bits % 4294967296, true);
    view.setUint32(blocks * 64 - 4, Math.floor(bits / 4294967296), true);

    var a0 = 0x67452301;
    var b0 = 0xefcdab89;
    var c0 = 0x98badcfe;
    var d0 = 0x10325476;
    var M = new Uint32Array(16);

    for (var off = 0; off < blocks * 64; off += 64) {
      for (var j = 0; j < 16; j++) M[j] = view.getUint32(off + j * 4, true);
      var A = a0;
      var B = b0;
      var C = c0;
      var D = d0;
      for (var r = 0; r < 64; r++) {
        var F;
        var g;
        if (r < 16) {
          F = (B & C) | (~B & D);
          g = r;
        } else if (r < 32) {
          F = (D & B) | (~D & C);
          g = (5 * r + 1) % 16;
        } else if (r < 48) {
          F = B ^ C ^ D;
          g = (3 * r + 5) % 16;
        } else {
          F = C ^ (B | ~D);
          g = (7 * r) % 16;
        }
        var sum = (A + F + K[r] + M[g]) >>> 0;
        var rotated = ((sum << S[r]) | (sum >>> (32 - S[r]))) >>> 0;
        var next = (B + rotated) >>> 0;
        A = D;
        D = C;
        C = B;
        B = next;
      }
      a0 = (a0 + A) >>> 0;
      b0 = (b0 + B) >>> 0;
      c0 = (c0 + C) >>> 0;
      d0 = (d0 + D) >>> 0;
    }

    var result = new Uint8Array(16);
    var dv = new DataView(result.buffer);
    dv.setUint32(0, a0, true);
    dv.setUint32(4, b0, true);
    dv.setUint32(8, c0, true);
    dv.setUint32(12, d0, true);
    var hex = "";
    for (var x = 0; x < result.length; x++) hex += result[x].toString(16).padStart(2, "0");
    return hex;
  }

  function toHex(buffer) {
    var bytes = new Uint8Array(buffer);
    var hex = "";
    for (var i = 0; i < bytes.length; i++) hex += bytes[i].toString(16).padStart(2, "0");
    return hex;
  }

  function hasWebCrypto() {
    return !!(window.crypto && window.crypto.subtle);
  }

  function digest(algo, bytes) {
    return window.crypto.subtle.digest(algo, bytes).then(toHex);
  }

  function hmacDigest(algo, bytes, key) {
    var enc = new TextEncoder();
    return window.crypto.subtle
      .importKey("raw", enc.encode(key), { name: "HMAC", hash: algo }, false, ["sign"])
      .then(function (k) {
        return window.crypto.subtle.sign("HMAC", k, bytes);
      })
      .then(toHex);
  }

  // 构建结果行
  var rows = {};
  ALGOS.forEach(function (algo) {
    var row = document.createElement("div");
    row.className = "hash-row pending";
    var name = document.createElement("span");
    name.className = "algo";
    name.textContent = algo.label;
    var value = document.createElement("span");
    value.className = "value";
    value.textContent = "等待输入";
    var btn = document.createElement("button");
    btn.className = "btn ghost";
    btn.type = "button";
    btn.textContent = "复制";
    btn.disabled = true;
    btn.addEventListener("click", function () {
      var text = value.getAttribute("data-raw") || "";
      if (!text) return;
      PHT.copy(text).then(function (ok) {
        if (ok) PHT.flash(btn);
        PHT.status(statusEl, ok ? algo.label + " 已复制" : "复制失败，请手动选择", ok ? "ok" : "error");
      });
    });
    row.appendChild(name);
    row.appendChild(value);
    row.appendChild(btn);
    list.appendChild(row);
    rows[algo.id] = { row: row, value: value, btn: btn };
  });

  function currentBytes() {
    if (activeFile) return activeFile.bytes;
    return new TextEncoder().encode(input.value);
  }

  function currentLabel() {
    if (activeFile) return "文件 " + activeFile.name + "（" + PHT.bytes(activeFile.bytes.length) + "）";
    var len = Array.from(input.value).length;
    return len + " 个字符";
  }

  function render() {
    var id = ++runId;
    var bytes = currentBytes();
    var empty = !activeFile && input.value === "";
    var useHmac = hmacBox.checked;
    var key = hmacKey.value;

    if (empty) {
      ALGOS.forEach(function (algo) {
        rows[algo.id].value.textContent = "等待输入";
        rows[algo.id].value.removeAttribute("data-raw");
        rows[algo.id].btn.disabled = true;
        rows[algo.id].row.classList.add("pending");
      });
      PHT.status(statusEl, "");
      return;
    }

    if (useHmac && !hasWebCrypto()) {
      PHT.status(statusEl, "当前浏览器不支持 Web Crypto，无法计算 HMAC，请改用 https 打开页面", "error");
      return;
    }
    if (!useHmac && !hasWebCrypto()) {
      PHT.status(statusEl, "当前浏览器不支持 Web Crypto，只能计算 MD5 与 CRC32", "error");
    }

    ALGOS.forEach(function (algo) {
      var cell = rows[algo.id];
      cell.row.classList.remove("pending");

      function show(hex) {
        if (id !== runId) return;
        var text = upperBox.checked ? hex.toUpperCase() : hex.toLowerCase();
        cell.value.textContent = text;
        cell.value.setAttribute("data-raw", text);
        cell.btn.disabled = false;
      }
      function unavailable() {
        if (id !== runId) return;
        cell.value.textContent = "当前环境不可用";
        cell.value.removeAttribute("data-raw");
        cell.btn.disabled = true;
      }

      if (algo.id === "md5") return show(md5(bytes));
      if (algo.id === "crc32") return show(crc32(bytes));
      if (!hasWebCrypto()) return unavailable();
      if (useHmac) {
        hmacDigest(algo.subtle, bytes, key).then(show, function (e) {
          if (id !== runId) return;
          cell.value.textContent = "计算失败";
          PHT.status(statusEl, "HMAC 计算失败：" + (e && e.message ? e.message : e), "error");
        });
      } else {
        digest(algo.subtle, bytes).then(show, function (e) {
          if (id !== runId) return;
          cell.value.textContent = "计算失败";
          PHT.status(statusEl, "哈希计算失败：" + (e && e.message ? e.message : e), "error");
        });
      }
      return undefined;
    });

    if (useHmac && !key) {
      PHT.status(statusEl, "已启用 HMAC，但密钥为空：空密钥也会参与计算");
    } else {
      PHT.status(statusEl, (useHmac ? "HMAC " : "") + "计算完成 · " + currentLabel() + (upperBox.checked ? " · 大写" : ""), "ok");
    }
  }

  var debounced = PHT.debounce(render, 250);
  input.addEventListener("input", function () {
    activeFile = null;
    fileNote.classList.remove("show");
    fileNote.textContent = "";
    debounced();
  });
  upperBox.addEventListener("change", render);
  hmacBox.addEventListener("change", function () {
    hmacField.hidden = !hmacBox.checked;
    render();
  });
  hmacKey.addEventListener("input", PHT.debounce(render, 250));

  fileInput.addEventListener("change", function () {
    var file = fileInput.files && fileInput.files[0];
    if (!file) return;
    var reader = new FileReader();
    reader.onerror = function () {
      PHT.status(statusEl, "读取文件失败", "error");
    };
    reader.onload = function () {
      activeFile = { name: file.name, bytes: new Uint8Array(reader.result) };
      fileNote.textContent = "正在计算文件：" + file.name + "（" + PHT.bytes(file.size) + "）";
      fileNote.classList.add("show");
      render();
    };
    reader.readAsArrayBuffer(file);
  });

  $("#clearBtn").addEventListener("click", function () {
    input.value = "";
    activeFile = null;
    fileInput.value = "";
    fileNote.classList.remove("show");
    fileNote.textContent = "";
    render();
    input.focus();
  });

  render();
})();
</script>
</body>
</html>
