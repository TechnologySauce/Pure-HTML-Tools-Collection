<div class="field"><label>Unix 时间戳（秒）</label><input id="ts" type="number" placeholder="例如 1700000000"></div><div class="field"><label>结果</label><pre id="out"></pre></div><div class="field"><label>或选择日期时间 → Unix</label><input id="dt" type="datetime-local"> <button id="toTs" class="btn">转时间戳</button></div><div class="field"><label>Unix 结果</label><pre id="out2"></pre></div>

<script>
(function(){var $=PHT.$;var ts=$("#ts"),out=$("#out"),dt=$("#dt"),toTs=$("#toTs"),out2=$("#out2");function run(){var v=ts.value.trim();if(!v){out.textContent="";return;}var d=new Date(parseFloat(v)*1000);if(isNaN(d.getTime())){out.textContent="无效时间戳";return;}out.textContent="本地: "+d.toLocaleString()+"\nUTC: "+d.toUTCString()+"\nISO: "+d.toISOString();}function run2(){if(!dt.value){out2.textContent="";return;}var d=new Date(dt.value);out2.textContent="Unix(秒): "+Math.floor(d.getTime()/1000)+"\nUnix(毫秒): "+d.getTime();}ts.addEventListener("input",run);toTs.addEventListener("click",run2);dt.addEventListener("change",run2);run();})();
</script>
