<script>
(function(){var $=PHT.$;var expr=$("#expr"),out=$("#out"),go=$("#go");function run(){var s=expr.value.replace(/\s/g,"");if(!s){out.textContent="";return;}var ast,i;try{ast=parseExpr();}catch(e){out.textContent="解析错误: "+e.message;return;}var vars=[];(function collect(n){if(!n)return;if(n.var)vars.push(n.var);collect(n.a);collect(n.b);})(ast);vars=vars.filter(function(v,k){return vars.indexOf(v)===k;}).sort();if(vars.length>8){out.textContent="变量过多（最多 8 个）";return;}var lines=[];lines.push(vars.join(" ")+" | 结果");var total=1<<vars.length;for(var mask=0;mask<total;mask++){var val={};for(var v=0;v<vars.length;v++)val[vars[v]]=!!(mask&(1<<(vars.length-1-v)));var r=ev(ast,val);var row=vars.map(function(x){return val[x]?"1":"0";}).join(" ");lines.push(row+" | "+(r?"1":"0"));}out.textContent=lines.join("\n");}function parseExpr(){i=0;return parseOr();}function parseOr(){var v=parseXor();while(expr[i]==="|"){i++;v={op:"|",a:v,b:parseXor()};}return v;}function parseXor(){var v=parseAnd();while(expr[i]==="^"){i++;v={op:"^",a:v,b:parseAnd()};}return v;}function parseAnd(){var v=parseFactor();while(expr[i]==="&"){i++;v={op:"&",a:v,b:parseFactor()};}return v;}function parseFactor(){if(expr[i]==="!"){i++;return {op:"!",a:parseFactor()};}if(expr[i]==="("){i++;var e=parseExpr();i++;return e;}var c=expr[i];if(/[A-Za-z]/.test(c)){i++;return {var:c};}throw new Error("意外字符: "+c);}function ev(n,vars){if(n.op==="!")return !ev(n.a,vars);if(n.op==="&")return ev(n.a,vars)&&ev(n.b,vars);if(n.op==="^")return ev(n.a,vars)!==ev(n.b,vars);if(n.op==="|")return ev(n.a,vars)||ev(n.b,vars);return !!vars[n.var];}go.addEventListener("click",run);expr.addEventListener("input",run);run();})();
</script>
