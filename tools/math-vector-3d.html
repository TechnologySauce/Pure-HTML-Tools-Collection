<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>三维向量运算 - 纯 HTML 工具箱</title>
<meta name="description" content="计算两向量的点积、叉积、模长与夹角。">
<meta name="theme-color" content="#f6f5f1">
<link rel="icon" href="../assets/favicon.svg" type="image/svg+xml">
<script type="application/json" id="tool-meta">{"title":"三维向量运算","desc":"计算两向量的点积、叉积、模长与夹角。","category":"calc","tags":["向量","点积","叉积"],"order":2393}</script>
<script>try{var t=localStorage.getItem("pht-theme");if(t!=="light"&&t!=="dark"){t=window.matchMedia&&window.matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light"}document.documentElement.setAttribute("data-theme",t)}catch(e){document.documentElement.setAttribute("data-theme","light")}</script>
<style data-inline="assets/tool-base.css"></style>
<style></style>
</head>
<body>
<header class="toolbar">
  <div class="toolbar-inner">
    <a class="brand" href="../index.html"><img src="../assets/favicon.svg" alt="" width="24" height="24"><span>纯 HTML 工具箱</span></a>
    <span class="spacer"></span>
    <a class="btn ghost" href="../index.html">返回首页</a>
    <button class="icon-btn" type="button" data-theme-toggle aria-label="切换深色主题" aria-pressed="false"><svg class="i-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"></circle><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M19.1 4.9l-1.4 1.4M6.3 17.7l-1.4 1.4"></path></svg><svg class="i-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 14.5A8.5 8.5 0 0 1 9.5 4 8.5 8.5 0 1 0 20 14.5Z"></path></svg></button>
  </div>
</header>

<main class="shell">
  <div class="page-head">
    <span class="badge">计算 · 本地处理</span>
    <h1>三维向量运算</h1>
    <p>计算两向量的点积、叉积、模长与夹角。</p>
  </div>

  <section class="panel">
<div class="grid-2">
  <div class="field"><label for="u1">u₁</label><input type="number" id="u1" value="1"></div>
  <div class="field"><label for="u2">u₂</label><input type="number" id="u2" value="0"></div>
  <div class="field"><label for="u3">u₃</label><input type="number" id="u3" value="0"></div>
  <div class="field"><label for="v1">v₁</label><input type="number" id="v1" value="0"></div>
  <div class="field"><label for="v2">v₂</label><input type="number" id="v2" value="1"></div>
  <div class="field"><label for="v3">v₃</label><input type="number" id="v3" value="0"></div>
</div>
<dl class="stat-row" style="margin-top:16px">
  <div class="stat"><dt>点积</dt><dd id="dot">—</dd></div>
  <div class="stat"><dt>叉积</dt><dd id="cross">—</dd></div>
  <div class="stat"><dt>|u|</dt><dd id="mu">—</dd></div>
  <div class="stat"><dt>|v|</dt><dd id="mv">—</dd></div>
  <div class="stat"><dt>夹角(°)</dt><dd id="ang">—</dd></div>
</dl>
<p class="status" id="status" aria-live="polite"></p>
  </section>

  <footer class="foot">
    <span>所有处理都在浏览器本地完成，数据不会上传。</span>
    <a href="../index.html">返回全部工具</a>
  </footer>
</main>

<script data-inline="assets/tool-base.js"></script>
<script>
(function(){
  var $=PHT.$; var statusEl=$("#status");
  function fnum(n){ if(n===null||n===undefined||!isFinite(n)) return "—"; var a=Math.round(n*1e6)/1e6; return a.toLocaleString("zh-CN",{maximumFractionDigits:6}); }
  var compute = function compute(args){  var dot = a.u1 * a.v1 + a.u2 * a.v2 + a.u3 * a.v3; var cx = a.u2 * a.v3 - a.u3 * a.v2, cy = a.u3 * a.v1 - a.u1 * a.v3, cz = a.u1 * a.v2 - a.u2 * a.v1; var mu = Math.sqrt(a.u1 * a.u1 + a.u2 * a.u2 + a.u3 * a.u3), mv = Math.sqrt(a.v1 * a.v1 + a.v2 * a.v2 + a.v3 * a.v3); var ang = (mu * mv) === 0 ? "—" : Math.acos(dot / (mu * mv)) * 180 / Math.PI; return { dot: dot, cross: "(" + cx + ", " + cy + ", " + cz + ")", mu: mu, mv: mv, ang: ang };  };
  function run(){ var args={};
    args["u1"]=parseFloat($("#u1").value);
    args["u2"]=parseFloat($("#u2").value);
    args["u3"]=parseFloat($("#u3").value);
    args["v1"]=parseFloat($("#v1").value);
    args["v2"]=parseFloat($("#v2").value);
    args["v3"]=parseFloat($("#v3").value);
    try { var r=compute(args);
    if(r&&r["dot"]!==undefined){ var v=r["dot"]; $("#dot").textContent=(typeof v==="number")?fnum(v):v; }
    if(r&&r["cross"]!==undefined){ var v=r["cross"]; $("#cross").textContent=(typeof v==="number")?fnum(v):v; }
    if(r&&r["mu"]!==undefined){ var v=r["mu"]; $("#mu").textContent=(typeof v==="number")?fnum(v):v; }
    if(r&&r["mv"]!==undefined){ var v=r["mv"]; $("#mv").textContent=(typeof v==="number")?fnum(v):v; }
    if(r&&r["ang"]!==undefined){ var v=r["ang"]; $("#ang").textContent=(typeof v==="number")?fnum(v):v; }
      PHT.status(statusEl,(r&&r.__msg)||"计算完成",(r&&r.__type)||"ok"); } catch(e){ PHT.status(statusEl,"出错了："+e.message,"error"); }
  }
  ["u1","u2","u3","v1","v2","v3"].forEach(function(k){ $("#"+k).addEventListener("input",run); $("#"+k).addEventListener("change",run); });
  run();
})();
</script>
</body>
</html>
