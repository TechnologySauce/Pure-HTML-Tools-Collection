<script type="application/json" id="tool-meta">{"title":"运动消耗","desc":"按体重、时长与运动强度（MET）估算热量消耗。","category":"calc","tags":["卡路里","运动","健康"],"order":313}</script>
<script>try{var t=localStorage.getItem("pht-theme");if(t!=="light"&&t!=="dark"){t=window.matchMedia&&window.matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light"}document.documentElement.setAttribute("data-theme",t)}catch(e){document.documentElement.setAttribute("data-theme","light")}</script>

<body>
<header class="toolbar">
  <div class="toolbar-inner">
    <a class="brand" href="../index.html"><img src="../assets/favicon.svg" alt="" width="24" height="24"><span>纯 HTML 工具箱</span></a>
    <span class="spacer"></span>
    <a class="btn ghost" href="../index.html">返回首页</a>
    <button class="icon-btn" type="button" data-theme-toggle aria-label="切换深色主题" aria-pressed="false"><svg class="i-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"></circle><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M19.1 4.9l-1.4 1.4M6.3 17.7l-1.4 1.4"></path></svg><svg class="i-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 14.5A8.5 8.5 0 0 1 9.5 4 8.5 8.5 0 1 0 20 14.5Z"></path></svg></button>
  </div>
</header>

<main class="shell">
  <div class="page-head">
    <span class="badge">计算 · 本地处理</span>
    <h1>运动消耗</h1>
    <p>按体重、时长与运动强度（MET）估算热量消耗。</p>
  </div>

  <section class="panel">
<div class="grid-2">
  <div class="field"><label for="weight">体重 (kg)</label><input type="number" id="weight" value="65"></div>
  <div class="field"><label for="duration">时长 (分钟)</label><input type="number" id="duration" value="30"></div>
  <div class="field"><label for="met">强度 MET</label><select id="met"><option value="3.5">散步 3.5</option><option value="7">快走 7</option><option value="8">慢跑 8</option><option value="10">跑步 10</option></select></div>
</div>
<dl class="stat-row" style="margin-top:16px">
  <div class="stat"><dt>消耗 (kcal)</dt><dd id="kcal">—</dd></div>
</dl>
<p class="status" id="status" aria-live="polite"></p>
  </section>

  <footer class="foot">
    <span>所有处理都在浏览器本地完成，数据不会上传。</span>
    <a href="../index.html">返回全部工具</a>
  </footer>
</main>

<script data-inline="assets/tool-base.js"></script>
<script>
(function(){
  var $=PHT.$; var statusEl=$("#status");
  function fnum(n){ if(n===null||n===undefined||!isFinite(n)) return "—"; var a=Math.round(n*1e6)/1e6; return a.toLocaleString("zh-CN",{maximumFractionDigits:6}); }
  var compute = function(args){ return { "kcal":(parseFloat(args.met)*3.5*args.weight/200*args.duration) }; };
  function run(){ var args={};
    args["weight"]=parseFloat($("#weight").value);
    args["duration"]=parseFloat($("#duration").value);
    args["met"]=$("#met").value;
    try { var r=compute(args);
    if(r&&r["kcal"]!==undefined){ var v=r["kcal"]; $("#kcal").textContent=(typeof v==="number")?fnum(v):v; }
      PHT.status(statusEl,(r&&r.__msg)||"计算完成",(r&&r.__type)||"ok"); } catch(e){ PHT.status(statusEl,"出错了："+e.message,"error"); }
  }
  ["weight","duration","met"].forEach(function(k){ $("#"+k).addEventListener("input",run); $("#"+k).addEventListener("change",run); });
  run();
})();
</script>
</body>
</html>
