<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<meta name="description" content="在直角坐标 (a+bi) 与极坐标 (模长∠辐角) 之间互转。">
<meta name="theme-color" content="#f6f5f1">
<link rel="icon" href="../assets/favicon.svg" type="image/svg+xml">
<script type="application/json" id="tool-meta">{"title":"复数 直角↔极坐标","desc":"在直角坐标 (a+bi) 与极坐标 (模长∠辐角) 之间互转。","category":"calc","tags":["复数","极坐标","数学"],"order":3104}</script>
<script>try{var t=localStorage.getItem("pht-theme");if(t!=="light"&&t!=="dark"){t=window.matchMedia&&window.matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light"}document.documentElement.setAttribute("data-theme",t)}catch(e){document.documentElement.setAttribute("data-theme","light")}</script>

</head>
<body>
<header class="toolbar">
  <div class="toolbar-inner">
    <a class="brand" href="../index.html"><img src="../assets/favicon.svg" alt="" width="24" height="24"><span>纯 HTML 工具箱</span></a>
    <span class="spacer"></span>
    <a class="btn ghost" href="../index.html">返回首页</a>
    <button class="icon-btn" type="button" data-theme-toggle aria-label="切换深色主题" aria-pressed="false"><svg class="i-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"></circle><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M19.1 4.9l-1.4 1.4M6.3 17.7l-1.4 1.4"></path></svg><svg class="i-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 14.5A8.5 8.5 0 0 1 9.5 4 8.5 8.5 0 1 0 20 14.5Z"></path></svg></button>
  </div>
</header>

<main class="shell">
  <div class="page-head">
    <span class="badge">计算 · 本地处理</span>
    <h1>复数 直角↔极坐标</h1>
    <p>在直角坐标 (a+bi) 与极坐标 (模长∠辐角) 之间互转。</p>
  </div>

  <section class="panel">
<div class="grid-2">
  <div class="field"><label for="mode">转换方向</label><select id="mode"><option value="p2r">极坐标→直角</option><option value="r2p">直角→极坐标</option></select></div>
  <div class="field"><label for="r">模长 r</label><input type="number" id="r" value="5"></div>
  <div class="field"><label for="deg">辐角 (°)</label><input type="number" id="deg" value="53.13"></div>
  <div class="field"><label for="re">直角 实部 a</label><input type="number" id="re" value="3"></div>
  <div class="field"><label for="im">直角 虚部 b</label><input type="number" id="im" value="4"></div>
</div>
<dl class="stat-row" style="margin-top:16px">
  <div class="stat"><dt>直角 实部</dt><dd id="rr">—</dd></div>
  <div class="stat"><dt>直角 虚部</dt><dd id="ii">—</dd></div>
  <div class="stat"><dt>模长</dt><dd id="mm">—</dd></div>
  <div class="stat"><dt>辐角 (°)</dt><dd id="dd">—</dd></div>
</dl>
<p class="status" id="status" aria-live="polite"></p>
  </section>

  <footer class="foot">
    <span>所有处理都在浏览器本地完成，数据不会上传。</span>
    <a href="../index.html">返回全部工具</a>
  </footer>
</main>

<script data-inline="assets/tool-base.js"></script>
<script>
(function(){
  var $=PHT.$; var statusEl=$("#status");
  function fnum(n){ if(n===null||n===undefined||!isFinite(n)) return "—"; var a=Math.round(n*1e6)/1e6; return a.toLocaleString("zh-CN",{maximumFractionDigits:6}); }
  var compute = function compute(args){ 
      if (a.mode === "p2r") return { rr: a.r * Math.cos(a.deg * Math.PI / 180), ii: a.r * Math.sin(a.deg * Math.PI / 180) };
      var m = Math.sqrt(a.re * a.re + a.im * a.im);
      var ang = Math.atan2(a.im, a.re) * 180 / Math.PI;
      if (ang < 0) ang += 360;
      return { mm: m, dd: ang };
     };
  function run(){ var args={};
    args["mode"]=$("#mode").value;
    args["r"]=parseFloat($("#r").value);
    args["deg"]=parseFloat($("#deg").value);
    args["re"]=parseFloat($("#re").value);
    args["im"]=parseFloat($("#im").value);
    try { var r=compute(args);
    if(r&&r["rr"]!==undefined){ var v=r["rr"]; $("#rr").textContent=(typeof v==="number")?fnum(v):v; }
    if(r&&r["ii"]!==undefined){ var v=r["ii"]; $("#ii").textContent=(typeof v==="number")?fnum(v):v; }
    if(r&&r["mm"]!==undefined){ var v=r["mm"]; $("#mm").textContent=(typeof v==="number")?fnum(v):v; }
    if(r&&r["dd"]!==undefined){ var v=r["dd"]; $("#dd").textContent=(typeof v==="number")?fnum(v):v; }
      PHT.status(statusEl,(r&&r.__msg)||"计算完成",(r&&r.__type)||"ok"); } catch(e){ PHT.status(statusEl,"出错了："+e.message,"error"); }
  }
  ["mode","r","deg","re","im"].forEach(function(k){ $("#"+k).addEventListener("input",run); $("#"+k).addEventListener("change",run); });
  run();
})();
</script>
</body>
</html>
