<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<meta name="description" content="在 BMR 基础上按活动量估算每日总热量消耗。">
<meta name="theme-color" content="#f6f5f1">
<link rel="icon" href="../assets/favicon.svg" type="image/svg+xml">
<script type="application/json" id="tool-meta">{"title":"每日总消耗 TDEE","desc":"在 BMR 基础上按活动量估算每日总热量消耗。","category":"calc","tags":["TDEE","热量","健康"],"order":2265}</script>
<script>try{var t=localStorage.getItem("pht-theme");if(t!=="light"&&t!=="dark"){t=window.matchMedia&&window.matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light"}document.documentElement.setAttribute("data-theme",t)}catch(e){document.documentElement.setAttribute("data-theme","light")}</script>
<style data-inline="assets/tool-base.css"></style>
<style></style>
</head>
<body>
<header class="toolbar">
  <div class="toolbar-inner">
    <a class="brand" href="../index.html"><img src="../assets/favicon.svg" alt="" width="24" height="24"><span>纯 HTML 工具箱</span></a>
    <span class="spacer"></span>
    <a class="btn ghost" href="../index.html">返回首页</a>
    <button class="icon-btn" type="button" data-theme-toggle aria-label="切换深色主题" aria-pressed="false"><svg class="i-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"></circle><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M19.1 4.9l-1.4 1.4M6.3 17.7l-1.4 1.4"></path></svg><svg class="i-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 14.5A8.5 8.5 0 0 1 9.5 4 8.5 8.5 0 1 0 20 14.5Z"></path></svg></button>
  </div>
</header>

<main class="shell">
  <div class="page-head">
    <span class="badge">计算 · 本地处理</span>
    <h1>每日总消耗 TDEE</h1>
    <p>在 BMR 基础上按活动量估算每日总热量消耗。</p>
  </div>

  <section class="panel">
<div class="grid-2">
  <div class="field"><label for="sex">性别</label><select id="sex"><option value="M">男</option><option value="F">女</option></select></div>
  <div class="field"><label for="weight">体重 (kg)</label><input type="number" id="weight" value="65"></div>
  <div class="field"><label for="height">身高 (cm)</label><input type="number" id="height" value="170"></div>
  <div class="field"><label for="age">年龄</label><input type="number" id="age" value="30"></div>
  <div class="field"><label for="activity">活动量</label><select id="activity"><option value="1.2">久坐</option><option value="1.375">轻度</option><option value="1.55">中度</option><option value="1.725">高度</option><option value="1.9">极高</option></select></div>
</div>
<dl class="stat-row" style="margin-top:16px">
  <div class="stat"><dt>BMR (kcal)</dt><dd id="bmr">—</dd></div>
  <div class="stat"><dt>TDEE (kcal)</dt><dd id="tdee">—</dd></div>
</dl>
<p class="status" id="status" aria-live="polite"></p>
  </section>

  <footer class="foot">
    <span>所有处理都在浏览器本地完成，数据不会上传。</span>
    <a href="../index.html">返回全部工具</a>
  </footer>
</main>

<script data-inline="assets/tool-base.js"></script>
<script>
(function(){
  var $=PHT.$; var statusEl=$("#status");
  function fnum(n){ if(n===null||n===undefined||!isFinite(n)) return "—"; var a=Math.round(n*1e6)/1e6; return a.toLocaleString("zh-CN",{maximumFractionDigits:6}); }
  var compute = function compute(args){  var bmr = a.sex === "F" ? 447.593 + 9.247 * a.weight + 3.098 * a.height - 4.330 * a.age : 88.362 + 13.397 * a.weight + 4.799 * a.height - 5.677 * a.age; return { bmr: bmr, tdee: bmr * parseFloat(a.activity) };  };
  function run(){ var args={};
    args["sex"]=$("#sex").value;
    args["weight"]=parseFloat($("#weight").value);
    args["height"]=parseFloat($("#height").value);
    args["age"]=parseFloat($("#age").value);
    args["activity"]=$("#activity").value;
    try { var r=compute(args);
    if(r&&r["bmr"]!==undefined){ var v=r["bmr"]; $("#bmr").textContent=(typeof v==="number")?fnum(v):v; }
    if(r&&r["tdee"]!==undefined){ var v=r["tdee"]; $("#tdee").textContent=(typeof v==="number")?fnum(v):v; }
      PHT.status(statusEl,(r&&r.__msg)||"计算完成",(r&&r.__type)||"ok"); } catch(e){ PHT.status(statusEl,"出错了："+e.message,"error"); }
  }
  ["sex","weight","height","age","activity"].forEach(function(k){ $("#"+k).addEventListener("input",run); $("#"+k).addEventListener("change",run); });
  run();
})();
</script>
</body>
</html>
