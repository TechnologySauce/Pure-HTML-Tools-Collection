<main class="shell">

    <h1>JSON 转 Python 类</h1>
    <p>根据示例 JSON 生成 Python dataclass（含嵌套类）。</p>
  </div>

  <section class="panel">
  <div class="field"><label for="json">JSON</label><textarea id="json" class="code" spellcheck="false" rows="8" placeholder="{&quot;id&quot;:1,&quot;name&quot;:&quot;Tom&quot;,&quot;addr&quot;:{&quot;city&quot;:&quot;BJ&quot;}}"></textarea></div>
<div class="field" style="margin-top:14px"><label for="out">输出</label><textarea id="out" class="code" readonly spellcheck="false" placeholder="处理结果"></textarea></div>
<div class="actions">
  <button class="btn primary" id="copy" type="button">复制</button>
</div>
<p class="status" id="status" aria-live="polite"></p>
  </section>

  <footer class="foot">
    <span>所有处理都在浏览器本地完成，数据不会上传。</span>
    <a href="../index.html">返回全部工具</a>
  </footer>
</main>

<script data-inline="assets/tool-base.js"></script>
<script>
(function(){
  var $=PHT.$; var statusEl=$("#status"); var out=$("#out");
  function transform(args){
 var obj; try { obj = JSON.parse(args.json); } catch (e) { return "无效 JSON：" + e.message; } var classes = []; function cap(s) { return s.charAt(0).toUpperCase() + s.slice(1).replace(/[^A-Za-z0-9]/g, ""); } function ptype(v, name) { if (v === null) return "Any"; if (Array.isArray(v)) return "List[" + (v.length ? ptype(v[0], name + "Item") : "Any") + "]"; if (typeof v === "object") { pclass(v, name); return cap(name); } if (typeof v === "number") return "float"; if (typeof v === "boolean") return "bool"; return "str"; } function pclass(val, name) { var b = ["@dataclass", "class " + cap(name) + ":"]; Object.keys(val).forEach(function (k) { b.push("    " + k + ": " + ptype(val[k], cap(name + k))); }); classes.push(b.join("\n")); } ptype(obj, "Root"); return "from dataclasses import dataclass\nfrom typing import List, Any\n\n" + classes.join("\n\n"); 
  }
  function run(){ var args={};
    args["json"]=$("#json").value;
    try { out.value=transform(args); PHT.status(statusEl,"已处理","ok"); } catch(e){ PHT.status(statusEl,"出错了："+e.message,"error"); }
  }
  ["json"].forEach(function(k){ $("#"+k).addEventListener("input",run); $("#"+k).addEventListener("change",run); });
  $("#copy").addEventListener("click",function(){ if(!out.value){ PHT.status(statusEl,"没有内容","error"); return; } PHT.copy(out.value).then(function(ok){ PHT.flash($("#copy"),"已复制"); PHT.status(statusEl,ok?"已复制":"复制失败",ok?"ok":"error"); }); });
  run();
})();
</script>
