<script>try{var t=localStorage.getItem("pht-theme");if(t!=="light"&&t!=="dark"){t=window.matchMedia&&window.matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light"}document.documentElement.setAttribute("data-theme",t)}catch(e){document.documentElement.setAttribute("data-theme","light")}</script>

    <a class="btn ghost" href="../index.html">返回首页</a>

    <h1>按键码查询</h1>
    <p>按下任意键，显示其 key、code 与 keyCode。</p>
  </div>

  <section class="panel">
<div class="field"><label>在此区域按下按键</label><input id="k" type="text" placeholder="点击后按下任意键" style="font-size:18px;padding:12px;"></div><div class="field"><label>结果</label><pre id="out"></pre></div>
  </section>

  <footer class="foot">

  </footer>

<script data-inline="assets/tool-base.js"></script>
<script>
(function(){var $=PHT.$;var k=$("#k"),out=$("#out");k.addEventListener("keydown",function(e){e.preventDefault();out.textContent="key: "+JSON.stringify(e.key)+"\ncode: "+e.code+"\nkeyCode: "+e.keyCode+"\nwhich: "+e.which;});k.addEventListener("focus",function(){out.textContent="等待按键…";});})();
</script>
