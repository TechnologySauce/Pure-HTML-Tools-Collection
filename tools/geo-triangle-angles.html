<main class="shell">
  <div class="page-head">
    <span class="badge">计算 · 本地处理</span>
    <h1>三角形三角</h1>
    <p>已知三边长，求三个内角（度）。</p>
  </div>

  <section class="panel">
<div class="grid-2">
  <div class="field"><label for="a">边 a</label><input type="number" id="a" value="3"></div>
  <div class="field"><label for="b">边 b</label><input type="number" id="b" value="4"></div>
  <div class="field"><label for="c">边 c</label><input type="number" id="c" value="5"></div>
</div>
<dl class="stat-row" style="margin-top:16px">
  <div class="stat"><dt>角 A</dt><dd id="A">—</dd></div>
  <div class="stat"><dt>角 B</dt><dd id="B">—</dd></div>
  <div class="stat"><dt>角 C</dt><dd id="C">—</dd></div>
</dl>
<p class="status" id="status" aria-live="polite"></p>
  </section>

  <footer class="foot">
    <span>所有处理都在浏览器本地完成，数据不会上传。</span>
    <a href="../index.html">返回全部工具</a>
  </footer>
</main>

<script data-inline="assets/tool-base.js"></script>
<script>
(function(){
  var $=PHT.$; var statusEl=$("#status");
  function fnum(n){ if(n===null||n===undefined||!isFinite(n)) return "—"; var a=Math.round(n*1e6)/1e6; return a.toLocaleString("zh-CN",{maximumFractionDigits:6}); }
  var compute = function compute(args){  if (a.a + a.b <= a.c || a.a + a.c <= a.b || a.b + a.c <= a.a) return { A: "—", B: "—", C: "—" }; var A = Math.acos((a.b * a.b + a.c * a.c - a.a * a.a) / (2 * a.b * a.c)) * 180 / Math.PI; var B = Math.acos((a.a * a.a + a.c * a.c - a.b * a.b) / (2 * a.a * a.c)) * 180 / Math.PI; var C = 180 - A - B; return { A: A, B: B, C: C };  };
  function run(){ var args={};
    args["a"]=parseFloat($("#a").value);
    args["b"]=parseFloat($("#b").value);
    args["c"]=parseFloat($("#c").value);
    try { var r=compute(args);
    if(r&&r["A"]!==undefined){ var v=r["A"]; $("#A").textContent=(typeof v==="number")?fnum(v):v; }
    if(r&&r["B"]!==undefined){ var v=r["B"]; $("#B").textContent=(typeof v==="number")?fnum(v):v; }
    if(r&&r["C"]!==undefined){ var v=r["C"]; $("#C").textContent=(typeof v==="number")?fnum(v):v; }
      PHT.status(statusEl,(r&&r.__msg)||"计算完成",(r&&r.__type)||"ok"); } catch(e){ PHT.status(statusEl,"出错了："+e.message,"error"); }
  }
  ["a","b","c"].forEach(function(k){ $("#"+k).addEventListener("input",run); $("#"+k).addEventListener("change",run); });
  run();
})();
</script>
