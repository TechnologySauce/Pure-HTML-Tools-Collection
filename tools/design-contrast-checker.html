<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<meta name="description" content="计算前景/背景色的 WCAG 对比度并判断达标情况。">
<meta name="theme-color" content="#f6f5f1">
<link rel="icon" href="../assets/favicon.svg" type="image/svg+xml">
<script type="application/json" id="tool-meta">{"title":"对比度检查","desc":"计算前景/背景色的 WCAG 对比度并判断达标情况。","category":"calc","tags":["对比度","WCAG","无障碍"],"order":2353}</script>
<script>try{var t=localStorage.getItem("pht-theme");if(t!=="light"&&t!=="dark"){t=window.matchMedia&&window.matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light"}document.documentElement.setAttribute("data-theme",t)}catch(e){document.documentElement.setAttribute("data-theme","light")}</script>
<style data-inline="assets/tool-base.css"></style>
<style></style>
</head>
<body>
<header class="toolbar">
  <div class="toolbar-inner">
    <a class="brand" href="../index.html"><img src="../assets/favicon.svg" alt="" width="24" height="24"><span>纯 HTML 工具箱</span></a>
    <span class="spacer"></span>
    <a class="btn ghost" href="../index.html">返回首页</a>
    <button class="icon-btn" type="button" data-theme-toggle aria-label="切换深色主题" aria-pressed="false"><svg class="i-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"></circle><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M19.1 4.9l-1.4 1.4M6.3 17.7l-1.4 1.4"></path></svg><svg class="i-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 14.5A8.5 8.5 0 0 1 9.5 4 8.5 8.5 0 1 0 20 14.5Z"></path></svg></button>
  </div>
</header>

<main class="shell">
  <div class="page-head">
    <span class="badge">计算 · 本地处理</span>
    <h1>对比度检查</h1>
    <p>计算前景/背景色的 WCAG 对比度并判断达标情况。</p>
  </div>

  <section class="panel">
<div class="grid-2">
  <div class="field"><label for="fg">前景色</label><input type="text" id="fg" value="#0f172a"></div>
  <div class="field"><label for="bg">背景色</label><input type="text" id="bg" value="#ffffff"></div>
</div>
<dl class="stat-row" style="margin-top:16px">
  <div class="stat"><dt>对比度</dt><dd id="ratio">—</dd></div>
  <div class="stat"><dt>AA (≥4.5)</dt><dd id="aa">—</dd></div>
  <div class="stat"><dt>AAA (≥7)</dt><dd id="aaa">—</dd></div>
</dl>
<p class="status" id="status" aria-live="polite"></p>
  </section>

  <footer class="foot">
    <span>所有处理都在浏览器本地完成，数据不会上传。</span>
    <a href="../index.html">返回全部工具</a>
  </footer>
</main>

<script data-inline="assets/tool-base.js"></script>
<script>
(function(){
  var $=PHT.$; var statusEl=$("#status");
  function fnum(n){ if(n===null||n===undefined||!isFinite(n)) return "—"; var a=Math.round(n*1e6)/1e6; return a.toLocaleString("zh-CN",{maximumFractionDigits:6}); }
  var compute = function compute(args){  function lum(h) { h = h.replace("#", ""); if (h.length === 3) h = h.split("").map(function (c) { return c + c; }).join(""); var r = parseInt(h.slice(0, 2), 16) / 255, g = parseInt(h.slice(2, 4), 16) / 255, b = parseInt(h.slice(4, 6), 16) / 255; function f(c) { return c <= 0.03928 ? c / 12.92 : Math.pow((c + 0.055) / 1.055, 2.4); } return 0.2126 * f(r) + 0.7152 * f(g) + 0.0722 * f(b); } var l1 = lum(a.fg), l2 = lum(a.bg), hi = Math.max(l1, l2), lo = Math.min(l1, l2), cr = (hi + 0.05) / (lo + 0.05); return { ratio: cr, aa: cr >= 4.5 ? "通过" : "不通过", aaa: cr >= 7 ? "通过" : "不通过" };  };
  function run(){ var args={};
    args["fg"]=$("#fg").value;
    args["bg"]=$("#bg").value;
    try { var r=compute(args);
    if(r&&r["ratio"]!==undefined){ var v=r["ratio"]; $("#ratio").textContent=(typeof v==="number")?fnum(v):v; }
    if(r&&r["aa"]!==undefined){ var v=r["aa"]; $("#aa").textContent=(typeof v==="number")?fnum(v):v; }
    if(r&&r["aaa"]!==undefined){ var v=r["aaa"]; $("#aaa").textContent=(typeof v==="number")?fnum(v):v; }
      PHT.status(statusEl,(r&&r.__msg)||"计算完成",(r&&r.__type)||"ok"); } catch(e){ PHT.status(statusEl,"出错了："+e.message,"error"); }
  }
  ["fg","bg"].forEach(function(k){ $("#"+k).addEventListener("input",run); $("#"+k).addEventListener("change",run); });
  run();
})();
</script>
</body>
</html>
