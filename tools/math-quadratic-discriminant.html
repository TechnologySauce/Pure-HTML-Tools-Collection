<main class="shell">
  <div class="page-head">
    <span class="badge">计算 · 本地处理</span>
    <h1>一元二次方程判别式</h1>
    <p>计算 ax²+bx+c=0 的判别式并指出根的性质。</p>
  </div>

  <section class="panel">
<div class="grid-2">
  <div class="field"><label for="a">a</label><input type="number" id="a" value="1"></div>
  <div class="field"><label for="b">b</label><input type="number" id="b" value="-3"></div>
  <div class="field"><label for="c">c</label><input type="number" id="c" value="2"></div>
</div>
<dl class="stat-row" style="margin-top:16px">
  <div class="stat"><dt>Δ</dt><dd id="d">—</dd></div>
  <div class="stat"><dt>根的性质</dt><dd id="nature">—</dd></div>
</dl>
<p class="status" id="status" aria-live="polite"></p>
  </section>

  <footer class="foot">
    <span>所有处理都在浏览器本地完成，数据不会上传。</span>
    <a href="../index.html">返回全部工具</a>
  </footer>
</main>

<script data-inline="assets/tool-base.js"></script>
<script>
(function(){
  var $=PHT.$; var statusEl=$("#status");
  function fnum(n){ if(n===null||n===undefined||!isFinite(n)) return "—"; var a=Math.round(n*1e6)/1e6; return a.toLocaleString("zh-CN",{maximumFractionDigits:6}); }
  var compute = function compute(args){  if (a.a === 0) return { __msg: "a 不能为 0", __type: "error" }; var d = a.b * a.b - 4 * a.a * a.c; var nat = d > 0 ? "两个不等实根" : d === 0 ? "两个相等实根" : "一对共轭复根"; return { d: d, nature: nat };  };
  function run(){ var args={};
    args["a"]=parseFloat($("#a").value);
    args["b"]=parseFloat($("#b").value);
    args["c"]=parseFloat($("#c").value);
    try { var r=compute(args);
    if(r&&r["d"]!==undefined){ var v=r["d"]; $("#d").textContent=(typeof v==="number")?fnum(v):v; }
    if(r&&r["nature"]!==undefined){ var v=r["nature"]; $("#nature").textContent=(typeof v==="number")?fnum(v):v; }
      PHT.status(statusEl,(r&&r.__msg)||"计算完成",(r&&r.__type)||"ok"); } catch(e){ PHT.status(statusEl,"出错了："+e.message,"error"); }
  }
  ["a","b","c"].forEach(function(k){ $("#"+k).addEventListener("input",run); $("#"+k).addEventListener("change",run); });
  run();
})();
</script>
