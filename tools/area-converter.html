<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>面积换算 - 纯 HTML 工具箱</title>
<meta name="description" content="在平方毫米、平方厘米、平方米、公顷、平方公里、平方英寸、平方英尺、英亩、平方英里之间换算。">
<meta name="theme-color" content="#f6f5f1">
<link rel="icon" href="../assets/favicon.svg" type="image/svg+xml">
<script type="application/json" id="tool-meta">{"title":"面积换算","desc":"在平方毫米、平方厘米、平方米、公顷、平方公里、平方英寸、平方英尺、英亩、平方英里之间换算。","category":"calc","tags":["面积","换算","单位"],"order":203}</script>
<script>try{var t=localStorage.getItem("pht-theme");if(t!=="light"&&t!=="dark"){t=window.matchMedia&&window.matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light"}document.documentElement.setAttribute("data-theme",t)}catch(e){document.documentElement.setAttribute("data-theme","light")}</script>
<style data-inline="assets/tool-base.css"></style>
<style></style>
</head>
<body>
<header class="toolbar">
  <div class="toolbar-inner">
    <a class="brand" href="../index.html"><img src="../assets/favicon.svg" alt="" width="24" height="24"><span>纯 HTML 工具箱</span></a>
    <span class="spacer"></span>
    <a class="btn ghost" href="../index.html">返回首页</a>
    <button class="icon-btn" type="button" data-theme-toggle aria-label="切换深色主题" aria-pressed="false"><svg class="i-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"></circle><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M19.1 4.9l-1.4 1.4M6.3 17.7l-1.4 1.4"></path></svg><svg class="i-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 14.5A8.5 8.5 0 0 1 9.5 4 8.5 8.5 0 1 0 20 14.5Z"></path></svg></button>
  </div>
</header>

<main class="shell">
  <div class="page-head">
    <span class="badge">计算 · 本地处理</span>
    <h1>面积换算</h1>
    <p>在平方毫米、平方厘米、平方米、公顷、平方公里、平方英寸、平方英尺、英亩、平方英里之间换算。</p>
  </div>

  <section class="panel">
<div class="grid-2">
  <div class="field"><label for="value">数值</label><input type="number" id="value" value="1" step="any"></div>
  <div class="field"><label for="from">从单位</label><select id="from"><option value="0">平方毫米 mm²</option><option value="1">平方厘米 cm²</option><option value="2">平方米 m²</option><option value="3">公顷 ha</option><option value="4">平方千米 km²</option><option value="5">平方英寸 in²</option><option value="6">平方英尺 ft²</option><option value="7">英亩 ac</option><option value="8">平方英里 mi²</option></select></div>
  <div class="field"><label for="to">到单位</label><select id="to"><option value="0">平方毫米 mm²</option><option value="1">平方厘米 cm²</option><option value="2">平方米 m²</option><option value="3">公顷 ha</option><option value="4">平方千米 km²</option><option value="5">平方英寸 in²</option><option value="6">平方英尺 ft²</option><option value="7">英亩 ac</option><option value="8">平方英里 mi²</option></select></div>
  <div class="field"><button class="btn" type="button" id="swap">交换单位</button></div>
</div>
<dl class="stat-row" style="margin-top:16px"><div class="stat"><dt>换算结果</dt><dd id="out">—</dd></div></dl>
<p class="status" id="status" aria-live="polite"></p>
  </section>

  <footer class="foot">
    <span>所有处理都在浏览器本地完成，数据不会上传。</span>
    <a href="../index.html">返回全部工具</a>
  </footer>
</main>

<script data-inline="assets/tool-base.js"></script>
<script>
(function(){ var $=PHT.$; var statusEl=$("#status"); var F=[0.000001,0.0001,1,10000,1000000,0.00064516,0.09290304,4046.8564224,2589988.110336]; var N=["平方毫米 mm²","平方厘米 cm²","平方米 m²","公顷 ha","平方千米 km²","平方英寸 in²","平方英尺 ft²","英亩 ac","平方英里 mi²"];
  function run(){ var v=parseFloat($("#value").value); var fi=parseInt($("#from").value,10), ti=parseInt($("#to").value,10); if(!(v>=0)){ PHT.status(statusEl,"请输入有效数值"); return; } var res=v*F[fi]/F[ti]; $("#out").textContent=(Math.round(res*1e6)/1e6).toLocaleString("zh-CN",{maximumFractionDigits:6})+" "+N[ti]; PHT.status(statusEl,"换算完成","ok"); }
  $("#swap").addEventListener("click",function(){ var f=$("#from").value; $("#from").value=$("#to").value; $("#to").value=f; run(); });
  ["value","from","to"].forEach(function(k){ $("#"+k).addEventListener("input",run); $("#"+k).addEventListener("change",run); }); run();
})();
</script>
</body>
</html>
