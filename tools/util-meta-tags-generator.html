<main class="shell">
  <div class="page-head">
    <span class="badge">小工具 · 本地处理</span>
    <h1>Meta 标签生成</h1>
    <p>生成含 Open Graph / Twitter 的 SEO meta 标签。</p>
  </div>

  <section class="panel">
<div class="grid-2">
  <div class="field"><label for="title">标题</label><input type="text" id="title" value="我的网站"></div>
  <div class="field"><label for="desc">描述</label><input type="text" id="desc" value="一句话介绍你的站点。"></div>
  <div class="field"><label for="url">站点 URL</label><input type="text" id="url" value="https://example.com"></div>
  <div class="field"><label for="image">分享图 URL</label><input type="text" id="image" value="https://example.com/og.png"></div>
  <div class="field"><label for="type">类型</label><select id="type"><option value="website">website</option><option value="article">article</option></select></div>
</div>
<div class="field" style="margin-top:14px"><label for="out">生成结果</label><textarea id="out" class="code" readonly spellcheck="false" placeholder="点击生成"></textarea></div>
<div class="actions">
  <button class="btn primary" id="gen" type="button">生成</button>
  <button class="btn" id="copy" type="button">复制</button>
</div>
<p class="status" id="status" aria-live="polite"></p>
  </section>

  <footer class="foot">
    <span>所有处理都在浏览器本地完成，数据不会上传。</span>
    <a href="../index.html">返回全部工具</a>
  </footer>
</main>

<script data-inline="assets/tool-base.js"></script>
<script>
(function(){
  var $=PHT.$; var statusEl=$("#status"); var out=$("#out");
  function gen(args){
 return '<title>' + a.title + '</title>\n<meta name="description" content="' + a.desc + '">\n<meta property="og:type" content="' + a.type + '">\n<meta property="og:title" content="' + a.title + '">\n<meta property="og:description" content="' + a.desc + '">\n<meta property="og:url" content="' + a.url + '">\n<meta property="og:image" content="' + a.image + '">\n<meta name="twitter:card" content="summary_large_image">\n<meta name="twitter:title" content="' + a.title + '">\n<meta name="twitter:description" content="' + a.desc + '">'; 
  }
  function run(){ var args={};
    args["title"]=$("#title").value;
    args["desc"]=$("#desc").value;
    args["url"]=$("#url").value;
    args["image"]=$("#image").value;
    args["type"]=$("#type").value;
    try { var r=gen(args); out.value=(typeof r==="string")?r:String(r); PHT.status(statusEl,"已生成","ok"); } catch(e){ PHT.status(statusEl,"出错了："+e.message,"error"); }
  }
  ["title","desc","url","image","type"].forEach(function(k){ $("#"+k).addEventListener("input",run); $("#"+k).addEventListener("change",run); });
  $("#gen").addEventListener("click",run);
  $("#copy").addEventListener("click",function(){ if(!out.value){ PHT.status(statusEl,"没有内容","error"); return; } PHT.copy(out.value).then(function(ok){ PHT.flash($("#copy"),"已复制"); PHT.status(statusEl,ok?"已复制":"复制失败",ok?"ok":"error"); }); });
  run();
})();
</script>
