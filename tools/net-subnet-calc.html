<html lang="zh-CN" data-theme="light">
<head>
<meta charset="utf-8">

<script>try{var t=localStorage.getItem("pht-theme");if(t!=="light"&&t!=="dark"){t=window.matchMedia&&window.matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light"}document.documentElement.setAttribute("data-theme",t)}catch(e){document.documentElement.setAttribute("data-theme","light")}</script>

<body>
<header class="toolbar">
  <div class="toolbar-inner">
    <a class="brand" href="../index.html"><img src="../assets/favicon.svg" alt="" width="24" height="24"><span>纯 HTML 工具箱</span></a>
    <span class="spacer"></span>
    <a class="btn ghost" href="../index.html">返回首页</a>
    <button class="icon-btn" type="button" data-theme-toggle aria-label="切换深色主题" aria-pressed="false"><svg class="i-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"></circle><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M19.1 4.9l-1.4 1.4M6.3 17.7l-1.4 1.4"></path></svg><svg class="i-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 14.5A8.5 8.5 0 0 1 9.5 4 8.5 8.5 0 1 0 20 14.5Z"></path></svg></button>
  </div>
</header>

<main class="shell">
  <div class="page-head">
    <span class="badge">计算 · 本地处理</span>
    <h1>子网计算</h1>
    <p>由 CIDR（如 192.168.1.10/24）计算网络/广播地址与可用主机数。</p>
  </div>

  <section class="panel">
<div class="grid-2">
  <div class="field"><label for="cidr">CIDR 表示</label><input type="text" id="cidr" value="192.168.1.10/24"></div>
</div>
<dl class="stat-row" style="margin-top:16px">
  <div class="stat"><dt>网络地址</dt><dd id="net">—</dd></div>
  <div class="stat"><dt>广播地址</dt><dd id="bcast">—</dd></div>
  <div class="stat"><dt>首可用</dt><dd id="first">—</dd></div>
  <div class="stat"><dt>末可用</dt><dd id="last">—</dd></div>
  <div class="stat"><dt>可用主机数</dt><dd id="hosts">—</dd></div>
</dl>
<p class="status" id="status" aria-live="polite"></p>
  </section>

  <footer class="foot">
    <span>所有处理都在浏览器本地完成，数据不会上传。</span>
    <a href="../index.html">返回全部工具</a>
  </footer>
</main>

<script data-inline="assets/tool-base.js"></script>
<script>
(function(){
  var $=PHT.$; var statusEl=$("#status");
  function fnum(n){ if(n===null||n===undefined||!isFinite(n)) return "—"; var a=Math.round(n*1e6)/1e6; return a.toLocaleString("zh-CN",{maximumFractionDigits:6}); }
  var compute = function compute(args){  var p = a.cidr.split("/"); var ip = p[0].split(".").map(Number); var bits = parseInt(p[1], 10); if (ip.length !== 4 || isNaN(bits) || bits < 0 || bits > 32) return { net: "格式错误", bcast: "—", first: "—", last: "—", hosts: "—" }; var ipInt = ((ip[0] << 24) | (ip[1] << 16) | (ip[2] << 8) | ip[3]) >>> 0; var mask = bits === 0 ? 0 : (0xffffffff << (32 - bits)) >>> 0; var net = (ipInt & mask) >>> 0; var bcast = (net | (~mask >>> 0)) >>> 0; function ipstr(n) { return [(n >>> 24) & 255, (n >>> 16) & 255, (n >>> 8) & 255, n & 255].join("."); } var hosts = Math.pow(2, 32 - bits) - (bits >= 31 ? 0 : 2); return { net: ipstr(net), bcast: ipstr(bcast), first: bits >= 31 ? ipstr(net) : ipstr(net + 1), last: bits >= 31 ? ipstr(bcast) : ipstr(bcast - 1), hosts: hosts };  };
  function run(){ var args={};
    args["cidr"]=$("#cidr").value;
    try { var r=compute(args);
    if(r&&r["net"]!==undefined){ var v=r["net"]; $("#net").textContent=(typeof v==="number")?fnum(v):v; }
    if(r&&r["bcast"]!==undefined){ var v=r["bcast"]; $("#bcast").textContent=(typeof v==="number")?fnum(v):v; }
    if(r&&r["first"]!==undefined){ var v=r["first"]; $("#first").textContent=(typeof v==="number")?fnum(v):v; }
    if(r&&r["last"]!==undefined){ var v=r["last"]; $("#last").textContent=(typeof v==="number")?fnum(v):v; }
    if(r&&r["hosts"]!==undefined){ var v=r["hosts"]; $("#hosts").textContent=(typeof v==="number")?fnum(v):v; }
      PHT.status(statusEl,(r&&r.__msg)||"计算完成",(r&&r.__type)||"ok"); } catch(e){ PHT.status(statusEl,"出错了："+e.message,"error"); }
  }
  ["cidr"].forEach(function(k){ $("#"+k).addEventListener("input",run); $("#"+k).addEventListener("change",run); });
  run();
})();
</script>
</body>
</html>
