<main class="shell">
  <div class="page-head">
    <span class="badge">计算 · 本地处理</span>
    <h1>两地球面距离</h1>
    <p>用 Haversine 公式按经纬度计算地球表面两点距离。</p>
  </div>

  <section class="panel">
<div class="grid-2">
  <div class="field"><label for="lat1">纬度1 (°)</label><input type="number" id="lat1" value="39.9"></div>
  <div class="field"><label for="lon1">经度1 (°)</label><input type="number" id="lon1" value="116.4"></div>
  <div class="field"><label for="lat2">纬度2 (°)</label><input type="number" id="lat2" value="31.2"></div>
  <div class="field"><label for="lon2">经度2 (°)</label><input type="number" id="lon2" value="121.5"></div>
</div>
<dl class="stat-row" style="margin-top:16px">
  <div class="stat"><dt>距离 (km)</dt><dd id="km">—</dd></div>
  <div class="stat"><dt>距离 (mi)</dt><dd id="mi">—</dd></div>
</dl>
<p class="status" id="status" aria-live="polite"></p>
  </section>

  <footer class="foot">
    <span>所有处理都在浏览器本地完成，数据不会上传。</span>

  </footer>
</main>

<script data-inline="assets/tool-base.js"></script>
<script>
(function(){
  var $=PHT.$; var statusEl=$("#status");
  function fnum(n){ if(n===null||n===undefined||!isFinite(n)) return "—"; var a=Math.round(n*1e6)/1e6; return a.toLocaleString("zh-CN",{maximumFractionDigits:6}); }
  var compute = function compute(args){  var R = 6371, toR = Math.PI / 180; var dLat = (a.lat2 - a.lat1) * toR, dLon = (a.lon2 - a.lon1) * toR; var s = Math.sin(dLat / 2) * Math.sin(dLat / 2) + Math.cos(a.lat1 * toR) * Math.cos(a.lat2 * toR) * Math.sin(dLon / 2) * Math.sin(dLon / 2); var ang = 2 * Math.atan2(Math.sqrt(s), Math.sqrt(1 - s)); var km = R * ang; return { km: km, mi: km * 0.621371 };  };
  function run(){ var args={};
    args["lat1"]=parseFloat($("#lat1").value);
    args["lon1"]=parseFloat($("#lon1").value);
    args["lat2"]=parseFloat($("#lat2").value);
    args["lon2"]=parseFloat($("#lon2").value);
    try { var r=compute(args);
    if(r&&r["km"]!==undefined){ var v=r["km"]; $("#km").textContent=(typeof v==="number")?fnum(v):v; }
    if(r&&r["mi"]!==undefined){ var v=r["mi"]; $("#mi").textContent=(typeof v==="number")?fnum(v):v; }
      PHT.status(statusEl,(r&&r.__msg)||"计算完成",(r&&r.__type)||"ok"); } catch(e){ PHT.status(statusEl,"出错了："+e.message,"error"); }
  }
  ["lat1","lon1","lat2","lon2"].forEach(function(k){ $("#"+k).addEventListener("input",run); $("#"+k).addEventListener("change",run); });
  run();
})();
</script>
