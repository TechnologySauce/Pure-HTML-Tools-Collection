<script>
(function(){var $=PHT.$;var inp=$("#inp"),out=$("#out");function chk(y,mo,d){if(mo<1||mo>12)return false;if(d<1||d>31)return false;var dim=[31,28,31,30,31,30,31,31,30,31,30,31];if((y%4===0&&y%100!==0)||y%400===0)dim[1]=29;return d<=dim[mo-1];}function valid(s){s=s.trim();var m;if((m=s.match(/^(\d{4})[-/](\d{1,2})[-/](\d{1,2})$/)))return chk(+m[1],+m[2],+m[3]);if((m=s.match(/^(\d{1,2})[-/](\d{1,2})[-/](\d{4})$/)))return chk(+m[3],+m[1],+m[2]);return false;}function run(){var v=inp.value.trim();out.textContent=v?((valid(v)?"合法日期":"非法日期")):"";}inp.addEventListener("input",run);run();})();
</script>
