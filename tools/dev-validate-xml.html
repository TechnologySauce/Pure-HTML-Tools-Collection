<div class="field"><label>XML 文本</label><textarea id="inp" rows="6" placeholder="粘贴 XML"></textarea></div><div class="field"><label>结果</label><pre id="out"></pre></div>

<script data-inline="assets/tool-base.js"></script>
<script>
(function(){var $=PHT.$;var inp=$("#inp"),out=$("#out");function run(){var v=inp.value.trim();if(!v){out.textContent="";return;}try{var doc=new DOMParser().parseFromString(v,"application/xml");if(doc.getElementsByTagName("parsererror").length>0){out.textContent="非法 XML："+doc.getElementsByTagName("parsererror")[0].textContent;}else{out.textContent="格式良好的 XML";}}catch(e){out.textContent="无法解析："+e.message;}}inp.addEventListener("input",run);run();})();
</script>
