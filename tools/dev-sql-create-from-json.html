<script data-inline="assets/tool-base.js"></script>
<script>
(function(){
  var $=PHT.$; var statusEl=$("#status"); var out=$("#out");
  function gen(args){
 var o; try { o = JSON.parse(a.json); } catch (e) { return "无效 JSON：" + e.message; } function typ(v) { if (typeof v === "number") return Number.isInteger(v) ? "BIGINT" : "DOUBLE"; if (typeof v === "boolean") return "BOOLEAN"; if (v && typeof v === "object") return "JSON"; return "VARCHAR(255)"; } var out = "CREATE TABLE `" + a.table + "` (\n"; var cols = []; Object.keys(o).forEach(function (k) { cols.push("  `" + k + "` " + typ(o[k])); }); out += cols.join(",\n") + "\n);"; return out; 
  }
  function run(){ var args={};
    args["table"]=$("#table").value;
    args["json"]=parseFloat($("#json").value);
    try { var r=gen(args); out.value=(typeof r==="string")?r:String(r); PHT.status(statusEl,"已生成","ok"); } catch(e){ PHT.status(statusEl,"出错了："+e.message,"error"); }
  }
  ["table","json"].forEach(function(k){ $("#"+k).addEventListener("input",run); $("#"+k).addEventListener("change",run); });
  $("#gen").addEventListener("click",run);
  $("#copy").addEventListener("click",function(){ if(!out.value){ PHT.status(statusEl,"没有内容","error"); return; } PHT.copy(out.value).then(function(ok){ PHT.flash($("#copy"),"已复制"); PHT.status(statusEl,ok?"已复制":"复制失败",ok?"ok":"error"); }); });
  run();
})();
</script>
