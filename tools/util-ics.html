<script>try{var t=localStorage.getItem("pht-theme");if(t!=="light"&&t!=="dark"){t=window.matchMedia&&window.matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light"}document.documentElement.setAttribute("data-theme",t)}catch(e){document.documentElement.setAttribute("data-theme","light")}</script>

<body>
<header class="toolbar">
  <div class="toolbar-inner">
    <a class="brand" href="../index.html"><img src="../assets/favicon.svg" alt="" width="24" height="24"><span>纯 HTML 工具箱</span></a>
    <span class="spacer"></span>
    <a class="btn ghost" href="../index.html">返回首页</a>
    <button class="icon-btn" type="button" data-theme-toggle aria-label="切换深色主题" aria-pressed="false"><svg class="i-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"></circle><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M19.1 4.9l-1.4 1.4M6.3 17.7l-1.4 1.4"></path></svg><svg class="i-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 14.5A8.5 8.5 0 0 1 9.5 4 8.5 8.5 0 1 0 20 14.5Z"></path></svg></button>
  </div>
</header>

<main class="shell">
  <div class="page-head">
    <span class="badge">小工具 · 本地处理</span>
    <h1>日程 ICS 生成器</h1>
    <p>生成可导入日历的 .ics 事件文件。</p>
  </div>

  <section class="panel">
<div class="field"><label>标题</label><input id="title" type="text" placeholder="会议"><label>开始</label><input id="start" type="datetime-local"><label>结束</label><input id="end" type="datetime-local"><label>地点</label><input id="loc" type="text"><label>描述</label><input id="desc" type="text"></div><div class="field"><button id="go" class="btn">生成</button> <button id="dl" class="btn ghost">下载 .ics</button></div><div class="field"><label>ICS</label><pre id="out"></pre></div>
  </section>

  <footer class="foot">
    <span>所有处理都在浏览器本地完成，数据不会上传。</span>
    <a href="../index.html">返回全部工具</a>
  </footer>
</main>

<script data-inline="assets/tool-base.js"></script>
<script>
(function(){var $=PHT.$;var title=$("#title"),start=$("#start"),end=$("#end"),loc=$("#loc"),desc=$("#desc"),out=$("#out"),go=$("#go"),dl=$("#dl");function fmt(s){if(!s)return "";return s.replace(/[-:]/g,"").replace(/.d+$/,"")+"Z";}function run(){if(!start.value){out.textContent="";return;}var s="BEGIN:VCALENDAR\nVERSION:2.0\nPRODID:-//PureHTMLTools//ICS//CN\nBEGIN:VEVENT\nUID:"+Date.now()+"@purehtml\nDTSTAMP:"+fmt(new Date().toISOString())+"\nDTSTART:"+fmt(start.value)+"\nDTEND:"+fmt(end.value||start.value)+"\nSUMMARY:"+title.value+"\n";if(loc.value)s+="LOCATION:"+loc.value+"\n";if(desc.value)s+="DESCRIPTION:"+desc.value+"\n";s+="END:VEVENT\nEND:VCALENDAR";out.textContent=s;}go.addEventListener("click",run);dl.addEventListener("click",function(){if(!out.textContent)run();PHT.download("event.ics",out.textContent,"text/calendar");});run();})();
</script>
</body>
</html>
