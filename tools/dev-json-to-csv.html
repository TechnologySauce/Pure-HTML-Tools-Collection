<header class="toolbar">
  <div class="toolbar-inner">
    <a class="brand" href="../index.html"><img src="../assets/favicon.svg" alt="" width="24" height="24"><span>纯 HTML 工具箱</span></a>
    <span class="spacer"></span>
    <a class="btn ghost" href="../index.html">返回首页</a>
    <button class="icon-btn" type="button" data-theme-toggle aria-label="切换深色主题" aria-pressed="false"><svg class="i-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"></circle><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M19.1 4.9l-1.4 1.4M6.3 17.7l-1.4 1.4"></path></svg><svg class="i-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 14.5A8.5 8.5 0 0 1 9.5 4 8.5 8.5 0 1 0 20 14.5Z"></path></svg></button>
  </div>

<main class="shell">
  <div class="page-head">
    <span class="badge">开发者 · 本地处理</span>
    <h1>JSON 转 CSV</h1>
    <p>将对象数组 JSON 转换为 CSV 文本。</p>
  </div>

  <section class="panel">
<div class="field"><label>JSON 文本（对象数组）</label><textarea id="inp" rows="7" placeholder='[{"name":"Alice","age":30}]'></textarea></div><div class="field"><button id="go" class="btn">转换</button> <button id="cp" class="btn ghost">复制</button></div><div class="field"><label>CSV 结果</label><pre id="out"></pre></div>
  </section>

  <footer class="foot">
    <span>所有处理都在浏览器本地完成，数据不会上传。</span>
    <a href="../index.html">返回全部工具</a>
  </footer>
</main>

<script data-inline="assets/tool-base.js"></script>
<script>
(function(){var $=PHT.$;var inp=$("#inp"),out=$("#out"),go=$("#go"),cp=$("#cp");function run(){var txt=inp.value.trim();if(!txt){out.textContent="";return;}var json;try{json=JSON.parse(txt);}catch(e){out.textContent="JSON 解析失败: "+e.message;return;}if(!Array.isArray(json)){out.textContent="需为对象数组";return;}var keys={};json.forEach(function(o){if(o&&typeof o==="object")Object.keys(o).forEach(function(k){keys[k]=1;});});var ks=Object.keys(keys);var lines=[ks.join(",")];json.forEach(function(o){lines.push(ks.map(function(k){var v=o?o[k]:"";if(v===undefined||v===null)v="";v=String(v);if(/[",\n\r]/.test(v))v='"'+v.replace(/"/g,'""')+'"';return v;}).join(","));});out.textContent=lines.join("\n");}go.addEventListener("click",run);inp.addEventListener("input",run);cp.addEventListener("click",function(){PHT.copy(out.textContent).then(function(){PHT.flash(cp,"已复制");});});run();})();
</script>
</body>
