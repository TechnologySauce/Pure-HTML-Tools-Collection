<main class="shell">
  <div class="page-head">
    <span class="badge">计算 · 本地处理</span>
    <h1>债券到期收益率</h1>
    <p>由债券价格反推近似到期收益率 YTM（二分法）。</p>
  </div>

  <section class="panel">
<div class="grid-2">
  <div class="field"><label for="price">债券价格</label><input type="number" id="price" value="1050"></div>
  <div class="field"><label for="face">面值</label><input type="number" id="face" value="1000"></div>
  <div class="field"><label for="coupon">票息率 (%)</label><input type="number" id="coupon" value="5"></div>
  <div class="field"><label for="years">年限</label><input type="number" id="years" value="10"></div>
  <div class="field"><label for="freq">每年付息次数</label><input type="number" id="freq" value="2"></div>
</div>
<dl class="stat-row" style="margin-top:16px">
  <div class="stat"><dt>YTM (%)</dt><dd id="ytm">—</dd></div>
</dl>
<p class="status" id="status" aria-live="polite"></p>
  </section>

  <footer class="foot">
    <span>所有处理都在浏览器本地完成，数据不会上传。</span>
    <a href="../index.html">返回全部工具</a>
  </footer>
</main>

<script data-inline="assets/tool-base.js"></script>
<script>
(function(){
  var $=PHT.$; var statusEl=$("#status");
  function fnum(n){ if(n===null||n===undefined||!isFinite(n)) return "—"; var a=Math.round(n*1e6)/1e6; return a.toLocaleString("zh-CN",{maximumFractionDigits:6}); }
  var compute = function compute(args){  var c = a.face * a.coupon / 100 / a.freq, N = a.years * a.freq; function price(y) { var p = 0; for (var t = 1; t <= N; t++) p += c / Math.pow(1 + y, t); return p + a.face / Math.pow(1 + y, N); } var lo = 0.0001, hi = 1; for (var i = 0; i < 80; i++) { var mid = (lo + hi) / 2; if (price(mid) > a.price) lo = mid; else hi = mid; } return { ytm: (lo + hi) / 2 * 100 * a.freq };  };
  function run(){ var args={};
    args["price"]=parseFloat($("#price").value);
    args["face"]=parseFloat($("#face").value);
    args["coupon"]=parseFloat($("#coupon").value);
    args["years"]=parseFloat($("#years").value);
    args["freq"]=parseFloat($("#freq").value);
    try { var r=compute(args);
    if(r&&r["ytm"]!==undefined){ var v=r["ytm"]; $("#ytm").textContent=(typeof v==="number")?fnum(v):v; }
      PHT.status(statusEl,(r&&r.__msg)||"计算完成",(r&&r.__type)||"ok"); } catch(e){ PHT.status(statusEl,"出错了："+e.message,"error"); }
  }
  ["price","face","coupon","years","freq"].forEach(function(k){ $("#"+k).addEventListener("input",run); $("#"+k).addEventListener("change",run); });
  run();
})();
</script>
