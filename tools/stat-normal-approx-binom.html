  <div class="stat"><dt>P(X≤k) 近似</dt><dd id="approx">—</dd></div>
</dl>

  </section>

<script data-inline="assets/tool-base.js"></script>
<script>
(function(){
  var $=PHT.$; var statusEl=$("#status");
  function fnum(n){ if(n===null||n===undefined||!isFinite(n)) return "—"; var a=Math.round(n*1e6)/1e6; return a.toLocaleString("zh-CN",{maximumFractionDigits:6}); }
  var compute = function compute(args){  function erf(x) { var s = x < 0 ? -1 : 1; x = Math.abs(x); var t = 1 / (1 + 0.3275911 * x); var y = 1 - (0.254829592 + (-0.284496736 + (1.421413741 + (-1.453152027 + 1.061405429 * t) * t) * t) * t) * t * Math.exp(-x * x); return s * y; } var mu = a.n * a.p, sd = Math.sqrt(a.n * a.p * (1 - a.p)); var z = (a.k + 0.5 - mu) / sd; return { approx: 0.5 * (1 + erf(z / Math.sqrt(2))) };  };
  function run(){ var args={};
    args["n"]=parseFloat($("#n").value);
    args["k"]=parseFloat($("#k").value);
    args["p"]=parseFloat($("#p").value);
    try { var r=compute(args);
    if(r&&r["approx"]!==undefined){ var v=r["approx"]; $("#approx").textContent=(typeof v==="number")?fnum(v):v; }
      PHT.status(statusEl,(r&&r.__msg)||"计算完成",(r&&r.__type)||"ok"); } catch(e){ PHT.status(statusEl,"出错了："+e.message,"error"); }
  }
  ["n","k","p"].forEach(function(k){ $("#"+k).addEventListener("input",run); $("#"+k).addEventListener("change",run); });
  run();
})();
</script>
