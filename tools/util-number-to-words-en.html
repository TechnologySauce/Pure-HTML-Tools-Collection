<main class="shell">
  <div class="page-head">
    <span class="badge">小工具 · 本地处理</span>

    <p>把整数转换为英文读法。</p>
  </div>

  <section class="panel">
  <div class="field"><label for="text">整数</label><input type="text" id="text" value="12345"></div>
<div class="field" style="margin-top:14px"><label for="out">输出</label><textarea id="out" class="code" readonly spellcheck="false" placeholder="处理结果"></textarea></div>
<div class="actions">
  <button class="btn primary" id="copy" type="button">复制</button>
</div>
<p class="status" id="status" aria-live="polite"></p>
  </section>

  <footer class="foot">
    <span>所有处理都在浏览器本地完成，数据不会上传。</span>

  </footer>
</main>

<script data-inline="assets/tool-base.js"></script>
<script>
(function(){
  var $=PHT.$; var statusEl=$("#status"); var out=$("#out");
  function transform(args){
 var n = Math.floor(Math.abs(parseFloat(args.text))); if (isNaN(n)) return "请输入整数"; var ones = ["", "one", "two", "three", "four", "five", "six", "seven", "eight", "nine", "ten", "eleven", "twelve", "thirteen", "fourteen", "fifteen", "sixteen", "seventeen", "eighteen", "nineteen"]; var tens = ["", "", "twenty", "thirty", "forty", "fifty", "sixty", "seventy", "eighty", "ninety"]; function h2(n) { if (n < 20) return ones[n]; var t = Math.floor(n / 10); var o = n % 10; return tens[t] + (o ? "-" + ones[o] : ""); } function h3(n) { if (n < 100) return h2(n); var h = Math.floor(n / 100); var r = n % 100; return ones[h] + " hundred" + (r ? " " + h2(r) : ""); } function big(n) { if (n < 1000) return h3(n); var groups = [{ v: 1e9, w: "billion" }, { v: 1e6, w: "million" }, { v: 1e3, w: "thousand" }]; for (var i = 0; i < groups.length; i++) { if (n >= groups[i].v) { var q = Math.floor(n / groups[i].v); var rem = n % groups[i].v; return big(q) + " " + groups[i].w + (rem ? " " + big(rem) : ""); } } return h3(n); } return (parseFloat(args.text) < 0 ? "negative " : "") + big(n); 
  }
  function run(){ var args={};
    args["text"]=$("#text").value;
    try { out.value=transform(args); PHT.status(statusEl,"已处理","ok"); } catch(e){ PHT.status(statusEl,"出错了："+e.message,"error"); }
  }
  ["text"].forEach(function(k){ $("#"+k).addEventListener("input",run); $("#"+k).addEventListener("change",run); });
  $("#copy").addEventListener("click",function(){ if(!out.value){ PHT.status(statusEl,"没有内容","error"); return; } PHT.copy(out.value).then(function(ok){ PHT.flash($("#copy"),"已复制"); PHT.status(statusEl,ok?"已复制":"复制失败",ok?"ok":"error"); }); });
  run();
})();
</script>
