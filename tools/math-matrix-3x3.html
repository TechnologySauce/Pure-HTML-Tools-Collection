    <button class="icon-btn" type="button" data-theme-toggle aria-label="切换深色主题" aria-pressed="false"><svg class="i-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"></circle><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M19.1 4.9l-1.4 1.4M6.3 17.7l-1.4 1.4"></path></svg><svg class="i-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 14.5A8.5 8.5 0 0 1 9.5 4 8.5 8.5 0 1 0 20 14.5Z"></path></svg></button>

<main class="shell">
  <div class="page-head">
    <span class="badge">计算 · 本地处理</span>
    <h1>3×3 行列式</h1>
    <p>按萨吕法则计算三阶方阵的行列式。</p>
  </div>

  <section class="panel">
<div class="grid-2">
  <div class="field"><label for="a11">a11</label><input type="number" id="a11" value="1"></div>
  <div class="field"><label for="a12">a12</label><input type="number" id="a12" value="2"></div>
  <div class="field"><label for="a13">a13</label><input type="number" id="a13" value="0"></div>
  <div class="field"><label for="a21">a21</label><input type="number" id="a21" value="0"></div>
  <div class="field"><label for="a22">a22</label><input type="number" id="a22" value="1"></div>
  <div class="field"><label for="a23">a23</label><input type="number" id="a23" value="3"></div>
  <div class="field"><label for="a31">a31</label><input type="number" id="a31" value="2"></div>
  <div class="field"><label for="a32">a32</label><input type="number" id="a32" value="0"></div>
  <div class="field"><label for="a33">a33</label><input type="number" id="a33" value="1"></div>
</div>
<dl class="stat-row" style="margin-top:16px">
  <div class="stat"><dt>行列式</dt><dd id="det">—</dd></div>
</dl>
<p class="status" id="status" aria-live="polite"></p>
  </section>

  <footer class="foot">
    <span>所有处理都在浏览器本地完成，数据不会上传。</span>
    <a href="../index.html">返回全部工具</a>
  </footer>
</main>

<script data-inline="assets/tool-base.js"></script>
<script>
(function(){
  var $=PHT.$; var statusEl=$("#status");
  function fnum(n){ if(n===null||n===undefined||!isFinite(n)) return "—"; var a=Math.round(n*1e6)/1e6; return a.toLocaleString("zh-CN",{maximumFractionDigits:6}); }
  var compute = function compute(args){  return { det: a.a11 * (a.a22 * a.a33 - a.a23 * a.a32) - a.a12 * (a.a21 * a.a33 - a.a23 * a.a31) + a.a13 * (a.a21 * a.a32 - a.a22 * a.a31) };  };
  function run(){ var args={};
    args["a11"]=parseFloat($("#a11").value);
    args["a12"]=parseFloat($("#a12").value);
    args["a13"]=parseFloat($("#a13").value);
    args["a21"]=parseFloat($("#a21").value);
    args["a22"]=parseFloat($("#a22").value);
    args["a23"]=parseFloat($("#a23").value);
    args["a31"]=parseFloat($("#a31").value);
    args["a32"]=parseFloat($("#a32").value);
    args["a33"]=parseFloat($("#a33").value);
    try { var r=compute(args);
    if(r&&r["det"]!==undefined){ var v=r["det"]; $("#det").textContent=(typeof v==="number")?fnum(v):v; }
      PHT.status(statusEl,(r&&r.__msg)||"计算完成",(r&&r.__type)||"ok"); } catch(e){ PHT.status(statusEl,"出错了："+e.message,"error"); }
  }
  ["a11","a12","a13","a21","a22","a23","a31","a32","a33"].forEach(function(k){ $("#"+k).addEventListener("input",run); $("#"+k).addEventListener("change",run); });
  run();
})();
</script>
