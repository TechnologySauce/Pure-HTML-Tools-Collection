(function(){var $=PHT.$;var inp=$("#inp"),out=$("#out");function run(){var s=inp.value.toLowerCase().replace(/[^a-z0-9一-鿿]/g,"");var r=s.split("").reverse().join("");out.textContent=s&&s===r?"是回文 ✅":"不是回文 ❌";}inp.addEventListener("input",run);run();})();
