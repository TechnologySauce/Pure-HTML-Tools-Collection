  </div>

  <section class="panel">
<div class="grid-2">
  <div class="field"><label for="a11">a₁₁</label><input type="number" id="a11" value="2"></div>
  <div class="field"><label for="a12">a₁₂</label><input type="number" id="a12" value="1"></div>
  <div class="field"><label for="a13">a₁₃</label><input type="number" id="a13" value="-1"></div>
  <div class="field"><label for="a21">a₂₁</label><input type="number" id="a21" value="-3"></div>
  <div class="field"><label for="a22">a₂₂</label><input type="number" id="a22" value="-1"></div>
  <div class="field"><label for="a23">a₂₃</label><input type="number" id="a23" value="2"></div>
  <div class="field"><label for="a31">a₃₁</label><input type="number" id="a31" value="-2"></div>
  <div class="field"><label for="a32">a₃₂</label><input type="number" id="a32" value="1"></div>
  <div class="field"><label for="a33">a₃₃</label><input type="number" id="a33" value="2"></div>
  <div class="field"><label for="b1">b₁</label><input type="number" id="b1" value="8"></div>
  <div class="field"><label for="b2">b₂</label><input type="number" id="b2" value="-11"></div>
  <div class="field"><label for="b3">b₃</label><input type="number" id="b3" value="-3"></div>
</div>

  <div class="stat"><dt>x</dt><dd id="x">—</dd></div>
  <div class="stat"><dt>y</dt><dd id="y">—</dd></div>
  <div class="stat"><dt>z</dt><dd id="z">—</dd></div>
</dl>

<script data-inline="assets/tool-base.js"></script>
<script>
(function(){
  var $=PHT.$; var statusEl=$("#status");
  function fnum(n){ if(n===null||n===undefined||!isFinite(n)) return "—"; var a=Math.round(n*1e6)/1e6; return a.toLocaleString("zh-CN",{maximumFractionDigits:6}); }
  var compute = function compute(args){ 
      function det(m) { return m[0][0] * (m[1][1] * m[2][2] - m[1][2] * m[2][1]) - m[0][1] * (m[1][0] * m[2][2] - m[1][2] * m[2][0]) + m[0][2] * (m[1][0] * m[2][1] - m[1][1] * m[2][0]); }
      var A = [[a.a11, a.a12, a.a13], [a.a21, a.a22, a.a23], [a.a31, a.a32, a.a33]];
      var D = det(A);
      if (Math.abs(D) < 1e-12) return { __msg: "系数行列式为 0，方程组无解或无穷多解", __type: "error" };
      function rep(col) { var m = A.map(function (r) { return r.slice(); }); for (var i = 0; i < 3; i++) m[i][col] = [a.b1, a.b2, a.b3][i]; return det(m); }
      return { x: rep(0) / D, y: rep(1) / D, z: rep(2) / D };
     };
  function run(){ var args={};
    args["a11"]=parseFloat($("#a11").value);
    args["a12"]=parseFloat($("#a12").value);
    args["a13"]=parseFloat($("#a13").value);
    args["a21"]=parseFloat($("#a21").value);
    args["a22"]=parseFloat($("#a22").value);
    args["a23"]=parseFloat($("#a23").value);
    args["a31"]=parseFloat($("#a31").value);
    args["a32"]=parseFloat($("#a32").value);
    args["a33"]=parseFloat($("#a33").value);
    args["b1"]=parseFloat($("#b1").value);
    args["b2"]=parseFloat($("#b2").value);
    args["b3"]=parseFloat($("#b3").value);
    try { var r=compute(args);
    if(r&&r["x"]!==undefined){ var v=r["x"]; $("#x").textContent=(typeof v==="number")?fnum(v):v; }
    if(r&&r["y"]!==undefined){ var v=r["y"]; $("#y").textContent=(typeof v==="number")?fnum(v):v; }
    if(r&&r["z"]!==undefined){ var v=r["z"]; $("#z").textContent=(typeof v==="number")?fnum(v):v; }
      PHT.status(statusEl,(r&&r.__msg)||"计算完成",(r&&r.__type)||"ok"); } catch(e){ PHT.status(statusEl,"出错了："+e.message,"error"); }
  }
  ["a11","a12","a13","a21","a22","a23","a31","a32","a33","b1","b2","b3"].forEach(function(k){ $("#"+k).addEventListener("input",run); $("#"+k).addEventListener("change",run); });
  run();
})();
</script>
