<div class="field"><label>CSS 选择器</label><input id="inp" type="text" placeholder="例如 #nav ul li.active a:hover"></div><div class="field"><label>结果</label><pre id="out"></pre></div>

<script data-inline="assets/tool-base.js"></script>
<script>
(function(){var $=PHT.$;var inp=$("#inp"),out=$("#out");function run(){var sel=inp.value.trim();if(!sel){out.textContent="";return;}var a=0,b=0,c=0;sel.replace(/#[A-Za-z0-9_:-]+/g,function(){a++;return "";});sel.replace(/\.[A-Za-z0-9_-]+/g,function(){b++;return "";});sel.replace(/\[[^\]]*\]/g,function(){b++;return "";});sel.replace(/::?[a-zA-Z-]+\(/g,function(){b++;return "";});sel.replace(/(^|[^:]):[a-zA-Z-]+/g,function(){b++;return "";});sel.replace(/::[a-zA-Z-]+/g,function(){c++;return "";});sel.replace(/(^|[\s>+~])([a-zA-Z][a-zA-Z0-9]*)/g,function(){c++;return "";});out.textContent="特异性 (ID, 类/属性/伪类, 元素/伪元素): ("+a+", "+b+", "+c+")";}inp.addEventListener("input",run);run();})();
</script>
