<main class="shell">
  <div class="page-head">
    <span class="badge">计算 · 本地处理</span>
    <h1>赫芬达尔指数 HHI</h1>
    <p>HHI = 各企业市场份额(%)的平方和（最多 4 家）。</p>
  </div>

  <section class="panel">
<div class="grid-2">
  <div class="field"><label for="s1">份额1 (%)</label><input type="number" id="s1" value="40"></div>
  <div class="field"><label for="s2">份额2 (%)</label><input type="number" id="s2" value="30"></div>
  <div class="field"><label for="s3">份额3 (%)</label><input type="number" id="s3" value="20"></div>
  <div class="field"><label for="s4">份额4 (%)</label><input type="number" id="s4" value="10"></div>
</div>
<dl class="stat-row" style="margin-top:16px">
  <div class="stat"><dt>HHI</dt><dd id="hhi">—</dd></div>
</dl>
<p class="status" id="status" aria-live="polite"></p>
  </section>

  <footer class="foot">
    <span>所有处理都在浏览器本地完成，数据不会上传。</span>
    <a href="../index.html">返回全部工具</a>
  </footer>
</main>

<script data-inline="assets/tool-base.js"></script>
<script>
(function(){
  var $=PHT.$; var statusEl=$("#status");
  function fnum(n){ if(n===null||n===undefined||!isFinite(n)) return "—"; var a=Math.round(n*1e6)/1e6; return a.toLocaleString("zh-CN",{maximumFractionDigits:6}); }
  var compute = function compute(args){  return { hhi: fnum(a.s1 * a.s1 + a.s2 * a.s2 + a.s3 * a.s3 + a.s4 * a.s4) };  };
  function run(){ var args={};
    args["s1"]=parseFloat($("#s1").value);
    args["s2"]=parseFloat($("#s2").value);
    args["s3"]=parseFloat($("#s3").value);
    args["s4"]=parseFloat($("#s4").value);
    try { var r=compute(args);
    if(r&&r["hhi"]!==undefined){ var v=r["hhi"]; $("#hhi").textContent=(typeof v==="number")?fnum(v):v; }
      PHT.status(statusEl,(r&&r.__msg)||"计算完成",(r&&r.__type)||"ok"); } catch(e){ PHT.status(statusEl,"出错了："+e.message,"error"); }
  }
  ["s1","s2","s3","s4"].forEach(function(k){ $("#"+k).addEventListener("input",run); $("#"+k).addEventListener("change",run); });
  run();
})();
</script>
