<script>
(function(){var $=PHT.$;var inp=$("#inp"),out=$("#out");function valid(s){s=s.trim();return /^([0-9A-Fa-f]{2}[:-]){5}[0-9A-Fa-f]{2}$/.test(s)||/^([0-9A-Fa-f]{4}\.){2}[0-9A-Fa-f]{4}$/.test(s);}function run(){var v=inp.value.trim();out.textContent=v?((valid(v)?"合法 MAC 地址":"非法 MAC 地址")):"";}inp.addEventListener("input",run);run();})();
