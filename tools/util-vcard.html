<main class="shell">
  <div class="page-head">
    <span class="badge">小工具 · 本地处理</span>
    <h1>vCard 生成器</h1>
    <p>填写联系人信息，生成可下载的 vCard (v3.0)。</p>
  </div>

  <section class="panel">
<div class="field"><label>姓名</label><input id="name" type="text" placeholder="张三"><label>电话</label><input id="tel" type="text" placeholder="138..."><label>邮箱</label><input id="email" type="text" placeholder="a@b.com"><label>单位</label><input id="org" type="text"><label>备注</label><input id="note" type="text"></div><div class="field"><button id="go" class="btn">生成</button> <button id="dl" class="btn ghost">下载 .vcf</button></div><div class="field"><label>vCard</label><pre id="out"></pre></div>
  </section>

  <footer class="foot">
    <span>所有处理都在浏览器本地完成，数据不会上传。</span>
    <a href="../index.html">返回全部工具</a>
  </footer>
</main>

<script data-inline="assets/tool-base.js"></script>
<script>
(function(){var $=PHT.$;var name=$("#name"),tel=$("#tel"),email=$("#email"),org=$("#org"),note=$("#note"),out=$("#out"),go=$("#go"),dl=$("#dl");function run(){var s="BEGIN:VCARD\nVERSION:3.0\nN:"+name.value+"\nFN:"+name.value+"\n";if(tel.value)s+="TEL;TYPE=CELL:"+tel.value+"\n";if(email.value)s+="EMAIL:"+email.value+"\n";if(org.value)s+="ORG:"+org.value+"\n";if(note.value)s+="NOTE:"+note.value+"\n";s+="END:VCARD";out.textContent=s;}go.addEventListener("click",run);dl.addEventListener("click",function(){if(!out.textContent)run();PHT.download("contact.vcf",out.textContent,"text/vcard");});run();})();
</script>
