<header class="toolbar">
  <div class="toolbar-inner">
    <a class="brand" href="../index.html"><img src="../assets/favicon.svg" alt="" width="24" height="24"><span>纯 HTML 工具箱</span></a>
    <span class="spacer"></span>
    <a class="btn ghost" href="../index.html">返回首页</a>
    <button class="icon-btn" type="button" data-theme-toggle aria-label="切换深色主题" aria-pressed="false"><svg class="i-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"></circle><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M19.1 4.9l-1.4 1.4M6.3 17.7l-1.4 1.4"></path></svg><svg class="i-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 14.5A8.5 8.5 0 0 1 9.5 4 8.5 8.5 0 1 0 20 14.5Z"></path></svg></button>
  </div>
</header>

<main class="shell">
  <div class="page-head">
    <span class="badge">开发者 · 本地处理</span>
    <h1>正则表达式测试</h1>
    <p>实时测试正则，列出所有匹配及捕获分组。</p>
  </div>

  <section class="panel">
<div class="field"><label>正则模式</label><input id="pat" type="text" placeholder="例如 (\d{4})-(\d{2})"></div><div class="field"><label>标志</label><input id="fl" type="text" placeholder="g i m s（可空）"></div><div class="field"><label>测试文本</label><textarea id="txt" rows="6" placeholder="在此粘贴文本"></textarea></div><div class="field"><label>匹配结果</label><pre id="out"></pre></div>
  </section>

  <footer class="foot">
    <span>所有处理都在浏览器本地完成，数据不会上传。</span>
    <a href="../index.html">返回全部工具</a>
  </footer>
</main>

<script data-inline="assets/tool-base.js"></script>
<script>
(function(){var $=PHT.$;var pat=$("#pat"),fl=$("#fl"),txt=$("#txt"),out=$("#out");function run(){var p=pat.value,f=fl.value;if(!p){out.textContent="";return;}var re;try{re=new RegExp(p,f);}catch(e){out.textContent="正则错误: "+e.message;return;}var s=txt.value,res=[],m,count=0;if(f.indexOf("g")<0){var mm=re.exec(s);if(mm){res.push("匹配: "+mm[0]);if(mm.length>1)res.push("分组: "+JSON.stringify(mm.slice(1)));count=1;}else{res.push("无匹配");}}else{while((m=re.exec(s))){count++;res.push("#"+count+": "+m[0]+(m.length>1?("  分组: "+JSON.stringify(m.slice(1))):""));if(m.index===re.lastIndex)re.lastIndex++;}}out.textContent=(count?("共 "+count+" 处匹配\n"):"")+res.join("\n");}pat.addEventListener("input",run);fl.addEventListener("input",run);txt.addEventListener("input",run);run();})();
</script>
</body>
</html>
