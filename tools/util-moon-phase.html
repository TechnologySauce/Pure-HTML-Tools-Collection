<div class="field"><label>日期</label><input id="d" type="date"></div><div class="field"><label>结果</label><pre id="out"></pre></div>

<script data-inline="assets/tool-base.js"></script>
<script>
(function(){var $=PHT.$;var d=$("#d"),out=$("#out");if(!d.value)d.value=new Date().toISOString().slice(0,10);function phase(date){var ref=Date.UTC(2000,0,6,18,14,0);var days=(date.getTime()-ref)/86400000;var syn=29.530588853;return ((days%syn)/syn+1)%1;}function name(p){var names=["新月","娥眉月","上弦月","盈凸月","满月","亏凸月","下弦月","残月"];return names[Math.floor(p*8)%8];}function run(){var dt=new Date(d.value+"T00:00:00");var p=phase(dt);var illum=Math.abs(Math.cos(p*Math.PI))*100;out.textContent="月相: "+name(p)+"\n相位进度: "+(p*100).toFixed(1)+"%\n亮面比例(近似): "+illum.toFixed(1)+"%";}d.addEventListener("change",run);run();})();
</script>
