<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<meta name="description" content="按里程、油耗、油价及住宿餐饮估算一次出行的合计花费。">
<meta name="theme-color" content="#f6f5f1">
<link rel="icon" href="../assets/favicon.svg" type="image/svg+xml">
<script type="application/json" id="tool-meta">{"title":"出行费用估算","desc":"按里程、油耗、油价及住宿餐饮估算一次出行的合计花费。","category":"calc","tags":["出行","费用","旅游"],"order":2452}</script>
<script>try{var t=localStorage.getItem("pht-theme");if(t!=="light"&&t!=="dark"){t=window.matchMedia&&window.matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light"}document.documentElement.setAttribute("data-theme",t)}catch(e){document.documentElement.setAttribute("data-theme","light")}</script>
<style data-inline="assets/tool-base.css"></style>
<style></style>
</head>
<body>
<header class="toolbar">
  <div class="toolbar-inner">
    <a class="brand" href="../index.html"><img src="../assets/favicon.svg" alt="" width="24" height="24"><span>纯 HTML 工具箱</span></a>
    <span class="spacer"></span>
    <a class="btn ghost" href="../index.html">返回首页</a>
    <button class="icon-btn" type="button" data-theme-toggle aria-label="切换深色主题" aria-pressed="false"><svg class="i-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"></circle><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M19.1 4.9l-1.4 1.4M6.3 17.7l-1.4 1.4"></path></svg><svg class="i-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 14.5A8.5 8.5 0 0 1 9.5 4 8.5 8.5 0 1 0 20 14.5Z"></path></svg></button>
  </div>
</header>

<main class="shell">
  <div class="page-head">
    <span class="badge">计算 · 本地处理</span>
    <h1>出行费用估算</h1>
    <p>按里程、油耗、油价及住宿餐饮估算一次出行的合计花费。</p>
  </div>

  <section class="panel">
<div class="grid-2">
  <div class="field"><label for="dist">里程 (km)</label><input type="number" id="dist" value="600"></div>
  <div class="field"><label for="eff">油耗 (L/100km)</label><input type="number" id="eff" value="7.5"></div>
  <div class="field"><label for="fuel">油价 (元/L)</label><input type="number" id="fuel" value="8"></div>
  <div class="field"><label for="tolls">过路费 (元)</label><input type="number" id="tolls" value="100"></div>
  <div class="field"><label for="nights">住宿晚数</label><input type="number" id="nights" value="2"></div>
  <div class="field"><label for="lodging">每晚住宿 (元)</label><input type="number" id="lodging" value="300"></div>
  <div class="field"><label for="days">天数</label><input type="number" id="days" value="3"></div>
  <div class="field"><label for="food">每日餐饮 (元)</label><input type="number" id="food" value="150"></div>
</div>
<dl class="stat-row" style="margin-top:16px">
  <div class="stat"><dt>油费</dt><dd id="fuelc">—</dd></div>
  <div class="stat"><dt>住宿</dt><dd id="lodg">—</dd></div>
  <div class="stat"><dt>餐饮</dt><dd id="foodc">—</dd></div>
  <div class="stat"><dt>合计</dt><dd id="total">—</dd></div>
</dl>
<p class="status" id="status" aria-live="polite"></p>
  </section>

  <footer class="foot">
    <span>所有处理都在浏览器本地完成，数据不会上传。</span>
    <a href="../index.html">返回全部工具</a>
  </footer>
</main>

<script data-inline="assets/tool-base.js"></script>
<script>
(function(){
  var $=PHT.$; var statusEl=$("#status");
  function fnum(n){ if(n===null||n===undefined||!isFinite(n)) return "—"; var a=Math.round(n*1e6)/1e6; return a.toLocaleString("zh-CN",{maximumFractionDigits:6}); }
  var compute = function compute(args){  var f = a.dist / 100 * a.eff * a.fuel; var l = a.nights * a.lodging; var fo = a.days * a.food; return { fuelc: f, lodg: l, foodc: fo, total: f + a.tolls + l + fo };  };
  function run(){ var args={};
    args["dist"]=parseFloat($("#dist").value);
    args["eff"]=parseFloat($("#eff").value);
    args["fuel"]=parseFloat($("#fuel").value);
    args["tolls"]=parseFloat($("#tolls").value);
    args["nights"]=parseFloat($("#nights").value);
    args["lodging"]=parseFloat($("#lodging").value);
    args["days"]=parseFloat($("#days").value);
    args["food"]=parseFloat($("#food").value);
    try { var r=compute(args);
    if(r&&r["fuelc"]!==undefined){ var v=r["fuelc"]; $("#fuelc").textContent=(typeof v==="number")?fnum(v):v; }
    if(r&&r["lodg"]!==undefined){ var v=r["lodg"]; $("#lodg").textContent=(typeof v==="number")?fnum(v):v; }
    if(r&&r["foodc"]!==undefined){ var v=r["foodc"]; $("#foodc").textContent=(typeof v==="number")?fnum(v):v; }
    if(r&&r["total"]!==undefined){ var v=r["total"]; $("#total").textContent=(typeof v==="number")?fnum(v):v; }
      PHT.status(statusEl,(r&&r.__msg)||"计算完成",(r&&r.__type)||"ok"); } catch(e){ PHT.status(statusEl,"出错了："+e.message,"error"); }
  }
  ["dist","eff","fuel","tolls","nights","lodging","days","food"].forEach(function(k){ $("#"+k).addEventListener("input",run); $("#"+k).addEventListener("change",run); });
  run();
})();
</script>
</body>
</html>
