    <button class="icon-btn" type="button" data-theme-toggle aria-label="切换深色主题" aria-pressed="false"><svg class="i-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"></circle><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M19.1 4.9l-1.4 1.4M6.3 17.7l-1.4 1.4"></path></svg><svg class="i-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 14.5A8.5 8.5 0 0 1 9.5 4 8.5 8.5 0 1 0 20 14.5Z"></path></svg></button>

<main class="shell">
  <div class="page-head">
    <span class="badge">文本处理 · 本地处理</span>
    <h1>文本对比</h1>
    <p>对两段文本做逐行对比，标记新增与删除的行。</p>
  </div>

  <section class="panel">
<div class="field"><label>原文本（旧）</label><textarea id="a" rows="7" placeholder="旧文本，每行一行"></textarea></div><div class="field"><label>新文本</label><textarea id="b" rows="7" placeholder="新文本，每行一行"></textarea></div><div class="field"><button id="go" class="btn">对比</button></div><div class="field"><label>差异（−删除 / +新增 / 空格相同）</label><pre id="out"></pre></div>
  </section>

  <footer class="foot">
    <span>所有处理都在浏览器本地完成，数据不会上传。</span>
    <a href="../index.html">返回全部工具</a>
  </footer>
</main>

<script data-inline="assets/tool-base.js"></script>
<script>
(function(){var $=PHT.$;var a=$("#a"),b=$("#b"),out=$("#out"),go=$("#go");function diff(x,y){var n=x.length,m=y.length;var dp=[];for(var i=0;i<=n;i++){dp[i]=[];for(var j=0;j<=m;j++)dp[i][j]=0;}for(i=n-1;i>=0;i--)for(j=m-1;j>=0;j--){dp[i][j]=x[i]===y[j]?dp[i+1][j+1]+1:Math.max(dp[i+1][j],dp[i][j+1]);}var i=0,j=0,res=[];while(i<n&&j<m){if(x[i]===y[j]){res.push("  "+x[i]);i++;j++;}else if(dp[i+1][j]>=dp[i][j+1]){res.push("- "+x[i]);i++;}else{res.push("+ "+y[j]);j++;}}while(i<n){res.push("- "+x[i]);i++;}while(j<m){res.push("+ "+y[j]);j++;}return res.join("\n");}function run(){var x=a.value.split("\n"),y=b.value.split("\n");out.textContent=diff(x,y);}go.addEventListener("click",run);a.addEventListener("input",run);b.addEventListener("input",run);run();})();
</script>
</body>
