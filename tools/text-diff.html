/* inline:assets/tool-base.js:start */
/* 工具页公共脚本：构建时内联进每个工具 */
(function () {
  "use strict";

  var root = document.documentElement;
  var KEY = "pht-theme";

  function readStored() {
    try {
      var v = localStorage.getItem(KEY);
      return v === "light" || v === "dark" ? v : null;
    } catch (e) {
      return null;
    }
  }

  function setTheme(theme, persist) {
    root.setAttribute("data-theme", theme);
    var btn = document.querySelector("[data-theme-toggle]");
    if (btn) {
      btn.setAttribute("aria-pressed", theme === "dark" ? "true" : "false");
      btn.setAttribute("aria-label", theme === "dark" ? "切换到浅色主题" : "切换到深色主题");
      btn.setAttribute("title", theme === "dark" ? "切换到浅色主题" : "切换到深色主题");
    }
    if (persist) {
      try {
        localStorage.setItem(KEY, theme);
      } catch (e) {
        /* 忽略私有模式写入失败 */
      }
    }
  }

  setTheme(root.getAttribute("data-theme") === "dark" ? "dark" : "light", false);

  var toggle = document.querySelector("[data-theme-toggle]");
  if (toggle) {
    toggle.addEventListener("click", function () {
      setTheme(root.getAttribute("data-theme") === "dark" ? "light" : "dark", true);
    });
  }

  if (window.matchMedia) {
    var media = window.matchMedia("(prefers-color-scheme: dark)");
    var onChange = function (e) {
      if (!readStored()) setTheme(e.matches ? "dark" : "light", false);
    };
    if (media.addEventListener) media.addEventListener("change", onChange);
    else if (media.addListener) media.addListener(onChange);
  }

  function legacyCopy(text) {
    var ta = document.createElement("textarea");
    ta.value = text;
    ta.setAttribute("readonly", "");
    ta.style.position = "fixed";
    ta.style.top = "-1000px";
    ta.style.opacity = "0";
    document.body.appendChild(ta);
    var ok = false;
    try {
      ta.select();
      ta.setSelectionRange(0, ta.value.length);
      ok = document.execCommand("copy");
    } catch (e) {
      ok = false;
    }
    document.body.removeChild(ta);
    return ok;
  }

  function copyText(text) {
    if (navigator.clipboard && window.isSecureContext) {
      return navigator.clipboard.writeText(text).then(
        function () {
          return true;
        },
        function () {
          return legacyCopy(text);
        }
      );
    }
    return Promise.resolve(legacyCopy(text));
  }

  function flash(btn, label) {
    if (!btn) return;
    if (!btn.__label) btn.__label = btn.innerHTML;
    btn.textContent = label || "已复制";
    clearTimeout(btn.__flashTimer);
    btn.__flashTimer = setTimeout(function () {
      btn.innerHTML = btn.__label;
    }, 1400);
  }

  function setStatus(el, text, type) {
    if (!el) return;
    el.textContent = text || "";
    el.classList.remove("error", "ok");
    if (type === "error" || type === "ok") el.classList.add(type);
  }

  function download(filename, data, mime) {
    var blob = data instanceof Blob ? data : new Blob([data], { type: mime || "text/plain;charset=utf-8" });
    var url = URL.createObjectURL(blob);
    var a = document.createElement("a");
    a.href = url;
    a.download = filename;
    a.rel = "noopener";
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(function () {
      URL.revokeObjectURL(url);
    }, 1000);
  }

  function bytes(n) {
    if (!isFinite(n) || n < 0) return "-";
    var units = ["B", "KB", "MB", "GB"];
    var i = 0;
    while (n >= 1024 && i < units.length - 1) {
      n /= 1024;
      i++;
    }
    return (i === 0 ? n : n.toFixed(n >= 100 ? 0 : 1)) + " " + units[i];
  }

  function debounce(fn, wait) {
    var t;
    return function () {
      var args = arguments;
      var ctx = this;
      clearTimeout(t);
      t = setTimeout(function () {
        fn.apply(ctx, args);
      }, wait);
    };
  }

  window.PHT = {
    $: function (sel, scope) {
      return (scope || document).querySelector(sel);
    },
    $$: function (sel, scope) {
      return Array.prototype.slice.call((scope || document).querySelectorAll(sel));
    },
    copy: copyText,
    flash: flash,
    status: setStatus,
    download: download,
    bytes: bytes,
    debounce: debounce,
    setTheme: setTheme
  };
})();
/* inline:assets/tool-base.js:end */
</script>
<script>
(function () {
  "use strict";
  var $ = PHT.$;
  var textA = $("#textA");
  var textB = $("#textB");
  var view = $("#diffView");
  var statusEl = $("#status");
  var statsWrap = $("#diffStats");
  var ignoreSpace = $("#ignoreSpace");
  var ignoreCase = $("#ignoreCase");
  var autoDiff = $("#autoDiff");
  var MAX_CELLS = 6000000;
  var lastDiffText = "";

  function splitLines(text) {
    if (text === "") return [];
    var lines = text.split(/\r\n|\n|\r/);
    if (lines.length && lines[lines.length - 1] === "") lines.pop();
    return lines;
  }

  function normalize(line) {
    var s = line;
    if (ignoreSpace.checked) s = s.replace(/[ \t]+$/, "");
    if (ignoreCase.checked) s = s.toLowerCase();
    return s;
  }

  function diffLines(a, b) {
    var n = a.length;
    var m = b.length;
    if ((n + 1) * (m + 1) > MAX_CELLS) {
      throw new Error("文本太长（" + n + " 行 × " + m + " 行），请缩小对比范围");
    }
    var W = m + 1;
    var dp = new Uint32Array((n + 1) * W);
    var i;
    var j;
    for (i = n - 1; i >= 0; i--) {
      for (j = m - 1; j >= 0; j--) {
        dp[i * W + j] =
          a[i] === b[j] ? dp[(i + 1) * W + j + 1] + 1 : Math.max(dp[(i + 1) * W + j], dp[i * W + j + 1]);
      }
    }
    var out = [];
    i = 0;
    j = 0;
    while (i < n && j < m) {
      if (a[i] === b[j]) {
        out.push({ type: "equal", text: a[i] });
        i++;
        j++;
      } else if (dp[(i + 1) * W + j] >= dp[i * W + j + 1]) {
        out.push({ type: "del", text: a[i] });
        i++;
      } else {
        out.push({ type: "add", text: b[j] });
        j++;
      }
    }
    while (i < n) out.push({ type: "del", text: a[i++] });
    while (j < m) out.push({ type: "add", text: b[j++] });
    return out;
  }

  function renderDiff() {
    var rawA = splitLines(textA.value);
    var rawB = splitLines(textB.value);
    var a = rawA.map(normalize);
    var b = rawB.map(normalize);

    if (rawA.length === 0 && rawB.length === 0) {
      view.innerHTML = '<div class="diff-empty">在上方输入两段文本后点击“对比”。</div>';
      statsWrap.hidden = true;
      lastDiffText = "";
      PHT.status(statusEl, "");
      return;
    }

    var ops;
    try {
      ops = diffLines(a, b);
    } catch (e) {
      view.innerHTML = "";
      var err = document.createElement("div");
      err.className = "diff-empty";
      err.textContent = e.message;
      view.appendChild(err);
      statsWrap.hidden = true;
      lastDiffText = "";
      PHT.status(statusEl, e.message, "error");
      return;
    }

    view.textContent = "";
    var frag = document.createDocumentFragment();
    var oldNo = 0;
    var newNo = 0;
    var add = 0;
    var del = 0;
    var same = 0;
    var plain = [];

    ops.forEach(function (op) {
      var row = document.createElement("div");
      var lnOld = document.createElement("span");
      var lnNew = document.createElement("span");
      var sign = document.createElement("span");
      var txt = document.createElement("span");
      lnOld.className = "ln";
      lnNew.className = "ln";
      sign.className = "sign";
      txt.className = "txt";

      if (op.type === "equal") {
        oldNo++;
        newNo++;
        same++;
        row.className = "dl equal";
        lnOld.textContent = oldNo;
        lnNew.textContent = newNo;
        sign.textContent = " ";
        plain.push("  " + op.text);
      } else if (op.type === "del") {
        oldNo++;
        del++;
        row.className = "dl del";
        lnOld.textContent = oldNo;
        lnNew.textContent = "";
        sign.textContent = "-";
        plain.push("- " + op.text);
      } else {
        newNo++;
        add++;
        row.className = "dl add";
        lnOld.textContent = "";
        lnNew.textContent = newNo;
        sign.textContent = "+";
        plain.push("+ " + op.text);
      }
      txt.textContent = op.text === "" ? "\u00a0" : op.text;
      row.appendChild(lnOld);
      row.appendChild(lnNew);
      row.appendChild(sign);
      row.appendChild(txt);
      frag.appendChild(row);
    });

    view.appendChild(frag);
    statsWrap.hidden = false;
    $("#statAdd").textContent = "+" + add + " 新增";
    $("#statDel").textContent = "-" + del + " 删除";
    $("#statSame").textContent = same + " 相同";
    lastDiffText = plain.join("\n");

    if (add === 0 && del === 0) {
      PHT.status(statusEl, "两段文本完全一致", "ok");
    } else {
      PHT.status(statusEl, "对比完成：新增 " + add + " 行，删除 " + del + " 行，相同 " + same + " 行", "ok");
    }
  }

  var debounced = PHT.debounce(renderDiff, 220);
  [textA, textB].forEach(function (el) {
    el.addEventListener("input", function () {
      if (autoDiff.checked) debounced();
    });
  });
  ignoreSpace.addEventListener("change", renderDiff);
  ignoreCase.addEventListener("change", renderDiff);
  $("#diffBtn").addEventListener("click", renderDiff);

  $("#swapBtn").addEventListener("click", function () {
    var tmp = textA.value;
    textA.value = textB.value;
    textB.value = tmp;
    renderDiff();
  });

  $("#copyBtn").addEventListener("click", function () {
    if (!lastDiffText) {
      PHT.status(statusEl, "还没有可复制的差异", "error");
      return;
    }
    PHT.copy(lastDiffText).then(function (ok) {
      if (ok) PHT.flash($("#copyBtn"), "已复制");
      PHT.status(statusEl, ok ? "差异已复制" : "复制失败，请手动选择", ok ? "ok" : "error");
    });
  });

  $("#downloadBtn").addEventListener("click", function () {
    if (!lastDiffText) {
      PHT.status(statusEl, "还没有可下载的差异", "error");
      return;
    }
    PHT.download("diff.diff", lastDiffText + "\n", "text/plain;charset=utf-8");
  });

  $("#sampleBtn").addEventListener("click", function () {
    textA.value = "纯 HTML 工具箱\n版本 1.0.0\n支持 24 个工具\n所有数据本地处理";
    textB.value = "纯 HTML 工具箱\n版本 1.1.0\n支持 26 个工具\n所有数据只在本地处理\n新增文本对比功能";
    renderDiff();
  });

  $("#clearBtn").addEventListener("click", function () {
    textA.value = "";
    textB.value = "";
    renderDiff();
    textA.focus();
  });

  textA.focus();
})();
</script>
</body>
</html>
