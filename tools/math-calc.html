(function () {
  "use strict";

  var root = document.documentElement;
  var KEY = "pht-theme";

  function readStored() {
    try {
      var v = localStorage.getItem(KEY);
      return v === "light" || v === "dark" ? v : null;
    } catch (e) {
      return null;
    }
  }

  function setTheme(theme, persist) {
    root.setAttribute("data-theme", theme);
    var btn = document.querySelector("[data-theme-toggle]");
    if (btn) {
      btn.setAttribute("aria-pressed", theme === "dark" ? "true" : "false");
      btn.setAttribute("aria-label", theme === "dark" ? "切换到浅色主题" : "切换到深色主题");
      btn.setAttribute("title", theme === "dark" ? "切换到浅色主题" : "切换到深色主题");
    }
    if (persist) {
      try {
        localStorage.setItem(KEY, theme);
      } catch (e) {
        /* 忽略私有模式写入失败 */
      }
    }
  }

  setTheme(root.getAttribute("data-theme") === "dark" ? "dark" : "light", false);

  var toggle = document.querySelector("[data-theme-toggle]");
  if (toggle) {
    toggle.addEventListener("click", function () {
      setTheme(root.getAttribute("data-theme") === "dark" ? "light" : "dark", true);
    });
  }

  if (window.matchMedia) {
    var media = window.matchMedia("(prefers-color-scheme: dark)");
    var onChange = function (e) {
      if (!readStored()) setTheme(e.matches ? "dark" : "light", false);
    };
    if (media.addEventListener) media.addEventListener("change", onChange);
    else if (media.addListener) media.addListener(onChange);
  }

  function legacyCopy(text) {
    var ta = document.createElement("textarea");
    ta.value = text;
    ta.setAttribute("readonly", "");
    ta.style.position = "fixed";
    ta.style.top = "-1000px";
    ta.style.opacity = "0";
    document.body.appendChild(ta);
    var ok = false;
    try {
      ta.select();
      ta.setSelectionRange(0, ta.value.length);
      ok = document.execCommand("copy");
    } catch (e) {
      ok = false;
    }
    document.body.removeChild(ta);
    return ok;
  }

  function copyText(text) {
    if (navigator.clipboard && window.isSecureContext) {
      return navigator.clipboard.writeText(text).then(
        function () {
          return true;
        },
        function () {
          return legacyCopy(text);
        }
      );
    }
    return Promise.resolve(legacyCopy(text));
  }

  function flash(btn, label) {
    if (!btn) return;
    if (!btn.__label) btn.__label = btn.innerHTML;
    btn.textContent = label || "已复制";
    clearTimeout(btn.__flashTimer);
    btn.__flashTimer = setTimeout(function () {
      btn.innerHTML = btn.__label;
    }, 1400);
  }

  function setStatus(el, text, type) {
    if (!el) return;
    el.textContent = text || "";
    el.classList.remove("error", "ok");
    if (type === "error" || type === "ok") el.classList.add(type);
  }

  function download(filename, data, mime) {
    var blob = data instanceof Blob ? data : new Blob([data], { type: mime || "text/plain;charset=utf-8" });
    var url = URL.createObjectURL(blob);
    var a = document.createElement("a");
    a.href = url;
    a.download = filename;
    a.rel = "noopener";
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(function () {
      URL.revokeObjectURL(url);
    }, 1000);
  }

  function bytes(n) {
    if (!isFinite(n) || n < 0) return "-";
    var units = ["B", "KB", "MB", "GB"];
    var i = 0;
    while (n >= 1024 && i < units.length - 1) {
      n /= 1024;
      i++;
    }
    return (i === 0 ? n : n.toFixed(n >= 100 ? 0 : 1)) + " " + units[i];
  }

  function debounce(fn, wait) {
    var t;
    return function () {
      var args = arguments;
      var ctx = this;
      clearTimeout(t);
      t = setTimeout(function () {
        fn.apply(ctx, args);
      }, wait);
    };
  }

  window.PHT = {
    $: function (sel, scope) {
      return (scope || document).querySelector(sel);
    },
    $$: function (sel, scope) {
      return Array.prototype.slice.call((scope || document).querySelectorAll(sel));
    },
    copy: copyText,
    flash: flash,
    status: setStatus,
    download: download,
    bytes: bytes,
    debounce: debounce,
    setTheme: setTheme
  };
})();

    if (id === "pow" && args.length !== 2) throw new Error("pow 需要 2 个参数");
    if (["sqrt", "abs", "round", "floor", "ceil", "sin", "cos", "tan", "log", "exp"].indexOf(id) >= 0 && args.length !== 1) {
      throw new Error(id + " 需要 1 个参数");
    }
    if ((id === "min" || id === "max") && args.length < 1) throw new Error(id + " 至少需要 1 个参数");
    return FUNCS[id].apply(null, args);
  }

  function parse(input) {
    var pos = 0;
    function skip() { while (pos < input.length && /\s/.test(input.charAt(pos))) pos++; }
    function peek() { return input.charAt(pos); }

    function primary() {
      skip();
      var c = peek();
      if (c === "(") {
        pos++;
        var v = exprTop();
        skip();
        if (peek() !== ")") throw new Error("缺少右括号");
        pos++;
        return v;
      }
      if (c === "-" || c === "+") {
        pos++;
        return c === "-" ? -primary() : primary();
      }
      if (/[0-9.]/.test(c)) {
        var num = "";
        while (pos < input.length && /[0-9.eE]/.test(input.charAt(pos))) { num += input.charAt(pos); pos++; }
        var n = parseFloat(num);
        if (isNaN(n)) throw new Error("数字格式错误");
        return n;
      }
      if (/[a-zA-Z]/.test(c)) {
        var id = "";
        while (pos < input.length && /[a-zA-Z]/.test(input.charAt(pos))) { id += input.charAt(pos); pos++; }
        id = id.toLowerCase();
        skip();
        if (peek() === "(") {
          pos++;
          var args = [];
          skip();
          if (peek() !== ")") {
            args.push(exprTop());
            skip();
            while (peek() === ",") { pos++; args.push(exprTop()); skip(); }
          }
          if (peek() !== ")") throw new Error("函数缺少右括号");
          pos++;
          return applyFunc(id, args);
        }
        if (CONSTS.hasOwnProperty(id)) return CONSTS[id];
        if (FUNCS.hasOwnProperty(id)) throw new Error("函数 " + id + " 需要括号");
        throw new Error("未知标识符：" + id);
      }
      throw new Error("意外的字符：" + c);
    }

    function unary() {
      skip();
      if (peek() === "-") { pos++; return -unary(); }
      if (peek() === "+") { pos++; return unary(); }
      return primary();
    }

    function factor() {
      var v = unary();
      skip();
      while (peek() === "^") { pos++; var r = unary(); v = Math.pow(v, r); }
      return v;
    }

    function term() {
      var v = factor();
      skip();
      while (peek() === "*" || peek() === "/" || peek() === "%") {
        var op = peek(); pos++;
        var r = factor();
        if (op === "*") v = v * r;
        else if (op === "/") { if (r === 0) throw new Error("除以零"); v = v / r; }
        else { if (r === 0) throw new Error("取模零"); v = v % r; }
        skip();
      }
      return v;
    }

    function exprTop() {
      var v = term();
      skip();
      while (peek() === "+" || peek() === "-") {
        var op = peek(); pos++;
        var r = term();
        v = op === "+" ? v + r : v - r;
        skip();
      }
      return v;
    }

    skip();
    if (pos >= input.length) throw new Error("空表达式");
    var val = exprTop();
    skip();
    if (pos < input.length) throw new Error("无法解析剩余内容：" + input.slice(pos));
    return val;
  }

  function calc() {
    var s = expr.value.trim();
    if (!s) { result.value = ""; PHT.status(statusEl, ""); return; }
    try {
      var v = parse(s);
      if (typeof v !== "number" || !isFinite(v)) {
        result.value = "";
        PHT.status(statusEl, "计算结果不是有限数值", "error");
        return;
      }
      var out = (Math.abs(v - Math.round(v)) < 1e-12) ? String(Math.round(v)) : parseFloat(v.toPrecision(12)).toString();
      result.value = out;
      PHT.status(statusEl, "计算完成", "ok");
    } catch (e) {
      result.value = "";
      PHT.status(statusEl, e.message, "error");
    }
  }

  expr.addEventListener("input", calc);

  document.querySelector(".pad").addEventListener("click", function (e) {
    var btn = e.target.closest("button[data-ins]");
    if (!btn) return;
    var ins = btn.getAttribute("data-ins");
    var start = expr.selectionStart || expr.value.length;
    var end = expr.selectionEnd || expr.value.length;
    expr.value = expr.value.slice(0, start) + ins + expr.value.slice(end);
    var caret = start + ins.length;
    expr.focus();
    expr.setSelectionRange(caret, caret);
    calc();
  });

  $("#copyBtn").addEventListener("click", function () {
    if (!result.value) { PHT.status(statusEl, "没有可复制的内容", "error"); return; }
    PHT.copy(result.value).then(function (ok) {
      PHT.flash($("#copyBtn"), "已复制");
      PHT.status(statusEl, ok ? "结果已复制" : "复制失败，请手动选择", ok ? "ok" : "error");
    });
  });
  $("#clearBtn").addEventListener("click", function () {
    expr.value = "";
    result.value = "";
    PHT.status(statusEl, "");
    expr.focus();
  });

  calc();
})();
</script>
</body>
</html>
