<script data-inline="assets/tool-base.js"></script>
<script>
(function(){
  var $=PHT.$; var statusEl=$("#status");
  function fnum(n){ if(n===null||n===undefined||!isFinite(n)) return "—"; var a=Math.round(n*1e6)/1e6; return a.toLocaleString("zh-CN",{maximumFractionDigits:6}); }
  var compute = function compute(args){  return { c11: a.a11 * a.b11 + a.a12 * a.b21, c12: a.a11 * a.b12 + a.a12 * a.b22, c21: a.a21 * a.b11 + a.a22 * a.b21, c22: a.a21 * a.b12 + a.a22 * a.b22 };  };
  function run(){ var args={};
    args["a11"]=parseFloat($("#a11").value);
    args["a12"]=parseFloat($("#a12").value);
    args["a21"]=parseFloat($("#a21").value);
    args["a22"]=parseFloat($("#a22").value);
    args["b11"]=parseFloat($("#b11").value);
    args["b12"]=parseFloat($("#b12").value);
    args["b21"]=parseFloat($("#b21").value);
    args["b22"]=parseFloat($("#b22").value);
    try { var r=compute(args);
    if(r&&r["c11"]!==undefined){ var v=r["c11"]; $("#c11").textContent=(typeof v==="number")?fnum(v):v; }
    if(r&&r["c12"]!==undefined){ var v=r["c12"]; $("#c12").textContent=(typeof v==="number")?fnum(v):v; }
    if(r&&r["c21"]!==undefined){ var v=r["c21"]; $("#c21").textContent=(typeof v==="number")?fnum(v):v; }
    if(r&&r["c22"]!==undefined){ var v=r["c22"]; $("#c22").textContent=(typeof v==="number")?fnum(v):v; }
      PHT.status(statusEl,(r&&r.__msg)||"计算完成",(r&&r.__type)||"ok"); } catch(e){ PHT.status(statusEl,"出错了："+e.message,"error"); }
  }
  ["a11","a12","a21","a22","b11","b12","b21","b22"].forEach(function(k){ $("#"+k).addEventListener("input",run); $("#"+k).addEventListener("change",run); });
  run();
})();
</script>
