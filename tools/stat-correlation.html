<main class="shell">
  <div class="page-head">
    <span class="badge">计算 · 本地处理</span>
    <h1>皮尔逊相关系数</h1>
    <p>计算两组数据的 Pearson 相关系数 r（范围 -1~1）。</p>
  </div>

  <section class="panel">
<div class="grid-2">
  <div class="field"><label for="x">X 数据（逗号/空格分隔）</label><input type="text" id="x" value="1,2,3,4,5"></div>
  <div class="field"><label for="y">Y 数据</label><input type="text" id="y" value="2,4,5,4,6"></div>
</div>
<dl class="stat-row" style="margin-top:16px">
  <div class="stat"><dt>r</dt><dd id="r">—</dd></div>
</dl>
<p class="status" id="status" aria-live="polite"></p>
  </section>

  <footer class="foot">
    <span>所有处理都在浏览器本地完成，数据不会上传。</span>
    <a href="../index.html">返回全部工具</a>
  </footer>
</main>

<script data-inline="assets/tool-base.js"></script>
<script>
(function(){
  var $=PHT.$; var statusEl=$("#status");
  function fnum(n){ if(n===null||n===undefined||!isFinite(n)) return "—"; var a=Math.round(n*1e6)/1e6; return a.toLocaleString("zh-CN",{maximumFractionDigits:6}); }
  var compute = function compute(args){  function parse(s) { return s.split(/[\s,;]+/).map(Number).filter(function (x) { return !isNaN(x); }); } var x = parse(a.x), y = parse(a.y); if (x.length < 2 || x.length !== y.length) return { r: "需等长且≥2项" }; var mx = x.reduce(function (p, c) { return p + c; }, 0) / x.length, my = y.reduce(function (p, c) { return p + c; }, 0) / y.length, num = 0, dx = 0, dy = 0; for (var i = 0; i < x.length; i++) { num += (x[i] - mx) * (y[i] - my); dx += (x[i] - mx) * (x[i] - mx); dy += (y[i] - my) * (y[i] - my); } return { r: (dx === 0 || dy === 0) ? "无法计算" : num / Math.sqrt(dx * dy) };  };
  function run(){ var args={};
    args["x"]=$("#x").value;
    args["y"]=$("#y").value;
    try { var r=compute(args);
    if(r&&r["r"]!==undefined){ var v=r["r"]; $("#r").textContent=(typeof v==="number")?fnum(v):v; }
      PHT.status(statusEl,(r&&r.__msg)||"计算完成",(r&&r.__type)||"ok"); } catch(e){ PHT.status(statusEl,"出错了："+e.message,"error"); }
  }
  ["x","y"].forEach(function(k){ $("#"+k).addEventListener("input",run); $("#"+k).addEventListener("change",run); });
  run();
})();
</script>
