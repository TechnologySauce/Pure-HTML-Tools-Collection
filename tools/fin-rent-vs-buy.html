<div class="grid-2">
  <div class="field"><label for="price">房价</label><input type="number" id="price" value="2000000"></div>
  <div class="field"><label for="down">首付</label><input type="number" id="down" value="600000"></div>
  <div class="field"><label for="r">房贷利率 (%)</label><input type="number" id="r" value="4.9"></div>
  <div class="field"><label for="years">持有年数</label><input type="number" id="years" value="10"></div>
  <div class="field"><label for="rent">月租金</label><input type="number" id="rent" value="5000"></div>
  <div class="field"><label for="resale">预计售出价</label><input type="number" id="resale" value="2200000"></div>
</div>

  <div class="stat"><dt>买房总成本</dt><dd id="buy">—</dd></div>
  <div class="stat"><dt>租房总支出</dt><dd id="rentc">—</dd></div>
</dl>
<p class="status" id="status" aria-live="polite"></p>

<script data-inline="assets/tool-base.js"></script>
<script>
(function(){
  var $=PHT.$; var statusEl=$("#status");
  function fnum(n){ if(n===null||n===undefined||!isFinite(n)) return "—"; var a=Math.round(n*1e6)/1e6; return a.toLocaleString("zh-CN",{maximumFractionDigits:6}); }
  var compute = function compute(args){  var P = a.price - a.down, m = a.r / 100 / 12, n = a.years * 12; var pmt = P * m * Math.pow(1 + m, n) / (Math.pow(1 + m, n) - 1); var interest = pmt * n - P; var buy = a.down + pmt * n - a.resale; var rentc = a.rent * n; return { buy: buy, rentc: rentc };  };
  function run(){ var args={};
    args["price"]=parseFloat($("#price").value);
    args["down"]=parseFloat($("#down").value);
    args["r"]=parseFloat($("#r").value);
    args["years"]=parseFloat($("#years").value);
    args["rent"]=parseFloat($("#rent").value);
    args["resale"]=parseFloat($("#resale").value);
    try { var r=compute(args);
    if(r&&r["buy"]!==undefined){ var v=r["buy"]; $("#buy").textContent=(typeof v==="number")?fnum(v):v; }
    if(r&&r["rentc"]!==undefined){ var v=r["rentc"]; $("#rentc").textContent=(typeof v==="number")?fnum(v):v; }
      PHT.status(statusEl,(r&&r.__msg)||"计算完成",(r&&r.__type)||"ok"); } catch(e){ PHT.status(statusEl,"出错了："+e.message,"error"); }
  }
  ["price","down","r","years","rent","resale"].forEach(function(k){ $("#"+k).addEventListener("input",run); $("#"+k).addEventListener("change",run); });
  run();
})();
</script>
