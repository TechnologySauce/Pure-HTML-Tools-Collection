/* 工具页公共脚本：构建时内联进每个工具 */
(function () {
  "use strict";

  var root = document.documentElement;
  var KEY = "pht-theme";

  function readStored() {
    try {
      var v = localStorage.getItem(KEY);
      return v === "light" || v === "dark" ? v : null;
    } catch (e) {
      return null;
    }
  }

  function setTheme(theme, persist) {
    root.setAttribute("data-theme", theme);
    var btn = document.querySelector("[data-theme-toggle]");
    if (btn) {
      btn.setAttribute("aria-pressed", theme === "dark" ? "true" : "false");
      btn.setAttribute("aria-label", theme === "dark" ? "切换到浅色主题" : "切换到深色主题");
      btn.setAttribute("title", theme === "dark" ? "切换到浅色主题" : "切换到深色主题");
    }
    if (persist) {
      try {
        localStorage.setItem(KEY, theme);
      } catch (e) {
        /* 忽略私有模式写入失败 */
      }
    }
  }

  setTheme(root.getAttribute("data-theme") === "dark" ? "dark" : "light", false);

  var toggle = document.querySelector("[data-theme-toggle]");
  if (toggle) {
    toggle.addEventListener("click", function () {
      setTheme(root.getAttribute("data-theme") === "dark" ? "light" : "dark", true);
    });
  }

  if (window.matchMedia) {
    var media = window.matchMedia("(prefers-color-scheme: dark)");
    var onChange = function (e) {
      if (!readStored()) setTheme(e.matches ? "dark" : "light", false);
    };
    if (media.addEventListener) media.addEventListener("change", onChange);
    else if (media.addListener) media.addListener(onChange);
  }

  function legacyCopy(text) {
    var ta = document.createElement("textarea");
    ta.value = text;
    ta.setAttribute("readonly", "");
    ta.style.position = "fixed";
    ta.style.top = "-1000px";
    ta.style.opacity = "0";
    document.body.appendChild(ta);
    var ok = false;
    try {
      ta.select();
      ta.setSelectionRange(0, ta.value.length);
      ok = document.execCommand("copy");
    } catch (e) {
      ok = false;
    }
    document.body.removeChild(ta);
    return ok;
  }

  function copyText(text) {
    if (navigator.clipboard && window.isSecureContext) {
      return navigator.clipboard.writeText(text).then(
        function () {
          return true;
        },
        function () {
          return legacyCopy(text);
        }
      );
    }
    return Promise.resolve(legacyCopy(text));
  }

  function flash(btn, label) {
    if (!btn) return;
    if (!btn.__label) btn.__label = btn.innerHTML;
    btn.textContent = label || "已复制";
    clearTimeout(btn.__flashTimer);
    btn.__flashTimer = setTimeout(function () {
      btn.innerHTML = btn.__label;
    }, 1400);
  }

  function setStatus(el, text, type) {
    if (!el) return;
    el.textContent = text || "";
    el.classList.remove("error", "ok");
    if (type === "error" || type === "ok") el.classList.add(type);
  }

  function download(filename, data, mime) {
    var blob = data instanceof Blob ? data : new Blob([data], { type: mime || "text/plain;charset=utf-8" });
    var url = URL.createObjectURL(blob);
    var a = document.createElement("a");
    a.href = url;
    a.download = filename;
    a.rel = "noopener";
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(function () {
      URL.revokeObjectURL(url);
    }, 1000);
  }

  function bytes(n) {
    if (!isFinite(n) || n < 0) return "-";
    var units = ["B", "KB", "MB", "GB"];
    var i = 0;
    while (n >= 1024 && i < units.length - 1) {
      n /= 1024;
      i++;
    }
    return (i === 0 ? n : n.toFixed(n >= 100 ? 0 : 1)) + " " + units[i];
  }

  function debounce(fn, wait) {
    var t;
    return function () {
      var args = arguments;
      var ctx = this;
      clearTimeout(t);
      t = setTimeout(function () {
        fn.apply(ctx, args);
      }, wait);
    };
  }

  window.PHT = {
    $: function (sel, scope) {
      return (scope || document).querySelector(sel);
    },
    $$: function (sel, scope) {
      return Array.prototype.slice.call((scope || document).querySelectorAll(sel));
    },
    copy: copyText,
    flash: flash,
    status: setStatus,
    download: download,
    bytes: bytes,
    debounce: debounce,
    setTheme: setTheme
  };
})();
/* inline:assets/tool-base.js:end */
</script>
<script>
(function () {
  "use strict";
  var $ = PHT.$;
  var tsInput = $("#tsInput");
  var resultGrid = $("#resultGrid");
  var statusEl = $("#status");
  var dateInput = $("#dateInput");
  var dateStatus = $("#dateStatus");
  var WEEK = ["周日", "周一", "周二", "周三", "周四", "周五", "周六"];

  function pad(n, len) {
    return String(n).padStart(len || 2, "0");
  }

  function fmtLocal(d) {
    return (
      d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate()) + " " +
      pad(d.getHours()) + ":" + pad(d.getMinutes()) + ":" + pad(d.getSeconds()) + " " + WEEK[d.getDay()]
    );
  }

  function fmtUtc(d) {
    return (
      d.getUTCFullYear() + "-" + pad(d.getUTCMonth() + 1) + "-" + pad(d.getUTCDate()) + " " +
      pad(d.getUTCHours()) + ":" + pad(d.getUTCMinutes()) + ":" + pad(d.getUTCSeconds()) + " UTC"
    );
  }

  function relative(d) {
    var diff = d.getTime() - Date.now();
    var abs = Math.abs(diff);
    var future = diff > 0;
    var units = [
      [31536000000, "年"],
      [2592000000, "个月"],
      [604800000, "周"],
      [86400000, "天"],
      [3600000, "小时"],
      [60000, "分钟"],
      [1000, "秒"]
    ];
    if (abs < 3000) return "刚刚";
    for (var i = 0; i < units.length; i++) {
      var size = units[i][0];
      if (abs >= size) {
        var value = Math.floor(abs / size);
        return value + " " + units[i][1] + (future ? "后" : "前");
      }
    }
    return future ? "即将" : "刚刚";
  }

  function unitOf(value) {
    var mode = document.querySelector('input[name="unit"]:checked').value;
    if (mode === "s") return "s";
    if (mode === "ms") return "ms";
    return Math.abs(value) >= 100000000000 ? "ms" : "s";
  }

  function convert() {
    var raw = tsInput.value.trim();
    if (raw === "") {
      resultGrid.hidden = true;
      PHT.status(statusEl, "请输入时间戳", "error");
      return;
    }
    if (!/^-?\d+$/.test(raw)) {
      resultGrid.hidden = true;
      PHT.status(statusEl, "时间戳必须是整数，可以带负号", "error");
      return;
    }
    var value = Number(raw);
    if (!isFinite(value)) {
      resultGrid.hidden = true;
      PHT.status(statusEl, "数值超出范围", "error");
      return;
    }
    var unit = unitOf(value);
    var ms = unit === "ms" ? value : value * 1000;
    var d = new Date(ms);
    if (isNaN(d.getTime())) {
      resultGrid.hidden = true;
      PHT.status(statusEl, "这个时间戳超出了 JavaScript 支持的日期范围", "error");
      return;
    }

    $("#rLocal").textContent = fmtLocal(d);
    $("#rUtc").textContent = fmtUtc(d);
    $("#rIso").textContent = d.toISOString();
    $("#rSec").textContent = String(Math.floor(ms / 1000));
    $("#rMs").textContent = String(ms);
    $("#rRel").textContent = relative(d);
    resultGrid.hidden = false;
    PHT.status(statusEl, "已按" + (unit === "ms" ? "毫秒" : "秒") + "解析", "ok");
  }

  function updateNow() {
    var now = new Date();
    $("#nowDate").textContent = fmtLocal(now);
    $("#nowTs").textContent = String(Math.floor(now.getTime() / 1000)) + " / " + now.getTime();
  }

  function toLocalInputValue(d) {
    return (
      d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate()) + "T" +
      pad(d.getHours()) + ":" + pad(d.getMinutes()) + ":" + pad(d.getSeconds())
    );
  }

  function convertDate() {
    if (!dateInput.value) {
      PHT.status(dateStatus, "请选择日期时间", "error");
      return;
    }
    var d = new Date(dateInput.value);
    if (isNaN(d.getTime())) {
      PHT.status(dateStatus, "无法解析这个日期", "error");
      return;
    }
    PHT.status(
      dateStatus,
      "秒：" + Math.floor(d.getTime() / 1000) + "　毫秒：" + d.getTime() + "　ISO：" + d.toISOString(),
      "ok"
    );
  }

  $("#toDateBtn").addEventListener("click", convert);
  tsInput.addEventListener("keydown", function (e) {
    if (e.key === "Enter") {
      e.preventDefault();
      convert();
    }
  });
  $("#unitGroup").addEventListener("change", convert);
  $("#nowBtn").addEventListener("click", function () {
    tsInput.value = String(Math.floor(Date.now() / 1000));
    document.querySelector('input[name="unit"][value="auto"]').checked = true;
    convert();
  });
  $("#copyNow").addEventListener("click", function () {
    var text = String(Math.floor(Date.now() / 1000));
    PHT.copy(text).then(function (ok) {
      if (ok) PHT.flash($("#copyNow"));
      PHT.status(statusEl, ok ? "当前秒级时间戳已复制" : "复制失败，请手动复制", ok ? "ok" : "error");
    });
  });

  resultGrid.addEventListener("click", function (e) {
    var btn = e.target.closest("[data-copy]");
    if (!btn) return;
    var text = document.getElementById(btn.getAttribute("data-copy")).textContent;
    PHT.copy(text).then(function (ok) {
      if (ok) PHT.flash(btn);
      PHT.status(statusEl, ok ? "已复制：" + text : "复制失败，请手动选择", ok ? "ok" : "error");
    });
  });

  $("#toTsBtn").addEventListener("click", convertDate);
  $("#fillNowBtn").addEventListener("click", function () {
    dateInput.value = toLocalInputValue(new Date());
    convertDate();
  });
  dateInput.addEventListener("change", convertDate);

  try {
    var tz = Intl.DateTimeFormat().resolvedOptions().timeZone || "本地时区";
    var offset = -new Date().getTimezoneOffset();
    var sign = offset >= 0 ? "+" : "-";
    var absOffset = Math.abs(offset);
    $("#tzNote").textContent = "当前时区：" + tz + "（UTC" + sign + pad(Math.floor(absOffset / 60)) + ":" + pad(absOffset % 60) + "）";
  } catch (e) {
    $("#tzNote").textContent = "当前时区由浏览器决定。";
  }

  updateNow();
  setInterval(updateNow, 1000);
  dateInput.value = toLocalInputValue(new Date());
  convert();
  tsInput.focus();
  tsInput.select();
})();
</script>
</body>
</html>
