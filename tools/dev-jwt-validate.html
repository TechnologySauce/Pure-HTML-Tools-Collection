    <h1>JWT 校验</h1>
    <p>检查 JWT 结构是否合法，并校验收发时间、过期时间等声明。</p>
  </div>

  <section class="panel">
<div class="field"><label>JWT</label><textarea id="inp" rows="6" placeholder="粘贴 JWT 字符串"></textarea></div><div class="field"><label>结果</label><pre id="out"></pre></div>
  </section>

  <footer class="foot">
    <span>所有处理都在浏览器本地完成，数据不会上传。</span>

  </footer>
</main>

<script data-inline="assets/tool-base.js"></script>
<script>
(function(){var $=PHT.$;var inp=$("#inp"),out=$("#out");function b64url(s){s=s.replace(/-/g,"+").replace(/_/g,"/");while(s.length%4)s+="=";try{return decodeURIComponent(escape(atob(s)));}catch(e){return null;}}function run(){var v=inp.value.trim();if(!v){out.textContent="";return;}var ps=v.split("."),msgs=[];if(ps.length!==3){out.textContent="结构无效：应为 3 段";return;}var h,p;try{h=JSON.parse(b64url(ps[0]));msgs.push("头部可解析");}catch(e){msgs.push("头部解析失败");}try{p=JSON.parse(b64url(ps[1]));msgs.push("载荷可解析");}catch(e){msgs.push("载荷解析失败");}if(h&&h.alg)msgs.push("算法 alg: "+h.alg);if(p){var now=Math.floor(Date.now()/1000);if(p.exp!==undefined)msgs.push((now<p.exp?"未过期":"已过期")+" | 过期时间 exp: "+new Date(p.exp*1000).toISOString());if(p.nbf!==undefined)msgs.push((now>=p.nbf?"已生效":"未生效")+" | 生效时间 nbf: "+new Date(p.nbf*1000).toISOString());if(p.iat!==undefined)msgs.push("签发时间 iat: "+new Date(p.iat*1000).toISOString());}out.textContent=msgs.join("\n");}inp.addEventListener("input",run);run();})();
</script>
