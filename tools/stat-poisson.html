<main class="shell">
  <div class="page-head">
    <span class="badge">计算 · 本地处理</span>
    <h1>泊松分布概率</h1>
    <p>计算平均发生率 λ 下恰好 k 次与至多 k 次的概率。</p>
  </div>

  <section class="panel">
<div class="grid-2">
  <div class="field"><label for="lam">平均发生率 λ</label><input type="number" id="lam" value="3"></div>
  <div class="field"><label for="k">发生次数 k</label><input type="number" id="k" value="2"></div>
</div>
<dl class="stat-row" style="margin-top:16px">
  <div class="stat"><dt>恰好 k 次</dt><dd id="eq">—</dd></div>
  <div class="stat"><dt>至多 k 次</dt><dd id="le">—</dd></div>
</dl>
<p class="status" id="status" aria-live="polite"></p>
  </section>

  <footer class="foot">
    <span>所有处理都在浏览器本地完成，数据不会上传。</span>
    <a href="../index.html">返回全部工具</a>
  </footer>
</main>

<script data-inline="assets/tool-base.js"></script>
<script>
(function(){
  var $=PHT.$; var statusEl=$("#status");
  function fnum(n){ if(n===null||n===undefined||!isFinite(n)) return "—"; var a=Math.round(n*1e6)/1e6; return a.toLocaleString("zh-CN",{maximumFractionDigits:6}); }
  var compute = function compute(args){  function fact(n) { var r = 1; for (var i = 2; i <= n; i++) r *= i; return r; } var peq = Math.pow(a.lam, a.k) * Math.exp(-a.lam) / fact(a.k); var ple = 0; for (var i = 0; i <= a.k; i++) ple += Math.pow(a.lam, i) * Math.exp(-a.lam) / fact(i); return { eq: peq, le: ple };  };
  function run(){ var args={};
    args["lam"]=parseFloat($("#lam").value);
    args["k"]=parseFloat($("#k").value);
    try { var r=compute(args);
    if(r&&r["eq"]!==undefined){ var v=r["eq"]; $("#eq").textContent=(typeof v==="number")?fnum(v):v; }
    if(r&&r["le"]!==undefined){ var v=r["le"]; $("#le").textContent=(typeof v==="number")?fnum(v):v; }
      PHT.status(statusEl,(r&&r.__msg)||"计算完成",(r&&r.__type)||"ok"); } catch(e){ PHT.status(statusEl,"出错了："+e.message,"error"); }
  }
  ["lam","k"].forEach(function(k){ $("#"+k).addEventListener("input",run); $("#"+k).addEventListener("change",run); });
  run();
})();
</script>
