<main class="shell">
  <div class="page-head">
    <span class="badge">设计 · 本地处理</span>
    <h1>配色方案</h1>
    <p>由基色生成互补 / 类似 / 三角 / 四角配色方案。</p>
  </div>

  <section class="panel">
<div class="grid-2">
  <div class="field"><label for="hex">基色 Hex</label><input type="text" id="hex" value="#0f766e"></div>
</div>
<div class="field" style="margin-top:14px"><label for="out">生成结果</label><textarea id="out" class="code" readonly spellcheck="false" placeholder="点击生成"></textarea></div>
<div class="actions">
  <button class="btn primary" id="gen" type="button">生成</button>
  <button class="btn" id="copy" type="button">复制</button>
</div>
<p class="status" id="status" aria-live="polite"></p>
  </section>

  <footer class="foot">
    <span>所有处理都在浏览器本地完成，数据不会上传。</span>
    <a href="../index.html">返回全部工具</a>
  </footer>
</main>

<script data-inline="assets/tool-base.js"></script>
<script>
(function(){
  var $=PHT.$; var statusEl=$("#status"); var out=$("#out");
  function gen(args){
 function hr(h) { h = h.replace("#", ""); if (h.length === 3) h = h.split("").map(function (c) { return c + c; }).join(""); return [parseInt(h.slice(0, 2), 16) / 255, parseInt(h.slice(2, 4), 16) / 255, parseInt(h.slice(4, 6), 16) / 255]; } function hsl(rgb) { var r = rgb[0], g = rgb[1], b = rgb[2], max = Math.max(r, g, b), min = Math.min(r, g, b), dl = max - min, h = 0, s = 0, l = (max + min) / 2; if (dl !== 0) { s = l > 0.5 ? dl / (2 - max - min) : dl / (max + min); if (max === r) h = (g - b) / dl + (g < b ? 6 : 0); else if (max === g) h = (b - r) / dl + 2; else h = (r - g) / dl + 4; h *= 60; } return [h, s * 100, l * 100]; } function rhsl(h, s, l) { h = ((h % 360) + 360) % 360; s /= 100; l /= 100; var c = (1 - Math.abs(2 * l - 1)) * s, x = c * (1 - Math.abs((h / 60) % 2 - 1)), m = l - c / 2, r = 0, g = 0, b = 0; if (h < 60) { r = c; g = x; } else if (h < 120) { r = x; g = c; } else if (h < 180) { g = c; b = x; } else if (h < 240) { g = x; b = c; } else if (h < 300) { r = x; b = c; } else { r = c; b = x; } return "#" + [r, g, b].map(function (v) { return ("0" + Math.round((v + m) * 255).toString(16)).slice(-2); }).join(""); } var H = hsl(hr(a.hex)); return "基色: " + a.hex + "\n互补色: " + rhsl(H[0] + 180, H[1], H[2]) + "\n类似色: " + rhsl(H[0] + 30, H[1], H[2]) + " / " + rhsl(H[0] - 30, H[1], H[2]) + "\n三角色: " + rhsl(H[0] + 120, H[1], H[2]) + " / " + rhsl(H[0] + 240, H[1], H[2]) + "\n四角色: " + rhsl(H[0] + 90, H[1], H[2]) + " / " + rhsl(H[0] + 180, H[1], H[2]) + " / " + rhsl(H[0] + 270, H[1], H[2]); 
  }
  function run(){ var args={};
    args["hex"]=$("#hex").value;
    try { var r=gen(args); out.value=(typeof r==="string")?r:String(r); PHT.status(statusEl,"已生成","ok"); } catch(e){ PHT.status(statusEl,"出错了："+e.message,"error"); }
  }
  ["hex"].forEach(function(k){ $("#"+k).addEventListener("input",run); $("#"+k).addEventListener("change",run); });
  $("#gen").addEventListener("click",run);
  $("#copy").addEventListener("click",function(){ if(!out.value){ PHT.status(statusEl,"没有内容","error"); return; } PHT.copy(out.value).then(function(ok){ PHT.flash($("#copy"),"已复制"); PHT.status(statusEl,ok?"已复制":"复制失败",ok?"ok":"error"); }); });
  run();
})();
</script>
</body>
