<main class="shell">
  <div class="page-head">
    <span class="badge">计算 · 本地处理</span>
    <h1>模幂运算</h1>
    <p>计算 (base^exp) mod mod，用于密码学运算。</p>
  </div>

  <section class="panel">
<div class="grid-2">
  <div class="field"><label for="base">底数</label><input type="number" id="base" value="2"></div>
  <div class="field"><label for="exp">指数</label><input type="number" id="exp" value="10" min="0"></div>
  <div class="field"><label for="mod">模</label><input type="number" id="mod" value="1000" min="1"></div>
</div>
<dl class="stat-row" style="margin-top:16px">
  <div class="stat"><dt>结果</dt><dd id="res">—</dd></div>
</dl>
<p class="status" id="status" aria-live="polite"></p>
  </section>

  <footer class="foot">
    <span>所有处理都在浏览器本地完成，数据不会上传。</span>
    <a href="../index.html">返回全部工具</a>
  </footer>
</main>

<script data-inline="assets/tool-base.js"></script>
<script>
(function(){
  var $=PHT.$; var statusEl=$("#status");
  function fnum(n){ if(n===null||n===undefined||!isFinite(n)) return "—"; var a=Math.round(n*1e6)/1e6; return a.toLocaleString("zh-CN",{maximumFractionDigits:6}); }
  var compute = function compute(args){  var b = Math.floor(a.base), e = Math.floor(a.exp), m = Math.floor(a.mod); if (m <= 0) return { res: "模需为正整数" }; b = ((b % m) + m) % m; var r = 1; while (e > 0) { if (e & 1) r = (r * b) % m; b = (b * b) % m; e = Math.floor(e / 2); } return { res: r };  };
  function run(){ var args={};
    args["base"]=parseFloat($("#base").value);
    args["exp"]=parseFloat($("#exp").value);
    args["mod"]=parseFloat($("#mod").value);
    try { var r=compute(args);
    if(r&&r["res"]!==undefined){ var v=r["res"]; $("#res").textContent=(typeof v==="number")?fnum(v):v; }
      PHT.status(statusEl,(r&&r.__msg)||"计算完成",(r&&r.__type)||"ok"); } catch(e){ PHT.status(statusEl,"出错了："+e.message,"error"); }
  }
  ["base","exp","mod"].forEach(function(k){ $("#"+k).addEventListener("input",run); $("#"+k).addEventListener("change",run); });
  run();
})();
</script>
