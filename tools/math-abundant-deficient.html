<script data-inline="assets/tool-base.js"></script>
<script>
(function(){
  var $=PHT.$; var statusEl=$("#status");
  function fnum(n){ if(n===null||n===undefined||!isFinite(n)) return "—"; var a=Math.round(n*1e6)/1e6; return a.toLocaleString("zh-CN",{maximumFractionDigits:6}); }
  var compute = function compute(args){  var n = Math.floor(Math.abs(a.n)); if (n < 1) return { __msg: "请输入正整数", __type: "error" }; if (n === 1) return { cls: "亏数（特例）", sum: 0 }; var s = 1; for (var i = 2; i <= Math.sqrt(n); i++) if (n % i === 0) { s += i; if (i !== n / i) s += n / i; } var cls = s === n ? "完全数" : s > n ? "盈数" : "亏数"; return { cls: cls, sum: s };  };
  function run(){ var args={};
    args["n"]=parseFloat($("#n").value);
    try { var r=compute(args);
    if(r&&r["cls"]!==undefined){ var v=r["cls"]; $("#cls").textContent=(typeof v==="number")?fnum(v):v; }
    if(r&&r["sum"]!==undefined){ var v=r["sum"]; $("#sum").textContent=(typeof v==="number")?fnum(v):v; }
      PHT.status(statusEl,(r&&r.__msg)||"计算完成",(r&&r.__type)||"ok"); } catch(e){ PHT.status(statusEl,"出错了："+e.message,"error"); }
  }
  ["n"].forEach(function(k){ $("#"+k).addEventListener("input",run); $("#"+k).addEventListener("change",run); });
  run();
})();
</script>
