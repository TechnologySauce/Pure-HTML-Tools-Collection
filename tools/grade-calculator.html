<html lang="zh-CN" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<meta name="theme-color" content="#f6f5f1">
<link rel="icon" href="../assets/favicon.svg" type="image/svg+xml">
<script type="application/json" id="tool-meta">{"title":"加权平均分","desc":"每行填写「分数,权重」，自动计算加权平均分、总权重与科目数，适合成绩与绩效汇总。","category":"calc","tags":["平均分","加权","成绩","GPA"],"order":10}</script>
<script>try{var t=localStorage.getItem("pht-theme");if(t!=="light"&&t!=="dark"){t=window.matchMedia&&window.matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light"}document.documentElement.setAttribute("data-theme",t)}catch(e){document.documentElement.setAttribute("data-theme","light")}</script>

</head>
<body>
<header class="toolbar">
  <div class="toolbar-inner">
    <a class="brand" href="../index.html"><img src="../assets/favicon.svg" alt="" width="24" height="24"><span>纯 HTML 工具箱</span></a>
    <span class="spacer"></span>
    <a class="btn ghost" href="../index.html">返回首页</a>
    <button class="icon-btn" type="button" data-theme-toggle aria-label="切换深色主题" aria-pressed="false"><svg class="i-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"></circle><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M19.1 4.9l-1.4 1.4M6.3 17.7l-1.4 1.4"></path></svg><svg class="i-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 14.5A8.5 8.5 0 0 1 9.5 4 8.5 8.5 0 1 0 20 14.5Z"></path></svg></button>
  </div>
</header>

<main class="shell">
  <div class="page-head">
    <span class="badge">计算 · 本地处理</span>
    <h1>加权平均分</h1>
    <p>每行填写「分数,权重」，自动计算加权平均分、总权重与科目数，适合成绩与绩效汇总。</p>
  </div>

  <section class="panel">
<div class="field"><label for="rows">成绩（每行：分数,权重）</label><textarea id="rows" class="code" spellcheck="false" placeholder="90,3&#10;85,2&#10;76,4"></textarea></div>
<dl class="stat-row" style="margin-top:16px">
  <div class="stat"><dt>加权平均分</dt><dd id="avg">-</dd></div>
  <div class="stat"><dt>总权重</dt><dd id="tw">-</dd></div>
  <div class="stat"><dt>科目数</dt><dd id="cnt">-</dd></div>
</dl>
<p class="status" id="status" aria-live="polite"></p>
  </section>

  <footer class="foot">
    <span>所有处理都在浏览器本地完成，数据不会上传。</span>
    <a href="../index.html">返回全部工具</a>
  </footer>
</main>

<script data-inline="assets/tool-base.js"></script>
<script>
(function(){
  var $ = PHT.$;
  var statusEl=$("#status");
  function run(){
    var lines=$("#rows").value.split(/\r?\n/).map(function(s){return s.trim();}).filter(Boolean);
    var sum=0, wsum=0, cnt=0;
    for(var i=0;i<lines.length;i++){
      var parts=lines[i].split(/[,，\s]+/);
      var s=parseFloat(parts[0]), w=parts.length>1?parseFloat(parts[1]):1;
      if(isNaN(s)){ PHT.status(statusEl,"第 "+(i+1)+" 行分数无效","error"); return; }
      if(isNaN(w)||w<0){ PHT.status(statusEl,"第 "+(i+1)+" 行权重无效","error"); return; }
      sum+=s*w; wsum+=w; cnt++;
    }
    if(cnt===0){ $("#avg").textContent="-"; $("#tw").textContent="-"; $("#cnt").textContent="-"; PHT.status(statusEl,"请输入成绩"); return; }
    $("#avg").textContent=(sum/wsum).toFixed(2);
    $("#tw").textContent=wsum.toLocaleString("zh-CN");
    $("#cnt").textContent=cnt;
    PHT.status(statusEl,"计算完成","ok");
  }
  $("#rows").addEventListener("input",run);
  run();
})();
</script>
</body>
</html>
