/* 工具页公共脚本：构建时内联进每个工具 */
(function () {
  "use strict";

  var root = document.documentElement;
  var KEY = "pht-theme";

  function readStored() {
    try {
      var v = localStorage.getItem(KEY);
      return v === "light" || v === "dark" ? v : null;
    } catch (e) {
      return null;
    }
  }

  function setTheme(theme, persist) {
    root.setAttribute("data-theme", theme);
    var btn = document.querySelector("[data-theme-toggle]");
    if (btn) {
      btn.setAttribute("aria-pressed", theme === "dark" ? "true" : "false");
      btn.setAttribute("aria-label", theme === "dark" ? "切换到浅色主题" : "切换到深色主题");
      btn.setAttribute("title", theme === "dark" ? "切换到浅色主题" : "切换到深色主题");
    }
    if (persist) {
      try {
        localStorage.setItem(KEY, theme);
      } catch (e) {
        /* 忽略私有模式写入失败 */
      }
    }
  }

  setTheme(root.getAttribute("data-theme") === "dark" ? "dark" : "light", false);

  var toggle = document.querySelector("[data-theme-toggle]");
  if (toggle) {
    toggle.addEventListener("click", function () {
      setTheme(root.getAttribute("data-theme") === "dark" ? "light" : "dark", true);
    });
  }

  if (window.matchMedia) {
    var media = window.matchMedia("(prefers-color-scheme: dark)");
    var onChange = function (e) {
      if (!readStored()) setTheme(e.matches ? "dark" : "light", false);
    };
    if (media.addEventListener) media.addEventListener("change", onChange);
    else if (media.addListener) media.addListener(onChange);
  }

  function legacyCopy(text) {
    var ta = document.createElement("textarea");
    ta.value = text;
    ta.setAttribute("readonly", "");
    ta.style.position = "fixed";
    ta.style.top = "-1000px";
    ta.style.opacity = "0";
    document.body.appendChild(ta);
    var ok = false;
    try {
      ta.select();
      ta.setSelectionRange(0, ta.value.length);
      ok = document.execCommand("copy");
    } catch (e) {
      ok = false;
    }
    document.body.removeChild(ta);
    return ok;
  }

  function copyText(text) {
    if (navigator.clipboard && window.isSecureContext) {
      return navigator.clipboard.writeText(text).then(
        function () {
          return true;
        },
        function () {
          return legacyCopy(text);
        }
      );
    }
    return Promise.resolve(legacyCopy(text));
  }

  function flash(btn, label) {
    if (!btn) return;
    if (!btn.__label) btn.__label = btn.innerHTML;
    btn.textContent = label || "已复制";
    clearTimeout(btn.__flashTimer);
    btn.__flashTimer = setTimeout(function () {
      btn.innerHTML = btn.__label;
    }, 1400);
  }

  function setStatus(el, text, type) {
    if (!el) return;
    el.textContent = text || "";
    el.classList.remove("error", "ok");
    if (type === "error" || type === "ok") el.classList.add(type);
  }

  function download(filename, data, mime) {
    var blob = data instanceof Blob ? data : new Blob([data], { type: mime || "text/plain;charset=utf-8" });
    var url = URL.createObjectURL(blob);
    var a = document.createElement("a");
    a.href = url;
    a.download = filename;
    a.rel = "noopener";
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(function () {
      URL.revokeObjectURL(url);
    }, 1000);
  }

  function bytes(n) {
    if (!isFinite(n) || n < 0) return "-";
    var units = ["B", "KB", "MB", "GB"];
    var i = 0;
    while (n >= 1024 && i < units.length - 1) {
      n /= 1024;
      i++;
    }
    return (i === 0 ? n : n.toFixed(n >= 100 ? 0 : 1)) + " " + units[i];
  }

  function debounce(fn, wait) {
    var t;
    return function () {
      var args = arguments;
      var ctx = this;
      clearTimeout(t);
      t = setTimeout(function () {
        fn.apply(ctx, args);
      }, wait);
    };
  }

  window.PHT = {
    $: function (sel, scope) {
      return (scope || document).querySelector(sel);
    },
    $$: function (sel, scope) {
      return Array.prototype.slice.call((scope || document).querySelectorAll(sel));
    },
    copy: copyText,
    flash: flash,
    status: setStatus,
    download: download,
    bytes: bytes,
    debounce: debounce,
    setTheme: setTheme
  };
})();
/* inline:assets/tool-base.js:end */
</script>
<script>
(function () {
  "use strict";
  var $ = PHT.$;

  var DATA = [
    {
      id: "length",
      name: "长度",
      units: [
        { id: "mm", name: "毫米 (mm)", factor: 0.001 },
        { id: "cm", name: "厘米 (cm)", factor: 0.01 },
        { id: "m", name: "米 (m)", factor: 1 },
        { id: "km", name: "千米 (km)", factor: 1000 },
        { id: "in", name: "英寸 (in)", factor: 0.0254 },
        { id: "ft", name: "英尺 (ft)", factor: 0.3048 },
        { id: "yd", name: "码 (yd)", factor: 0.9144 },
        { id: "mi", name: "英里 (mi)", factor: 1609.344 },
        { id: "nmi", name: "海里 (nmi)", factor: 1852 }
      ],
      defFrom: "m",
      defTo: "km"
    },
    {
      id: "mass",
      name: "质量",
      units: [
        { id: "mg", name: "毫克 (mg)", factor: 0.000001 },
        { id: "g", name: "克 (g)", factor: 0.001 },
        { id: "kg", name: "千克 (kg)", factor: 1 },
        { id: "t", name: "吨 (t)", factor: 1000 },
        { id: "jin", name: "斤", factor: 0.5 },
        { id: "lb", name: "磅 (lb)", factor: 0.45359237 },
        { id: "oz", name: "盎司 (oz)", factor: 0.028349523125 }
      ],
      defFrom: "kg",
      defTo: "jin"
    },
    {
      id: "area",
      name: "面积",
      units: [
        { id: "cm2", name: "平方厘米 (cm²)", factor: 0.0001 },
        { id: "m2", name: "平方米 (m²)", factor: 1 },
        { id: "km2", name: "平方千米 (km²)", factor: 1000000 },
        { id: "ha", name: "公顷 (ha)", factor: 10000 },
        { id: "mu", name: "亩", factor: 666.6666666667 },
        { id: "ft2", name: "平方英尺 (ft²)", factor: 0.09290304 },
        { id: "acre", name: "英亩 (acre)", factor: 4046.8564224 }
      ],
      defFrom: "m2",
      defTo: "mu"
    },
    {
      id: "volume",
      name: "体积",
      units: [
        { id: "ml", name: "毫升 (mL)", factor: 0.001 },
        { id: "l", name: "升 (L)", factor: 1 },
        { id: "m3", name: "立方米 (m³)", factor: 1000 },
        { id: "cup", name: "杯（美制）", factor: 0.2365882365 },
        { id: "floz", name: "液量盎司（美制）", factor: 0.0295735295625 },
        { id: "qt", name: "夸脱（美制）", factor: 0.946352946 },
        { id: "gal", name: "加仑（美制）", factor: 3.785411784 }
      ],
      defFrom: "l",
      defTo: "ml"
    },
    {
      id: "speed",
      name: "速度",
      units: [
        { id: "ms", name: "米每秒 (m/s)", factor: 1 },
        { id: "kmh", name: "千米每小时 (km/h)", factor: 0.2777777777778 },
        { id: "mph", name: "英里每小时 (mph)", factor: 0.44704 },
        { id: "knot", name: "节 (kn)", factor: 0.5144444444444 }
      ],
      defFrom: "kmh",
      defTo: "ms"
    },
    {
      id: "data",
      name: "数据存储",
      units: [
        { id: "bit", name: "比特 (bit)", factor: 0.125 },
        { id: "b", name: "字节 (B)", factor: 1 },
        { id: "kb", name: "千字节 (KB)", factor: 1024 },
        { id: "mb", name: "兆字节 (MB)", factor: 1048576 },
        { id: "gb", name: "吉字节 (GB)", factor: 1073741824 },
        { id: "tb", name: "太字节 (TB)", factor: 1099511627776 }
      ],
      defFrom: "gb",
      defTo: "mb"
    },
    {
      id: "time",
      name: "时间",
      units: [
        { id: "ms", name: "毫秒 (ms)", factor: 0.001 },
        { id: "s", name: "秒 (s)", factor: 1 },
        { id: "min", name: "分钟 (min)", factor: 60 },
        { id: "h", name: "小时 (h)", factor: 3600 },
        { id: "day", name: "天 (d)", factor: 86400 },
        { id: "week", name: "周", factor: 604800 },
        { id: "year", name: "年（365.25 天）", factor: 31557600 }
      ],
      defFrom: "h",
      defTo: "min"
    },
    {
      id: "temperature",
      name: "温度",
      units: [
        { id: "c", name: "摄氏度 (°C)" },
        { id: "f", name: "华氏度 (°F)" },
        { id: "k", name: "开尔文 (K)" }
      ],
      defFrom: "c",
      defTo: "f"
    }
  ];

  var catSel = $("#category");
  var fromUnit = $("#fromUnit");
  var toUnit = $("#toUnit");
  var fromValue = $("#fromValue");
  var toValue = $("#toValue");
  var body = $("#unitBody");
  var status = $("#status");

  DATA.forEach(function (cat) {
    var opt = document.createElement("option");
    opt.value = cat.id;
    opt.textContent = cat.name;
    catSel.appendChild(opt);
  });

  function current() {
    return DATA.filter(function (c) { return c.id === catSel.value; })[0];
  }

  function unitName(cat, id) {
    var u = cat.units.filter(function (x) { return x.id === id; })[0];
    return u ? u.name : id;
  }

  // 温度用显式公式，其余按基准单位比例换算
  function toCelsius(value, id) {
    if (id === "c") return value;
    if (id === "f") return (value - 32) * 5 / 9;
    return value - 273.15;
  }

  function fromCelsius(value, id) {
    if (id === "c") return value;
    if (id === "f") return value * 9 / 5 + 32;
    return value + 273.15;
  }

  function convert(cat, value, fromId, toId) {
    if (cat.id === "temperature") return fromCelsius(toCelsius(value, fromId), toId);
    var from = cat.units.filter(function (u) { return u.id === fromId; })[0];
    var to = cat.units.filter(function (u) { return u.id === toId; })[0];
    if (!from || !to) return NaN;
    return (value * from.factor) / to.factor;
  }

  function fmt(n) {
    if (!isFinite(n)) return "-";
    if (n === 0) return "0";
    var abs = Math.abs(n);
    if (abs >= 1e12 || abs < 1e-6) return n.toExponential(6).replace(/e([+-])(\\d)$/, "e$10$1");
    var digits = abs >= 1000 ? 2 : abs >= 1 ? 4 : 6;
    return Number(n.toFixed(digits)).toLocaleString("en-US", { maximumFractionDigits: digits });
  }

  function fillUnits(cat) {
    [fromUnit, toUnit].forEach(function (sel) {
      sel.textContent = "";
      cat.units.forEach(function (u) {
        var opt = document.createElement("option");
        opt.value = u.id;
        opt.textContent = u.name;
        sel.appendChild(opt);
      });
    });
    fromUnit.value = cat.defFrom;
    toUnit.value = cat.defTo;
  }

  function renderTable(cat, value, fromId, toId) {
    body.textContent = "";
    cat.units.forEach(function (u) {
      var tr = document.createElement("tr");
      if (u.id === fromId) tr.className = "is-source";
      var th = document.createElement("td");
      th.textContent = u.name;
      var td = document.createElement("td");
      var converted = convert(cat, value, fromId, u.id);
      td.textContent = fmt(converted) + (u.id === toId ? "  ←" : "");
      tr.appendChild(th);
      tr.appendChild(td);
      body.appendChild(tr);
    });
  }

  function update() {
    PHT.status(status, "");
    var cat = current();
    var raw = fromValue.value.trim();
    var value = Number(raw);
    if (raw === "" || !isFinite(value)) {
      toValue.value = "";
      $("#resultMain").textContent = "-";
      $("#resultNote").textContent = "请输入一个有效数字";
      body.textContent = "";
      return;
    }
    var fromId = fromUnit.value;
    var toId = toUnit.value;
    if (fromId === toId) {
      toValue.value = fmt(value) + "";
      $("#resultMain").textContent = fmt(value) + " " + unitName(cat, toId);
      $("#resultNote").textContent = "原单位与目标单位相同";
    } else {
      var out = convert(cat, value, fromId, toId);
      toValue.value = fmt(out);
      $("#resultMain").textContent = fmt(out) + " " + unitName(cat, toId);
      $("#resultNote").textContent = fmt(value) + " " + unitName(cat, fromId) + " = " + fmt(out) + " " + unitName(cat, toId);
      if (cat.id === "temperature") {
        var kelvin = toCelsius(value, fromId) + 273.15;
        if (kelvin < 0) PHT.status(status, "低于绝对零度（0 K），现实中不存在这样的温度", "error");
      }
    }
    renderTable(cat, value, fromId, toId);
  }

  catSel.addEventListener("change", function () {
    var cat = current();
    fillUnits(cat);
    update();
  });

  fromUnit.addEventListener("change", update);
  toUnit.addEventListener("change", update);
  fromValue.addEventListener("input", update);

  $("#swapBtn").addEventListener("click", function () {
    var a = fromUnit.value;
    fromUnit.value = toUnit.value;
    toUnit.value = a;
    // 交换后把上一次的结果作为新的输入，方便连续换算
    var out = toValue.value;
    var parsed = Number(String(out).replace(/,/g, ""));
    if (out && isFinite(parsed)) fromValue.value = String(parsed);
    update();
    PHT.status(status, "已交换单位", "ok");
  });

  fillUnits(DATA[0]);
  update();
})();
</script>
</body>
</html>
