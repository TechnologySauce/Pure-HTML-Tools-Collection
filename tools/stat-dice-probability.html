<header class="toolbar">
  <div class="toolbar-inner">
    <a class="brand" href="../index.html"><img src="../assets/favicon.svg" alt="" width="24" height="24"><span>纯 HTML 工具箱</span></a>
    <span class="spacer"></span>
    <a class="btn ghost" href="../index.html">返回首页</a>
    <button class="icon-btn" type="button" data-theme-toggle aria-label="切换深色主题" aria-pressed="false"><svg class="i-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"></circle><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M19.1 4.9l-1.4 1.4M6.3 17.7l-1.4 1.4"></path></svg><svg class="i-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 14.5A8.5 8.5 0 0 1 9.5 4 8.5 8.5 0 1 0 20 14.5Z"></path></svg></button>
  </div>
</header>

<main class="shell">
  <div class="page-head">
    <span class="badge">计算 · 本地处理</span>
    <h1>掷骰概率</h1>
    <p>计算 m 个 n 面骰子点数之和恰好等于目标值的概率。</p>
  </div>

  <section class="panel">
<div class="grid-2">
  <div class="field"><label for="dice">骰子数 m</label><input type="number" id="dice" value="2"></div>
  <div class="field"><label for="sides">面数 n</label><input type="number" id="sides" value="6"></div>
  <div class="field"><label for="target">目标和</label><input type="number" id="target" value="7"></div>
</div>
<dl class="stat-row" style="margin-top:16px">
  <div class="stat"><dt>概率</dt><dd id="p">—</dd></div>
  <div class="stat"><dt>组合数</dt><dd id="ways">—</dd></div>
</dl>
<p class="status" id="status" aria-live="polite"></p>
  </section>

  <footer class="foot">
    <span>所有处理都在浏览器本地完成，数据不会上传。</span>
    <a href="../index.html">返回全部工具</a>
  </footer>
</main>

<script data-inline="assets/tool-base.js"></script>
<script>
(function(){
  var $=PHT.$; var statusEl=$("#status");
  function fnum(n){ if(n===null||n===undefined||!isFinite(n)) return "—"; var a=Math.round(n*1e6)/1e6; return a.toLocaleString("zh-CN",{maximumFractionDigits:6}); }
  var compute = function compute(args){  var m = Math.max(1, Math.min(10, a.dice | 0)), n = Math.max(2, Math.min(40, a.sides | 0)), t = a.target | 0; if (t < m || t > m * n) return { p: 0, ways: 0 }; var cur = []; for (var i = 1; i <= n; i++) cur[i] = 1; for (var d = 2; d <= m; d++) { var nxt = []; for (var s = d; s <= d * n; s++) { var sum = 0; for (var k = 1; k <= n && k <= s - d + 1; k++) sum += cur[s - k] || 0; nxt[s] = sum; } cur = nxt; } var ways = cur[t] || 0; var total = Math.pow(n, m); return { p: ways / total, ways: ways };  };
  function run(){ var args={};
    args["dice"]=parseFloat($("#dice").value);
    args["sides"]=parseFloat($("#sides").value);
    args["target"]=parseFloat($("#target").value);
    try { var r=compute(args);
    if(r&&r["p"]!==undefined){ var v=r["p"]; $("#p").textContent=(typeof v==="number")?fnum(v):v; }
    if(r&&r["ways"]!==undefined){ var v=r["ways"]; $("#ways").textContent=(typeof v==="number")?fnum(v):v; }
      PHT.status(statusEl,(r&&r.__msg)||"计算完成",(r&&r.__type)||"ok"); } catch(e){ PHT.status(statusEl,"出错了："+e.message,"error"); }
  }
  ["dice","sides","target"].forEach(function(k){ $("#"+k).addEventListener("input",run); $("#"+k).addEventListener("change",run); });
  run();
})();
</script>
</body>
