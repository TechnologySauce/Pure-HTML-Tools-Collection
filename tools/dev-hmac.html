<main class="shell">
  <div class="page-head">
    <span class="badge">开发者 · 本地处理</span>
    <h1>HMAC 生成</h1>
    <p>使用 Web Crypto 计算基于 SHA 的 HMAC 消息认证码。</p>
  </div>

  <section class="panel">
<div class="field"><label>消息</label><textarea id="msg" rows="5" placeholder="消息文本"></textarea></div><div class="field"><label>密钥</label><input id="key" type="text" placeholder="密钥"></div><div class="field"><label>算法</label><select id="algo"><option value="SHA-256" selected>SHA-256</option><option value="SHA-1">SHA-1</option><option value="SHA-384">SHA-384</option><option value="SHA-512">SHA-512</option></select> <button id="go" class="btn">计算</button> <button id="cp" class="btn ghost">复制</button></div><div class="field"><label>结果</label><pre id="out"></pre></div>
  </section>

  <footer class="foot">
    <span>所有处理都在浏览器本地完成，数据不会上传。</span>
    <a href="../index.html">返回全部工具</a>
  </footer>
</main>

<script data-inline="assets/tool-base.js"></script>
<script>
(function(){var $=PHT.$;var msg=$("#msg"),key=$("#key"),algo=$("#algo"),out=$("#out"),go=$("#go"),cp=$("#cp");function hx(b){return Array.prototype.map.call(new Uint8Array(b),function(x){return ("0"+x.toString(16)).slice(-2);}).join("");}function run(){if(!crypto||!crypto.subtle){out.textContent="当前环境不支持（请用 https 或 localhost 打开）";return;}var m=msg.value,k=key.value,a=algo.value;if(!m||!k){out.textContent="";return;}crypto.subtle.importKey("raw",new TextEncoder().encode(k),{name:"HMAC",hash:a},false,["sign"]).then(function(ki){return crypto.subtle.sign("HMAC",ki,new TextEncoder().encode(m));}).then(function(s){out.textContent=hx(s);}).catch(function(e){out.textContent="错误: "+e.message;});}go.addEventListener("click",run);msg.addEventListener("input",run);key.addEventListener("input",run);algo.addEventListener("change",run);cp.addEventListener("click",function(){PHT.copy(out.textContent).then(function(){PHT.flash(cp,"已复制");});});run();})();
</script>
</body>
