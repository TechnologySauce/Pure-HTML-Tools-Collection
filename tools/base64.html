<script>
/* inline:assets/tool-base.js:start */
/* 工具页公共脚本：构建时内联进每个工具 */
(function () {
  "use strict";

  var root = document.documentElement;
  var KEY = "pht-theme";

  function readStored() {
    try {
      var v = localStorage.getItem(KEY);
      return v === "light" || v === "dark" ? v : null;
    } catch (e) {
      return null;
    }
  }

  function setTheme(theme, persist) {
    root.setAttribute("data-theme", theme);
    var btn = document.querySelector("[data-theme-toggle]");
    if (btn) {
      btn.setAttribute("aria-pressed", theme === "dark" ? "true" : "false");
      btn.setAttribute("aria-label", theme === "dark" ? "切换到浅色主题" : "切换到深色主题");
      btn.setAttribute("title", theme === "dark" ? "切换到浅色主题" : "切换到深色主题");
    }
    if (persist) {
      try {
        localStorage.setItem(KEY, theme);
      } catch (e) {
        /* 忽略私有模式写入失败 */
      }
    }
  }

  setTheme(root.getAttribute("data-theme") === "dark" ? "dark" : "light", false);

  var toggle = document.querySelector("[data-theme-toggle]");
  if (toggle) {
    toggle.addEventListener("click", function () {
      setTheme(root.getAttribute("data-theme") === "dark" ? "light" : "dark", true);
    });
  }

  if (window.matchMedia) {
    var media = window.matchMedia("(prefers-color-scheme: dark)");
    var onChange = function (e) {
      if (!readStored()) setTheme(e.matches ? "dark" : "light", false);
    };
    if (media.addEventListener) media.addEventListener("change", onChange);
    else if (media.addListener) media.addListener(onChange);
  }

  function legacyCopy(text) {
    var ta = document.createElement("textarea");
    ta.value = text;
    ta.setAttribute("readonly", "");
    ta.style.position = "fixed";
    ta.style.top = "-1000px";
    ta.style.opacity = "0";
    document.body.appendChild(ta);
    var ok = false;
    try {
      ta.select();
      ta.setSelectionRange(0, ta.value.length);
      ok = document.execCommand("copy");
    } catch (e) {
      ok = false;
    }
    document.body.removeChild(ta);
    return ok;
  }

  function copyText(text) {
    if (navigator.clipboard && window.isSecureContext) {
      return navigator.clipboard.writeText(text).then(
        function () {
          return true;
        },
        function () {
          return legacyCopy(text);
        }
      );
    }
    return Promise.resolve(legacyCopy(text));
  }

  function flash(btn, label) {
    if (!btn) return;
    if (!btn.__label) btn.__label = btn.innerHTML;
    btn.textContent = label || "已复制";
    clearTimeout(btn.__flashTimer);
    btn.__flashTimer = setTimeout(function () {
      btn.innerHTML = btn.__label;
    }, 1400);
  }

  function setStatus(el, text, type) {
    if (!el) return;
    el.textContent = text || "";
    el.classList.remove("error", "ok");
    if (type === "error" || type === "ok") el.classList.add(type);
  }

  function download(filename, data, mime) {
    var blob = data instanceof Blob ? data : new Blob([data], { type: mime || "text/plain;charset=utf-8" });
    var url = URL.createObjectURL(blob);
    var a = document.createElement("a");
    a.href = url;
    a.download = filename;
    a.rel = "noopener";
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(function () {
      URL.revokeObjectURL(url);
    }, 1000);
  }

  function bytes(n) {
    if (!isFinite(n) || n < 0) return "-";
    var units = ["B", "KB", "MB", "GB"];
    var i = 0;
    while (n >= 1024 && i < units.length - 1) {
      n /= 1024;
      i++;
    }
    return (i === 0 ? n : n.toFixed(n >= 100 ? 0 : 1)) + " " + units[i];
  }

  function debounce(fn, wait) {
    var t;
    return function () {
      var args = arguments;
      var ctx = this;
      clearTimeout(t);
      t = setTimeout(function () {
        fn.apply(ctx, args);
      }, wait);
    };
  }

  window.PHT = {
    $: function (sel, scope) {
      return (scope || document).querySelector(sel);
    },
    $$: function (sel, scope) {
      return Array.prototype.slice.call((scope || document).querySelectorAll(sel));
    },
    copy: copyText,
    flash: flash,
    status: setStatus,
    download: download,
    bytes: bytes,
    debounce: debounce,
    setTheme: setTheme
  };
})();

<script>
(function () {
  "use strict";
  var $ = PHT.$;
  var input = $("#b64Input");
  var output = $("#b64Output");
  var statusEl = $("#status");
  var urlSafeBox = $("#urlSafe");

  var fileInput = $("#fileInput");
  var dropZone = $("#dropZone");
  var fileInfo = $("#fileInfo");
  var fileOut = $("#b64FileOutput");
  var fileStatus = $("#fileStatus");
  var currentFile = null;
  var currentB64 = "";
  var currentMime = "";

  function bytesToBase64(bytes) {
    var bin = "";
    var chunk = 0x8000;
    for (var i = 0; i < bytes.length; i += chunk) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + chunk));
    }
    return btoa(bin);
  }

  function base64ToBytes(b64) {
    var bin = atob(b64);
    var bytes = new Uint8Array(bin.length);
    for (var i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
    return bytes;
  }

  function encode() {
    if (!input.value) {
      PHT.status(statusEl, "请输入要编码的内容", "error");
      output.value = "";
      return;
    }
    var bytes = new TextEncoder().encode(input.value);
    var b64 = bytesToBase64(bytes);
    if (urlSafeBox.checked) b64 = b64.replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");
    output.value = b64;
    PHT.status(statusEl, "编码完成：" + input.value.length + " 个字符 → " + b64.length + " 个字符", "ok");
  }

  function normalizeBase64(raw) {
    var s = raw.replace(/\s+/g, "");
    if (!s) throw new Error("内容为空");
    s = s.replace(/-/g, "+").replace(/_/g, "/");
    if (!/^[A-Za-z0-9+/]*={0,2}$/.test(s)) {
      throw new Error("包含非 Base64 字符，请检查内容");
    }
    var pad = s.length % 4;
    if (pad === 1) throw new Error("Base64 长度不合法（余 1 个字符）");
    if (pad > 0) s += "=".repeat(4 - pad);
    return s;
  }

  function decode() {
    var raw = input.value;
    if (!raw.trim()) {
      PHT.status(statusEl, "请输入要解码的 Base64", "error");
      output.value = "";
      return;
    }
    try {
      var bytes = base64ToBytes(normalizeBase64(raw));
      var text;
      try {
        text = new TextDecoder("utf-8", { fatal: true }).decode(bytes);
      } catch (e) {
        text = new TextDecoder("latin1").decode(bytes);
        output.value = text;
        PHT.status(statusEl, "解码成功，但内容不是合法的 UTF-8 文本，已按 Latin-1 显示", "error");
        return;
      }
      output.value = text;
      PHT.status(statusEl, "解码完成：" + bytes.length + " 字节 → " + Array.from(text).length + " 个字符", "ok");
    } catch (e) {
      output.value = "";
      PHT.status(statusEl, "解码失败：" + e.message, "error");
    }
  }

  $("#encodeBtn").addEventListener("click", encode);
  $("#decodeBtn").addEventListener("click", decode);

  $("#swapBtn").addEventListener("click", function () {
    var tmp = input.value;
    input.value = output.value;
    output.value = tmp;
    PHT.status(statusEl, "已交换输入与输出");
    input.focus();
  });

  $("#copyBtn").addEventListener("click", function () {
    if (!output.value) {
      PHT.status(statusEl, "没有可复制的内容", "error");
      return;
    }
    PHT.copy(output.value).then(function (ok) {
      if (ok) PHT.flash($("#copyBtn"), "已复制");
      PHT.status(statusEl, ok ? "结果已复制" : "复制失败，请手动选择", ok ? "ok" : "error");
    });
  });

  $("#downloadBtn").addEventListener("click", function () {
    if (!output.value) {
      PHT.status(statusEl, "没有可下载的内容", "error");
      return;
    }
    PHT.download("base64.txt", output.value, "text/plain;charset=utf-8");
  });

  $("#clearBtn").addEventListener("click", function () {
    input.value = "";
    output.value = "";
    PHT.status(statusEl, "");
    input.focus();
  });

  // 模式切换
  var tabs = $("#tabs");
  var textPanel = $("#textPanel");
  var filePanel = $("#filePanel");
  function setTab(mode) {
    textPanel.hidden = mode !== "text";
    filePanel.hidden = mode !== "file";
  }
  tabs.addEventListener("change", function (e) {
    if (e.target.name === "tab") setTab(e.target.value);
  });

  // 文件处理
  function readFile(file) {
    if (!file) return;
    currentFile = file;
    currentMime = file.type || "application/octet-stream";
    fileInfo.hidden = false;
    fileInfo.innerHTML = "";
    var nameSpan = document.createElement("span");
    nameSpan.innerHTML = "文件：<code></code>";
    nameSpan.querySelector("code").textContent = file.name;
    var sizeSpan = document.createElement("span");
    sizeSpan.textContent = "大小：" + PHT.bytes(file.size);
    var typeSpan = document.createElement("span");
    typeSpan.textContent = "类型：" + currentMime;
    fileInfo.appendChild(nameSpan);
    fileInfo.appendChild(sizeSpan);
    fileInfo.appendChild(typeSpan);

    PHT.status(fileStatus, "正在读取文件…");
    var reader = new FileReader();
    reader.onerror = function () {
      PHT.status(fileStatus, "读取文件失败，请重试", "error");
    };
    reader.onload = function () {
      try {
        var bytes = new Uint8Array(reader.result);
        currentB64 = bytesToBase64(bytes);
        fileOut.value = currentB64;
        $("#copyB64").disabled = false;
        $("#copyDataUrl").disabled = false;
        $("#downloadB64").disabled = false;
        var ratio = file.size ? Math.round((currentB64.length / file.size) * 100) : 0;
        PHT.status(fileStatus, "转换完成：Base64 长度 " + currentB64.length + " 字符（约为原文件的 " + ratio + "%）", "ok");
      } catch (e) {
        PHT.status(fileStatus, "转换失败：" + e.message, "error");
      }
    };
    reader.readAsArrayBuffer(file);
  }

  fileInput.addEventListener("change", function () {
    readFile(fileInput.files && fileInput.files[0]);
  });

  ["dragenter", "dragover"].forEach(function (evt) {
    dropZone.addEventListener(evt, function (e) {
      e.preventDefault();
      dropZone.classList.add("is-over");
    });
  });
  ["dragleave", "drop"].forEach(function (evt) {
    dropZone.addEventListener(evt, function (e) {
      e.preventDefault();
      dropZone.classList.remove("is-over");
    });
  });
  dropZone.addEventListener("drop", function (e) {
    var files = e.dataTransfer && e.dataTransfer.files;
    if (files && files.length) readFile(files[0]);
  });

  $("#copyB64").addEventListener("click", function () {
    if (!currentB64) return;
    PHT.copy(currentB64).then(function (ok) {
      if (ok) PHT.flash($("#copyB64"), "已复制");
      PHT.status(fileStatus, ok ? "Base64 已复制" : "复制失败，请手动选择", ok ? "ok" : "error");
    });
  });

  $("#copyDataUrl").addEventListener("click", function () {
    if (!currentB64) return;
    var url = "data:" + currentMime + ";base64," + currentB64;
    PHT.copy(url).then(function (ok) {
      if (ok) PHT.flash($("#copyDataUrl"), "已复制");
      PHT.status(fileStatus, ok ? "Data URL 已复制（" + PHT.bytes(url.length) + "）" : "复制失败，请手动选择", ok ? "ok" : "error");
    });
  });

  $("#downloadB64").addEventListener("click", function () {
    if (!currentB64) return;
    var base = currentFile ? currentFile.name.replace(/\.[^.]+$/, "") : "file";
    PHT.download(base + ".base64.txt", currentB64, "text/plain;charset=utf-8");
  });

  input.focus();
})();
</script>
</body>
</html>
