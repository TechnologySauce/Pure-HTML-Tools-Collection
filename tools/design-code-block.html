<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>代码块 - 纯 HTML 工具箱</title>
<meta name="description" content="生成深色背景等宽字体代码块样式。">
<meta name="theme-color" content="#f6f5f1">
<link rel="icon" href="../assets/favicon.svg" type="image/svg+xml">
<script type="application/json" id="tool-meta">{"title":"代码块","desc":"生成深色背景等宽字体代码块样式。","category":"design","tags":["代码","CSS","设计"],"order":1322}</script>
<script>try{var t=localStorage.getItem("pht-theme");if(t!=="light"&&t!=="dark"){t=window.matchMedia&&window.matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light"}document.documentElement.setAttribute("data-theme",t)}catch(e){document.documentElement.setAttribute("data-theme","light")}</script>
<style data-inline="assets/tool-base.css"></style>
<style></style>
</head>
<body>
<header class="toolbar">
  <div class="toolbar-inner">
    <a class="brand" href="../index.html"><img src="../assets/favicon.svg" alt="" width="24" height="24"><span>纯 HTML 工具箱</span></a>
    <span class="spacer"></span>
    <a class="btn ghost" href="../index.html">返回首页</a>
    <button class="icon-btn" type="button" data-theme-toggle aria-label="切换深色主题" aria-pressed="false"><svg class="i-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"></circle><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M19.1 4.9l-1.4 1.4M6.3 17.7l-1.4 1.4"></path></svg><svg class="i-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 14.5A8.5 8.5 0 0 1 9.5 4 8.5 8.5 0 1 0 20 14.5Z"></path></svg></button>
  </div>
</header>

<main class="shell">
  <div class="page-head">
    <span class="badge">设计 · 本地处理</span>
    <h1>代码块</h1>
    <p>生成深色背景等宽字体代码块样式。</p>
  </div>

  <section class="panel">
<div class="grid-2">
  <div class="field"><label for="bg">背景色</label><input type="text" id="bg" value="#1e1e2e"></div>
  <div class="field"><label for="fg">文字色</label><input type="text" id="fg" value="#cdd6f4"></div>
</div>
<div class="field" style="margin-top:14px"><label for="css">生成的 CSS</label><textarea id="css" class="code" readonly spellcheck="false" placeholder="CSS"></textarea></div>
<div class="actions">
  <button class="btn primary" id="copy" type="button">复制 CSS</button>
</div>
<p class="status" id="status" aria-live="polite"></p>
  </section>

  <footer class="foot">
    <span>所有处理都在浏览器本地完成，数据不会上传。</span>
    <a href="../index.html">返回全部工具</a>
  </footer>
</main>

<script data-inline="assets/tool-base.js"></script>
<script>
(function(){
  var $=PHT.$; var statusEl=$("#status"); var cssBox=$("#css");
  function build(args){  return "font-family:ui-monospace,Menlo,Consolas,monospace;padding:14px 16px;background:" + args.bg + ";color:" + args.fg + ";border-radius:8px;font-size:13px;";  }
  function run(){ var args={};
    args["bg"]=$("#bg").value;
    args["fg"]=$("#fg").value;
    try { var c=build(args); cssBox.value=c; PHT.status(statusEl,"已生成","ok"); } catch(e){ PHT.status(statusEl,"出错了："+e.message,"error"); }
  }
  ["bg","fg"].forEach(function(k){ $("#"+k).addEventListener("input",run); $("#"+k).addEventListener("change",run); });
  $("#copy").addEventListener("click",function(){ if(!cssBox.value){ PHT.status(statusEl,"没有内容","error"); return; } PHT.copy(cssBox.value).then(function(ok){ PHT.flash($("#copy"),"已复制"); PHT.status(statusEl,ok?"已复制":"复制失败",ok?"ok":"error"); }); });
  run();
})();
</script>
</body>
</html>
