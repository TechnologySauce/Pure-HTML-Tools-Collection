<script>
(function(){
  var $=PHT.$; var statusEl=$("#status");
  function fnum(n){ if(n===null||n===undefined||!isFinite(n)) return "—"; var a=Math.round(n*1e6)/1e6; return a.toLocaleString("zh-CN",{maximumFractionDigits:6}); }
  var compute = function compute(args){  var m0 = Math.max(1, Math.floor(a.m)), a0 = ((Math.floor(a.a)) % m0 + m0) % m0, t = 0, nt = 1, r = m0, nr = a0; while (nr !== 0) { var q = Math.floor(r / nr); var tmp = nt; nt = t - q * nt; t = tmp; tmp = nr; nr = r - q * nr; r = tmp; } if (r > 1) return { res: "不存在逆元" }; if (t < 0) t += m0; return { res: t };  };
  function run(){ var args={};
    args["a"]=parseFloat($("#a").value);
    args["m"]=parseFloat($("#m").value);
    try { var r=compute(args);
    if(r&&r["res"]!==undefined){ var v=r["res"]; $("#res").textContent=(typeof v==="number")?fnum(v):v; }
      PHT.status(statusEl,(r&&r.__msg)||"计算完成",(r&&r.__type)||"ok"); } catch(e){ PHT.status(statusEl,"出错了："+e.message,"error"); }
  }
  ["a","m"].forEach(function(k){ $("#"+k).addEventListener("input",run); $("#"+k).addEventListener("change",run); });
  run();
})();
