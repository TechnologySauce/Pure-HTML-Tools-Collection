<main class="shell">
  <div class="page-head">
    <span class="badge">计算 · 本地处理</span>
    <h1>几何平均收益率</h1>
    <p>由连续若干年的年化收益率求复合几何平均。</p>
  </div>

  <section class="panel">
<div class="grid-2">
  <div class="field"><label for="r1">第1年 (%)</label><input type="number" id="r1" value="10"></div>
  <div class="field"><label for="r2">第2年 (%)</label><input type="number" id="r2" value="-5"></div>
  <div class="field"><label for="r3">第3年 (%)</label><input type="number" id="r3" value="15"></div>
</div>
<dl class="stat-row" style="margin-top:16px">
  <div class="stat"><dt>几何平均 (%)</dt><dd id="g">—</dd></div>
</dl>
<p class="status" id="status" aria-live="polite"></p>
  </section>

  <footer class="foot">
    <span>所有处理都在浏览器本地完成，数据不会上传。</span>
    <a href="../index.html">返回全部工具</a>
  </footer>
</main>

<script data-inline="assets/tool-base.js"></script>
<script>
(function(){
  var $=PHT.$; var statusEl=$("#status");
  function fnum(n){ if(n===null||n===undefined||!isFinite(n)) return "—"; var a=Math.round(n*1e6)/1e6; return a.toLocaleString("zh-CN",{maximumFractionDigits:6}); }
  var compute = function compute(args){  return { g: (Math.pow((1 + a.r1 / 100) * (1 + a.r2 / 100) * (1 + a.r3 / 100), 1 / 3) - 1) * 100 };  };
  function run(){ var args={};
    args["r1"]=parseFloat($("#r1").value);
    args["r2"]=parseFloat($("#r2").value);
    args["r3"]=parseFloat($("#r3").value);
    try { var r=compute(args);
    if(r&&r["g"]!==undefined){ var v=r["g"]; $("#g").textContent=(typeof v==="number")?fnum(v):v; }
      PHT.status(statusEl,(r&&r.__msg)||"计算完成",(r&&r.__type)||"ok"); } catch(e){ PHT.status(statusEl,"出错了："+e.message,"error"); }
  }
  ["r1","r2","r3"].forEach(function(k){ $("#"+k).addEventListener("input",run); $("#"+k).addEventListener("change",run); });
  run();
})();
</script>
