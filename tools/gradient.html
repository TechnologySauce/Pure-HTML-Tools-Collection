html[data-theme="dark"] {

.drop.is-over {

@media (prefers-reduced-motion: reduce) {

    transition: none !important;

/* inline:assets/tool-base.js:start */
/* 工具页公共脚本：构建时内联进每个工具 */
(function () {
  "use strict";

  var root = document.documentElement;
  var KEY = "pht-theme";

  function readStored() {
    try {
      var v = localStorage.getItem(KEY);
      return v === "light" || v === "dark" ? v : null;
    } catch (e) {
      return null;
    }
  }

  function setTheme(theme, persist) {
    root.setAttribute("data-theme", theme);
    var btn = document.querySelector("[data-theme-toggle]");
    if (btn) {
      btn.setAttribute("aria-pressed", theme === "dark" ? "true" : "false");
      btn.setAttribute("aria-label", theme === "dark" ? "切换到浅色主题" : "切换到深色主题");
      btn.setAttribute("title", theme === "dark" ? "切换到浅色主题" : "切换到深色主题");
    }
    if (persist) {
      try {
        localStorage.setItem(KEY, theme);
      } catch (e) {
        /* 忽略私有模式写入失败 */
      }
    }
  }

  setTheme(root.getAttribute("data-theme") === "dark" ? "dark" : "light", false);

  var toggle = document.querySelector("[data-theme-toggle]");
  if (toggle) {
    toggle.addEventListener("click", function () {
      setTheme(root.getAttribute("data-theme") === "dark" ? "light" : "dark", true);
    });
  }

  if (window.matchMedia) {
    var media = window.matchMedia("(prefers-color-scheme: dark)");
    var onChange = function (e) {
      if (!readStored()) setTheme(e.matches ? "dark" : "light", false);
    };
    if (media.addEventListener) media.addEventListener("change", onChange);
    else if (media.addListener) media.addListener(onChange);
  }

  function legacyCopy(text) {
    var ta = document.createElement("textarea");
    ta.value = text;
    ta.setAttribute("readonly", "");
    ta.style.position = "fixed";
    ta.style.top = "-1000px";
    ta.style.opacity = "0";
    document.body.appendChild(ta);
    var ok = false;
    try {
      ta.select();
      ta.setSelectionRange(0, ta.value.length);
      ok = document.execCommand("copy");
    } catch (e) {
      ok = false;
    }
    document.body.removeChild(ta);
    return ok;
  }

  function copyText(text) {
    if (navigator.clipboard && window.isSecureContext) {
      return navigator.clipboard.writeText(text).then(
        function () {
          return true;
        },
        function () {
          return legacyCopy(text);
        }
      );
    }
    return Promise.resolve(legacyCopy(text));
  }

  function flash(btn, label) {
    if (!btn) return;
    if (!btn.__label) btn.__label = btn.innerHTML;
    btn.textContent = label || "已复制";
    clearTimeout(btn.__flashTimer);
    btn.__flashTimer = setTimeout(function () {
      btn.innerHTML = btn.__label;
    }, 1400);
  }

  function setStatus(el, text, type) {
    if (!el) return;
    el.textContent = text || "";
    el.classList.remove("error", "ok");
    if (type === "error" || type === "ok") el.classList.add(type);
  }

  function download(filename, data, mime) {
    var blob = data instanceof Blob ? data : new Blob([data], { type: mime || "text/plain;charset=utf-8" });
    var url = URL.createObjectURL(blob);
    var a = document.createElement("a");
    a.href = url;
    a.download = filename;
    a.rel = "noopener";
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(function () {
      URL.revokeObjectURL(url);
    }, 1000);
  }

  function bytes(n) {
    if (!isFinite(n) || n < 0) return "-";
    var units = ["B", "KB", "MB", "GB"];
    var i = 0;
    while (n >= 1024 && i < units.length - 1) {
      n /= 1024;
      i++;
    }
    return (i === 0 ? n : n.toFixed(n >= 100 ? 0 : 1)) + " " + units[i];
  }

  function debounce(fn, wait) {
    var t;
    return function () {
      var args = arguments;
      var ctx = this;
      clearTimeout(t);
      t = setTimeout(function () {
        fn.apply(ctx, args);
      }, wait);
    };
  }

  window.PHT = {
    $: function (sel, scope) {
      return (scope || document).querySelector(sel);
    },
    $$: function (sel, scope) {
      return Array.prototype.slice.call((scope || document).querySelectorAll(sel));
    },
    copy: copyText,
    flash: flash,
    status: setStatus,
    download: download,
    bytes: bytes,
    debounce: debounce,
    setTheme: setTheme
  };
})();
/* inline:assets/tool-base.js:end */
</script>
<script>
(function () {
  "use strict";
  var $ = PHT.$;
  var preview = $("#preview");
  var stopsWrap = $("#stops");
  var cssCode = $("#cssCode");
  var statusEl = $("#status");
  var angleRange = $("#angleRange");
  var angleNum = $("#angleNum");
  var stops = ["#0f766e", "#2dd4bf"];
  var type = "linear";

  function value() {
    var angle = Number(angleRange.value) || 0;
    var parts = stops.map(function (color, i) {
      var pct = stops.length === 1 ? 0 : Math.round((i / (stops.length - 1)) * 100);
      return color + " " + pct + "%";
    });
    var body = parts.join(", ");
    if (type === "radial") return "radial-gradient(circle at 50% 50%, " + body + ")";
    if (type === "conic") return "conic-gradient(from " + angle + "deg at 50% 50%, " + body + ")";
    return "linear-gradient(" + angle + "deg, " + body + ")";
  }

  function renderStops() {
    stopsWrap.textContent = "";
    stops.forEach(function (color, i) {
      var row = document.createElement("div");
      row.className = "stop-row";

      var idx = document.createElement("span");
      idx.className = "idx";
      idx.textContent = String(i + 1);

      var picker = document.createElement("input");
      picker.type = "color";
      picker.value = color;
      picker.setAttribute("aria-label", "第 " + (i + 1) + " 个颜色");
      picker.addEventListener("input", function () {
        stops[i] = picker.value;
        hexLabel.textContent = picker.value;
        update();
      });

      var hexLabel = document.createElement("span");
      hexLabel.className = "hex";
      hexLabel.textContent = color;

      var pct = document.createElement("span");
      pct.className = "percent";
      pct.textContent = stops.length === 1 ? "0%" : Math.round((i / (stops.length - 1)) * 100) + "%";

      row.appendChild(idx);
      row.appendChild(picker);
      row.appendChild(hexLabel);
      row.appendChild(pct);
      stopsWrap.appendChild(row);
    });
    $("#removeStop").disabled = stops.length <= 2;
    $("#addStop").disabled = stops.length >= 5;
  }

  function update() {
    var css = "background: " + value() + ";";
    preview.style.background = value();
    cssCode.value = css;
    $("#angleNum").value = String(Number(angleRange.value) || 0);
    // 重新渲染百分比标签
    PHT.$$(".percent", stopsWrap).forEach(function (el, i) {
      el.textContent = stops.length === 1 ? "0%" : Math.round((i / (stops.length - 1)) * 100) + "%";
    });
    PHT.status(statusEl, "已更新渐变：" + stops.length + " 个颜色节点", "ok");
  }

  $("#typeGroup").addEventListener("change", function (e) {
    if (e.target.name === "gtype") {
      type = e.target.value;
      update();
    }
  });

  angleRange.addEventListener("input", update);
  angleNum.addEventListener("input", function () {
    var v = Number(angleNum.value);
    if (!isFinite(v)) return;
    v = Math.min(360, Math.max(0, v));
    angleRange.value = String(v);
    update();
  });
  angleNum.addEventListener("blur", function () {
    angleNum.value = angleRange.value;
  });

  $("#addStop").addEventListener("click", function () {
    if (stops.length >= 5) return;
    stops.push(randomColor());
    renderStops();
    update();
  });

  $("#removeStop").addEventListener("click", function () {
    if (stops.length <= 2) return;
    stops.pop();
    renderStops();
    update();
  });

  function randomColor() {
    // type=color 只接受 #rrggbb，故生成十六进制色值
    var bytes = new Uint8Array(3);
    if (window.crypto && window.crypto.getRandomValues) window.crypto.getRandomValues(bytes);
    else for (var i = 0; i < 3; i++) bytes[i] = Math.floor(Math.random() * 256);
    return "#" + Array.prototype.map.call(bytes, function (b) { return b.toString(16).padStart(2, "0"); }).join("");
  }

  $("#presets").addEventListener("click", function (e) {
    var btn = e.target.closest("button[data-colors]");
    if (!btn) return;
    stops = btn.getAttribute("data-colors").split(",").map(function (s) { return s.trim(); }).filter(Boolean).slice(0, 5);
    if (stops.length < 2) stops = ["#0f766e", "#2dd4bf"];
    angleRange.value = btn.getAttribute("data-angle") || "135";
    angleNum.value = angleRange.value;
    renderStops();
    update();
  });

  $("#copyCss").addEventListener("click", function () {
    PHT.copy(cssCode.value).then(function (ok) {
      if (ok) PHT.flash($("#copyCss"), "已复制");
      PHT.status(statusEl, ok ? "CSS 已复制" : "复制失败，请手动选择", ok ? "ok" : "error");
    });
  });

  $("#copyBg").addEventListener("click", function () {
    PHT.copy(value()).then(function (ok) {
      if (ok) PHT.flash($("#copyBg"), "已复制");
      PHT.status(statusEl, ok ? "渐变值已复制" : "复制失败，请手动选择", ok ? "ok" : "error");
    });
  });

  renderStops();
  update();
})();
</script>
</body>
</html>
