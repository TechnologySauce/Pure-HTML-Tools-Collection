<div class="field"><label>颜色名称或十六进制</label><input id="inp" type="text" placeholder="例如 red 或 #FF0000"></div><div class="field"><label>结果</label><pre id="out"></pre></div>

<script data-inline="assets/tool-base.js"></script>
<script>
(function(){var $=PHT.$;var inp=$("#inp"),out=$("#out");var NAMES={red:"#FF0000",green:"#008000",blue:"#0000FF",white:"#FFFFFF",black:"#000000",yellow:"#FFFF00",orange:"#FFA500",pink:"#FFC0CB",purple:"#800080",gray:"#808080",grey:"#808080",cyan:"#00FFFF",magenta:"#FF00FF",lime:"#00FF00",teal:"#008080",navy:"#000080",aqua:"#00FFFF",olive:"#808000",maroon:"#800000",silver:"#C0C0C0",gold:"#FFD700",coral:"#FF7F50",salmon:"#FA8072",khaki:"#F0E68C",indigo:"#4B0082",violet:"#EE82EE",tomato:"#FF6347",crimson:"#DC143C",chocolate:"#D2691E",turquoise:"#40E0D0",lavender:"#E6E6FA",skyblue:"#87CEEB",royalblue:"#4169E1",steelblue:"#4682B4",forestgreen:"#228B22",seagreen:"#2E8B57",hotpink:"#FF69B4",deeppink:"#FF1493",slateblue:"#6A5ACD",darkred:"#8B0000",darkgreen:"#006400",darkblue:"#00008B",lightgray:"#D3D3D3",lightblue:"#ADD8E6",lightgreen:"#90EE90",lightcoral:"#F08080",lightpink:"#FFB6C1",lightyellow:"#FFFFE0",darkgray:"#A9A9A9",dimgray:"#696969",firebrick:"#B22222",indianred:"#CD5C5C",mediumblue:"#0000CD",midnightblue:"#191970",powderblue:"#B0E0E6",springgreen:"#00FF7F",lawngreen:"#7CFC00",orchid:"#DA70D6",plum:"#DDA0DD",tan:"#D2B48C",brown:"#A52A2A",beige:"#F5F5DC",ivory:"#FFFFF0",snow:"#FFFAFA",azure:"#F0FFFF",linen:"#FAF0E6",mintcream:"#F5FFFA"};var HEX2={};for(var k in NAMES)HEX2[NAMES[k].toUpperCase()]=k;function rgb(h){h=h.replace("#","");return "rgb("+parseInt(h.substr(0,2),16)+", "+parseInt(h.substr(2,2),16)+", "+parseInt(h.substr(4,2),16)+")";}function run(){var v=inp.value.trim().toLowerCase();if(!v){out.textContent="";return;}if(NAMES[v]){var hex=NAMES[v];out.textContent="名称: "+v+"\nHEX: "+hex+"\nRGB: "+rgb(hex);return;}var m=v.match(/^#?([0-9a-f]{6})$/i);if(m){var up="#"+m[1].toUpperCase();if(HEX2[up])out.textContent="HEX: "+up+"\n名称: "+HEX2[up]+"\nRGB: "+rgb(up);else out.textContent="HEX: "+up+"\n未找到对应名称\nRGB: "+rgb(up);return;}out.textContent="未知颜色名称或格式";}inp.addEventListener("input",run);run();})();
</script>
