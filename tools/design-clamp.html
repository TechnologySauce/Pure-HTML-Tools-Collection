<div class="field"><label>最小字号 (px)</label><input id="minf" type="number" value="16"><label>最大字号 (px)</label><input id="maxf" type="number" value="32"><label>最小视口 (px)</label><input id="minv" type="number" value="320"><label>最大视口 (px)</label><input id="maxv" type="number" value="1200"></div><div class="field"><button id="go" class="btn">生成</button> <button id="cp" class="btn ghost">复制</button></div><div class="field"><label>CSS</label><pre id="out"></pre></div>

<script>
(function(){var $=PHT.$;var minf=$("#minf"),maxf=$("#maxf"),minv=$("#minv"),maxv=$("#maxv"),out=$("#out"),go=$("#go"),cp=$("#cp");function run(){var mn=parseFloat(minf.value),mx=parseFloat(maxf.value),vw1=parseFloat(minv.value),vw2=parseFloat(maxv.value);if(vw2<=vw1){out.textContent="最大视口需大于最小视口";return;}var slope=(mx-mn)/(vw2-vw1);var yint=mn-slope*vw1;out.textContent="font-size: clamp("+mn+"px, "+yint.toFixed(4)+"px + "+(slope*100).toFixed(4)+"vw, "+mx+"px);";}go.addEventListener("click",run);[minf,maxf,minv,maxv].forEach(function(el){el.addEventListener("input",run);});cp.addEventListener("click",function(){PHT.copy(out.textContent).then(function(){PHT.flash(cp,"已复制");});});run();})();
</script>
