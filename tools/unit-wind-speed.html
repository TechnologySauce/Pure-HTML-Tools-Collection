<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>风速换算 - 纯 HTML 工具箱</title>
<meta name="description" content="在米/秒、千米/时、英里/时、节与蒲福风级之间换算。">
<meta name="theme-color" content="#f6f5f1">
<link rel="icon" href="../assets/favicon.svg" type="image/svg+xml">
<script type="application/json" id="tool-meta">{"title":"风速换算","desc":"在米/秒、千米/时、英里/时、节与蒲福风级之间换算。","category":"calc","tags":["风速","蒲福","换算"],"order":2444}</script>
<script>try{var t=localStorage.getItem("pht-theme");if(t!=="light"&&t!=="dark"){t=window.matchMedia&&window.matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light"}document.documentElement.setAttribute("data-theme",t)}catch(e){document.documentElement.setAttribute("data-theme","light")}</script>
<style data-inline="assets/tool-base.css"></style>
<style></style>
</head>
<body>
<header class="toolbar">
  <div class="toolbar-inner">
    <a class="brand" href="../index.html"><img src="../assets/favicon.svg" alt="" width="24" height="24"><span>纯 HTML 工具箱</span></a>
    <span class="spacer"></span>
    <a class="btn ghost" href="../index.html">返回首页</a>
    <button class="icon-btn" type="button" data-theme-toggle aria-label="切换深色主题" aria-pressed="false"><svg class="i-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"></circle><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M19.1 4.9l-1.4 1.4M6.3 17.7l-1.4 1.4"></path></svg><svg class="i-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 14.5A8.5 8.5 0 0 1 9.5 4 8.5 8.5 0 1 0 20 14.5Z"></path></svg></button>
  </div>
</header>

<main class="shell">
  <div class="page-head">
    <span class="badge">计算 · 本地处理</span>
    <h1>风速换算</h1>
    <p>在米/秒、千米/时、英里/时、节与蒲福风级之间换算。</p>
  </div>

  <section class="panel">
<div class="grid-2">
  <div class="field"><label for="value">数值</label><input type="number" id="value" value="1" step="any"></div>
  <div class="field"><label for="from">从单位</label><select id="from"><option value="0">米/秒</option><option value="1">千米/时</option><option value="2">英里/时</option><option value="3">节</option><option value="4">蒲福级</option></select></div>
  <div class="field"><label for="to">到单位</label><select id="to"><option value="0">米/秒</option><option value="1">千米/时</option><option value="2">英里/时</option><option value="3">节</option><option value="4">蒲福级</option></select></div>
  <div class="field"><button class="btn" type="button" id="swap">交换单位</button></div>
</div>
<dl class="stat-row" style="margin-top:16px"><div class="stat"><dt>换算结果</dt><dd id="out">—</dd></div></dl>
<p class="status" id="status" aria-live="polite"></p>
  </section>

  <footer class="foot">
    <span>所有处理都在浏览器本地完成，数据不会上传。</span>
    <a href="../index.html">返回全部工具</a>
  </footer>
</main>

<script data-inline="assets/tool-base.js"></script>
<script>
(function(){ var $=PHT.$; var statusEl=$("#status"); var N=["米/秒","千米/时","英里/时","节","蒲福级"];
  function conv(v,a,b){ 
    var lo = [0, 0.3, 1.6, 3.4, 5.5, 8.0, 10.8, 13.9, 17.2, 20.8, 24.5, 28.5, 32.7];
    function toMS(u, x) { if (u === "米/秒") return x; if (u === "千米/时") return x / 3.6; if (u === "英里/时") return x * 0.44704; if (u === "节") return x * 0.514444; return lo[Math.max(0, Math.min(12, x))]; }
    function fromMS(u, s) { if (u === "米/秒") return s; if (u === "千米/时") return s * 3.6; if (u === "英里/时") return s / 0.44704; if (u === "节") return s / 0.514444; var bb = 0; for (var i = 1; i < lo.length; i++) { if (s >= lo[i]) bb = i; else break; } return bb; }
    return fromMS(b, toMS(a, v));
   }
  function run(){ var v=parseFloat($("#value").value); var fi=parseInt($("#from").value,10), ti=parseInt($("#to").value,10); if(!(v>=0)){ PHT.status(statusEl,"请输入有效数值"); return; } var res=conv(v,N[fi],N[ti]); $("#out").textContent=(Math.round(res*1e6)/1e6).toLocaleString("zh-CN",{maximumFractionDigits:6})+" "+N[ti]; PHT.status(statusEl,"换算完成","ok"); }
  $("#swap").addEventListener("click",function(){ var f=$("#from").value; $("#from").value=$("#to").value; $("#to").value=f; run(); });
  ["value","from","to"].forEach(function(k){ $("#"+k).addEventListener("input",run); $("#"+k).addEventListener("change",run); }); run();
})();
</script>
</body>
</html>
