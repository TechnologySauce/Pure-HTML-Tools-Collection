<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>回归预测 - 纯 HTML 工具箱</title>
<meta name="description" content="用拟合直线与给定 X 预测 Y 值。">
<meta name="theme-color" content="#f6f5f1">
<link rel="icon" href="../assets/favicon.svg" type="image/svg+xml">
<script type="application/json" id="tool-meta">{"title":"回归预测","desc":"用拟合直线与给定 X 预测 Y 值。","category":"text","tags":["回归","预测","统计"],"order":3912}</script>
<script>try{var t=localStorage.getItem("pht-theme");if(t!=="light"&&t!=="dark"){t=window.matchMedia&&window.matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light"}document.documentElement.setAttribute("data-theme",t)}catch(e){document.documentElement.setAttribute("data-theme","light")}</script>
<style data-inline="assets/tool-base.css"></style>
<style></style>
</head>
<body>
<header class="toolbar">
  <div class="toolbar-inner">
    <a class="brand" href="../index.html"><img src="../assets/favicon.svg" alt="" width="24" height="24"><span>纯 HTML 工具箱</span></a>
    <span class="spacer"></span>
    <a class="btn ghost" href="../index.html">返回首页</a>
    <button class="icon-btn" type="button" data-theme-toggle aria-label="切换深色主题" aria-pressed="false"><svg class="i-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"></circle><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M19.1 4.9l-1.4 1.4M6.3 17.7l-1.4 1.4"></path></svg><svg class="i-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 14.5A8.5 8.5 0 0 1 9.5 4 8.5 8.5 0 1 0 20 14.5Z"></path></svg></button>
  </div>
</header>

<main class="shell">
  <div class="page-head">
    <span class="badge">文本处理 · 本地处理</span>
    <h1>回归预测</h1>
    <p>用拟合直线与给定 X 预测 Y 值。</p>
  </div>

  <section class="panel">
  <div class="field"><label for="text">X 数据</label><textarea id="text" class="code" spellcheck="false" rows="4"></textarea></div>
  <div class="field"><label for="text2">Y 数据</label><textarea id="text2" class="code" spellcheck="false" rows="4"></textarea></div>
  <div class="field"><label for="xv">预测 X</label><input type="text" id="xv" value="10"></div>
<div class="field" style="margin-top:14px"><label for="out">输出</label><textarea id="out" class="code" readonly spellcheck="false" placeholder="处理结果"></textarea></div>
<div class="actions">
  <button class="btn primary" id="copy" type="button">复制</button>
</div>
<p class="status" id="status" aria-live="polite"></p>
  </section>

  <footer class="foot">
    <span>所有处理都在浏览器本地完成，数据不会上传。</span>
    <a href="../index.html">返回全部工具</a>
  </footer>
</main>

<script data-inline="assets/tool-base.js"></script>
<script>
(function(){
  var $=PHT.$; var statusEl=$("#status"); var out=$("#out");
  function transform(args){
 var x = a.text.split(/[\s,;]+/).map(Number).filter(function (n) { return !isNaN(n); }); var y = a.text2.split(/[\s,;]+/).map(Number).filter(function (n) { return !isNaN(n); }); if (x.length !== y.length || x.length < 2) return "两组数量需相等且≥2"; var n = x.length, sx = 0, sy = 0, sxx = 0, sxy = 0; for (var i = 0; i < n; i++) { sx += x[i]; sy += y[i]; sxx += x[i] * x[i]; sxy += x[i] * y[i]; } var b = (n * sxy - sx * sy) / (n * sxx - sx * sx), a0 = (sy - b * sx) / n; return "预测 Y(" + a.xv + ") = " + (a0 + b * Number(a.xv)); 
  }
  function run(){ var args={};
    args["text"]=$("#text").value;
    args["text2"]=$("#text2").value;
    args["xv"]=$("#xv").value;
    try { out.value=transform(args); PHT.status(statusEl,"已处理","ok"); } catch(e){ PHT.status(statusEl,"出错了："+e.message,"error"); }
  }
  ["text","text2","xv"].forEach(function(k){ $("#"+k).addEventListener("input",run); $("#"+k).addEventListener("change",run); });
  $("#copy").addEventListener("click",function(){ if(!out.value){ PHT.status(statusEl,"没有内容","error"); return; } PHT.copy(out.value).then(function(ok){ PHT.flash($("#copy"),"已复制"); PHT.status(statusEl,ok?"已复制":"复制失败",ok?"ok":"error"); }); });
  run();
})();
</script>
</body>
</html>
