/* 工具页公共脚本：构建时内联进每个工具 */
(function () {
  "use strict";

  var root = document.documentElement;
  var KEY = "pht-theme";

  function readStored() {
    try {
      var v = localStorage.getItem(KEY);
      return v === "light" || v === "dark" ? v : null;
    } catch (e) {
      return null;
    }
  }

  function setTheme(theme, persist) {
    root.setAttribute("data-theme", theme);
    var btn = document.querySelector("[data-theme-toggle]");
    if (btn) {
      btn.setAttribute("aria-pressed", theme === "dark" ? "true" : "false");
      btn.setAttribute("aria-label", theme === "dark" ? "切换到浅色主题" : "切换到深色主题");
      btn.setAttribute("title", theme === "dark" ? "切换到浅色主题" : "切换到深色主题");
    }
    if (persist) {
      try {
        localStorage.setItem(KEY, theme);
      } catch (e) {
        /* 忽略私有模式写入失败 */
      }
    }
  }

  setTheme(root.getAttribute("data-theme") === "dark" ? "dark" : "light", false);

  var toggle = document.querySelector("[data-theme-toggle]");
  if (toggle) {
    toggle.addEventListener("click", function () {
      setTheme(root.getAttribute("data-theme") === "dark" ? "light" : "dark", true);
    });
  }

  if (window.matchMedia) {
    var media = window.matchMedia("(prefers-color-scheme: dark)");
    var onChange = function (e) {
      if (!readStored()) setTheme(e.matches ? "dark" : "light", false);
    };
    if (media.addEventListener) media.addEventListener("change", onChange);
    else if (media.addListener) media.addListener(onChange);
  }

  function legacyCopy(text) {
    var ta = document.createElement("textarea");
    ta.value = text;
    ta.setAttribute("readonly", "");
    ta.style.position = "fixed";
    ta.style.top = "-1000px";
    ta.style.opacity = "0";
    document.body.appendChild(ta);
    var ok = false;
    try {
      ta.select();
      ta.setSelectionRange(0, ta.value.length);
      ok = document.execCommand("copy");
    } catch (e) {
      ok = false;
    }
    document.body.removeChild(ta);
    return ok;
  }

  function copyText(text) {
    if (navigator.clipboard && window.isSecureContext) {
      return navigator.clipboard.writeText(text).then(
        function () {
          return true;
        },
        function () {
          return legacyCopy(text);
        }
      );
    }
    return Promise.resolve(legacyCopy(text));
  }

  function flash(btn, label) {
    if (!btn) return;
    if (!btn.__label) btn.__label = btn.innerHTML;
    btn.textContent = label || "已复制";
    clearTimeout(btn.__flashTimer);
    btn.__flashTimer = setTimeout(function () {
      btn.innerHTML = btn.__label;
    }, 1400);
  }

  function setStatus(el, text, type) {
    if (!el) return;
    el.textContent = text || "";
    el.classList.remove("error", "ok");
    if (type === "error" || type === "ok") el.classList.add(type);
  }

  function download(filename, data, mime) {
    var blob = data instanceof Blob ? data : new Blob([data], { type: mime || "text/plain;charset=utf-8" });
    var url = URL.createObjectURL(blob);
    var a = document.createElement("a");
    a.href = url;
    a.download = filename;
    a.rel = "noopener";
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(function () {
      URL.revokeObjectURL(url);
    }, 1000);
  }

  function bytes(n) {
    if (!isFinite(n) || n < 0) return "-";
    var units = ["B", "KB", "MB", "GB"];
    var i = 0;
    while (n >= 1024 && i < units.length - 1) {
      n /= 1024;
      i++;
    }
    return (i === 0 ? n : n.toFixed(n >= 100 ? 0 : 1)) + " " + units[i];
  }

  function debounce(fn, wait) {
    var t;
    return function () {
      var args = arguments;
      var ctx = this;
      clearTimeout(t);
      t = setTimeout(function () {
        fn.apply(ctx, args);
      }, wait);
    };
  }

  window.PHT = {
    $: function (sel, scope) {
      return (scope || document).querySelector(sel);
    },
    $$: function (sel, scope) {
      return Array.prototype.slice.call((scope || document).querySelectorAll(sel));
    },
    copy: copyText,
    flash: flash,
    status: setStatus,
    download: download,
    bytes: bytes,
    debounce: debounce,
    setTheme: setTheme
  };
})();
/* inline:assets/tool-base.js:end */
</script>
<script>
(function () {
  "use strict";
  var $ = PHT.$;
  var patternInput = $("#pattern");
  var textInput = $("#regexText");
  var flagsWrap = $("#flags");
  var preview = $("#preview");
  var matchBody = $("#matchBody");
  var matchWrap = $("#matchWrap");
  var matchEmpty = $("#matchEmpty");
  var matchCount = $("#matchCount");
  var replaceOut = $("#replaceOut");
  var replacement = $("#replacement");
  var statusEl = $("#status");
  var LIMIT = 5000;

  function esc(s) {
    return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  }

  function flags() {
    return PHT.$$("input:checked", flagsWrap).map(function (i) { return i.value; }).join("");
  }

  function highlight(text, re) {
    var html = "";
    var last = 0;
    var count = 0;
    re.lastIndex = 0;
    var m;
    while ((m = re.exec(text)) !== null) {
      if (count++ > LIMIT) break;
      var start = m.index;
      var end = start + m[0].length;
      html += esc(text.slice(last, start));
      if (m[0] === "") {
        html += '<mark class="zero"></mark>';
        last = start;
        if (re.lastIndex === m.index) re.lastIndex = m.index + 1;
        if (re.lastIndex > text.length) break;
      } else {
        html += "<mark>" + esc(m[0]) + "</mark>";
        last = end;
      }
      if (!re.global) break;
    }
    return { html: html + esc(text.slice(last)), count: Math.min(count, LIMIT) };
  }

  function renderMatches(text, re) {
    var rows = [];
    re.lastIndex = 0;
    var m;
    var guard = 0;
    while ((m = re.exec(text)) !== null) {
      if (guard++ > LIMIT) break;
      var groups = [];
      for (var i = 1; i < m.length; i++) {
        groups.push("$" + i + " = " + (m[i] === undefined ? "（未参与匹配）" : m[i]));
      }
      if (m.groups) {
        Object.keys(m.groups).forEach(function (k) {
          groups.push("$<" + k + "> = " + (m.groups[k] === undefined ? "（未参与匹配）" : m.groups[k]));
        });
      }
      rows.push({ index: m.index, match: m[0], groups: groups });
      if (m[0] === "") {
        if (re.lastIndex === m.index) re.lastIndex = m.index + 1;
        if (re.lastIndex > text.length) break;
      }
      if (!re.global) break;
    }
    return rows;
  }

  function render() {
    var text = textInput.value;
    var source = patternInput.value;
    var fl = flags();
    var re;

    try {
      re = new RegExp(source, fl);
    } catch (e) {
      PHT.status(statusEl, "表达式有误：" + e.message, "error");
      preview.innerHTML = '<span style="color:var(--muted)">表达式有误</span>';
      matchBody.textContent = "";
      matchWrap.hidden = true;
      matchEmpty.hidden = false;
      matchCount.textContent = "0 处匹配";
      replaceOut.textContent = "";
      return;
    }

    var hi = highlight(text, re);
    preview.innerHTML = hi.html;
    matchCount.textContent = hi.count + " 处匹配" + (hi.count >= LIMIT ? "（已截断）" : "");

    var rows = renderMatches(text, re);
    matchBody.textContent = "";
    rows.forEach(function (row, i) {
      var tr = document.createElement("tr");
      var tdN = document.createElement("td");
      tdN.textContent = String(i + 1);
      var tdPos = document.createElement("td");
      tdPos.textContent = String(row.index);
      var tdMatch = document.createElement("td");
      tdMatch.textContent = row.match === "" ? "（空匹配）" : row.match;
      var tdGroups = document.createElement("td");
      if (row.groups.length === 0) {
        tdGroups.textContent = "—";
        tdGroups.style.color = "var(--muted)";
      } else {
        row.groups.forEach(function (g, idx) {
          var line = document.createElement("div");
          line.className = "group";
          line.textContent = g;
          tdGroups.appendChild(line);
        });
      }
      tr.appendChild(tdN);
      tr.appendChild(tdPos);
      tr.appendChild(tdMatch);
      tr.appendChild(tdGroups);
      matchBody.appendChild(tr);
    });

    matchWrap.hidden = rows.length === 0;
    matchEmpty.hidden = rows.length > 0;

    try {
      replaceOut.textContent = text.replace(re, replacement.value);
    } catch (e) {
      replaceOut.textContent = "";
      PHT.status(statusEl, "替换失败：" + e.message, "error");
      return;
    }

    if (source === "") {
      PHT.status(statusEl, "表达式为空：空表达式会匹配每个位置", "error");
    } else {
      PHT.status(statusEl, "表达式可用 · 共 " + rows.length + " 处匹配" + (rows.length >= LIMIT ? "（结果过多已截断）" : ""), "ok");
    }
  }

  var debounced = PHT.debounce(render, 180);
  patternInput.addEventListener("input", debounced);
  textInput.addEventListener("input", debounced);
  replacement.addEventListener("input", debounced);
  flagsWrap.addEventListener("change", render);

  $("#presets").addEventListener("click", function (e) {
    var btn = e.target.closest("button[data-pattern]");
    if (!btn) return;
    patternInput.value = btn.getAttribute("data-pattern");
    var wanted = btn.getAttribute("data-flags") || "";
    PHT.$$("input", flagsWrap).forEach(function (box) {
      box.checked = wanted.indexOf(box.value) !== -1;
    });
    render();
  });

  $("#copyReplace").addEventListener("click", function () {
    var value = replaceOut.textContent;
    if (!value) {
      PHT.status(statusEl, "没有可复制的内容", "error");
      return;
    }
    PHT.copy(value).then(function (ok) {
      if (ok) PHT.flash($("#copyReplace"), "已复制");
      PHT.status(statusEl, ok ? "替换结果已复制" : "复制失败，请手动选择", ok ? "ok" : "error");
    });
  });

  render();
  patternInput.focus();
  patternInput.select();
})();
</script>
</body>
</html>
