<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>草稿本 - 纯 HTML 工具箱</title>
<meta name="description" content="简单便签，内容自动保存到浏览器本地（localStorage），刷新不丢失。">
<meta name="theme-color" content="#f6f5f1">
<link rel="icon" href="../assets/favicon.svg" type="image/svg+xml">
<script type="application/json" id="tool-meta">{"title":"草稿本","desc":"简单便签，内容自动保存到浏览器本地（localStorage），刷新不丢失。","category":"util","tags":["便签","草稿","notepad","本地"],"order":25}</script>
<script>try{var t=localStorage.getItem("pht-theme");if(t!=="light"&&t!=="dark"){t=window.matchMedia&&window.matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light"}document.documentElement.setAttribute("data-theme",t)}catch(e){document.documentElement.setAttribute("data-theme","light")}</script>
<style data-inline="assets/tool-base.css"></style>
<style></style>
</head>
<body>
<header class="toolbar">
  <div class="toolbar-inner">
    <a class="brand" href="../index.html"><img src="../assets/favicon.svg" alt="" width="24" height="24"><span>纯 HTML 工具箱</span></a>
    <span class="spacer"></span>
    <a class="btn ghost" href="../index.html">返回首页</a>
    <button class="icon-btn" type="button" data-theme-toggle aria-label="切换深色主题" aria-pressed="false"><svg class="i-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"></circle><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M19.1 4.9l-1.4 1.4M6.3 17.7l-1.4 1.4"></path></svg><svg class="i-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 14.5A8.5 8.5 0 0 1 9.5 4 8.5 8.5 0 1 0 20 14.5Z"></path></svg></button>
  </div>
</header>

<main class="shell">
  <div class="page-head">
    <span class="badge">小工具 · 本地处理</span>
    <h1>草稿本</h1>
    <p>简单便签，内容自动保存到浏览器本地（localStorage），刷新不丢失。</p>
  </div>

  <section class="panel">
<div class="field"><label for="note">内容（自动保存）</label><textarea id="note" class="code" spellcheck="false" placeholder="随手记点什么…" style="min-height:220px"></textarea></div>
<div class="actions">
  <button class="btn" id="clear" type="button">清空</button>
  <button class="btn" id="copy" type="button">复制</button>
</div>
<p class="status" id="status" aria-live="polite"></p>
  </section>

  <footer class="foot">
    <span>所有处理都在浏览器本地完成，数据不会上传。</span>
    <a href="../index.html">返回全部工具</a>
  </footer>
</main>

<script data-inline="assets/tool-base.js"></script>
<script>
(function(){
  var $ = PHT.$;
  var note=$("#note"), statusEl=$("#status");
  try{ var saved=localStorage.getItem("pht-notepad"); if(saved!=null) note.value=saved; }catch(e){}
  note.addEventListener("input",function(){ try{ localStorage.setItem("pht-notepad",note.value); }catch(e){} PHT.status(statusEl,"已保存","ok"); });
  $("#clear").addEventListener("click",function(){ note.value=""; try{ localStorage.removeItem("pht-notepad"); }catch(e){} PHT.status(statusEl,"已清空"); });
  $("#copy").addEventListener("click",function(){ if(!note.value){PHT.status(statusEl,"没有内容","error");return;} PHT.copy(note.value).then(function(ok){PHT.flash($("#copy"),"已复制");PHT.status(statusEl,ok?"已复制":"复制失败",ok?"ok":"error");}); });
})();
</script>
</body>
</html>
