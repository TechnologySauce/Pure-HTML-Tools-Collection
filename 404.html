<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>页面不存在 - 纯 HTML 工具箱</title>
<meta name="description" content="没有找到这个页面，返回纯 HTML 工具箱首页继续使用在线工具。">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#f6f5f1">
<base href="/Pure-HTML-Tools-Collection/">
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<style>
/* inline:assets/site.css:start */
/* 纯 HTML 工具箱 - 站点样式（仅首页使用，工具页自带内联样式以保持单文件） */

:root {
  --bg: #f6f5f1;
  --surface: #ffffff;
  --surface-2: #efede7;
  --text: #101418;
  --muted: #5b6570;
  --border: #e2e0d8;
  --accent: #0f766e;
  --accent-2: #c2410c;
  --accent-soft: rgba(15, 118, 110, 0.1);
  --shadow: 0 1px 2px rgba(16, 20, 24, 0.04), 0 8px 24px rgba(16, 20, 24, 0.06);
  --radius: 16px;
  --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
  --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
    "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans SC", Roboto, sans-serif;
}

html[data-theme="dark"] {
  --bg: #0b0e12;
  --surface: #12161d;
  --surface-2: #182029;
  --text: #e9eef5;
  --muted: #93a1b0;
  --border: #232c37;
  --accent: #2dd4bf;
  --accent-2: #fb923c;
  --accent-soft: rgba(45, 212, 191, 0.12);
  --shadow: 0 1px 2px rgba(0, 0, 0, 0.3), 0 12px 32px rgba(0, 0, 0, 0.28);
}

*,
*::before,
*::after {
  box-sizing: border-box;
}

html {
  scroll-behavior: smooth;
  -webkit-text-size-adjust: 100%;
}

body {
  margin: 0;
  background:
    radial-gradient(900px 500px at 12% -10%, var(--accent-soft), transparent 60%),
    radial-gradient(760px 420px at 96% 0%, rgba(194, 65, 12, 0.08), transparent 62%),
    var(--bg);
  color: var(--text);
  font-family: var(--sans);
  font-size: 16px;
  line-height: 1.65;
  min-height: 100vh;
}

a {
  color: inherit;
  text-decoration: none;
}

button {
  font: inherit;
}

:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 3px;
  border-radius: 6px;
}

.wrap {
  width: 100%;
  max-width: 1120px;
  margin: 0 auto;
  padding: 0 20px;
}

/* 顶栏 */
.topbar {
  position: sticky;
  top: 0;
  z-index: 20;
  backdrop-filter: saturate(140%) blur(12px);
  background: color-mix(in srgb, var(--bg) 86%, transparent);
  border-bottom: 1px solid var(--border);
}

.topbar-inner {
  display: flex;
  align-items: center;
  gap: 14px;
  height: 62px;
}

.brand {
  display: flex;
  align-items: center;
  gap: 10px;
  font-weight: 700;
  letter-spacing: -0.01em;
}

.brand img {
  width: 26px;
  height: 26px;
  border-radius: 7px;
}

.brand span {
  font-size: 1rem;
}

.topbar-spacer {
  flex: 1;
}

.top-link {
  font-size: 0.875rem;
  color: var(--muted);
  padding: 6px 10px;
  border-radius: 8px;
}

.top-link:hover {
  color: var(--text);
  background: var(--surface-2);
}

.icon-btn {
  display: inline-grid;
  place-items: center;
  width: 38px;
  height: 38px;
  border: 1px solid var(--border);
  border-radius: 10px;
  background: var(--surface);
  color: var(--text);
  cursor: pointer;
}

.icon-btn:hover {
  border-color: var(--accent);
  color: var(--accent);
}

.icon-btn svg {
  width: 18px;
  height: 18px;
}

html[data-theme="light"] .i-moon,
html[data-theme="dark"] .i-sun {
  display: none;
}

/* 首屏 */
.hero {
  padding: 62px 0 26px;
}

.eyebrow {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  font-family: var(--mono);
  font-size: 0.75rem;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--accent);
  background: var(--accent-soft);
  border: 1px solid color-mix(in srgb, var(--accent) 26%, transparent);
  padding: 5px 12px;
  border-radius: 999px;
}

h1 {
  font-size: clamp(2rem, 5vw, 3.4rem);
  line-height: 1.14;
  letter-spacing: -0.035em;
  margin: 20px 0 14px;
  max-width: 17em;
  text-wrap: balance;
}

h1 em {
  font-style: normal;
  color: var(--accent);
}

.lede {
  max-width: 46em;
  color: var(--muted);
  font-size: 1.02rem;
  margin: 0 0 26px;
}

.search-row {
  display: flex;
  gap: 12px;
  flex-wrap: wrap;
  align-items: center;
}

.search {
  position: relative;
  flex: 1 1 320px;
  max-width: 560px;
}

.search svg {
  position: absolute;
  left: 14px;
  top: 50%;
  transform: translateY(-50%);
  width: 18px;
  height: 18px;
  color: var(--muted);
  pointer-events: none;
}

.search input {
  width: 100%;
  height: 52px;
  padding: 0 64px 0 44px;
  border-radius: 12px;
  border: 1px solid var(--border);
  background: var(--surface);
  color: var(--text);
  font-size: 1rem;
  box-shadow: var(--shadow);
}

.search input::placeholder {
  color: var(--muted);
}

.search input:focus {
  border-color: var(--accent);
  outline: none;
  box-shadow: 0 0 0 4px var(--accent-soft);
}

.search kbd {
  position: absolute;
  right: 12px;
  top: 50%;
  transform: translateY(-50%);
  font-family: var(--mono);
  font-size: 0.75rem;
  color: var(--muted);
  border: 1px solid var(--border);
  border-bottom-width: 2px;
  border-radius: 6px;
  padding: 2px 7px;
  background: var(--surface-2);
}

.stats {
  display: flex;
  gap: 26px;
  flex-wrap: wrap;
  margin: 26px 0 0;
  padding: 0;
  list-style: none;
  font-size: 0.85rem;
  color: var(--muted);
}

.stats b {
  font-family: var(--mono);
  color: var(--text);
  font-size: 0.95rem;
}

/* 分类筛选 */
.chips {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
  margin: 34px 0 18px;
  padding-bottom: 4px;
}

.chip {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  border: 1px solid var(--border);
  background: var(--surface);
  color: var(--muted);
  padding: 7px 14px;
  border-radius: 999px;
  font-size: 0.875rem;
  cursor: pointer;
  transition: 0.15s ease;
}

.chip:hover {
  color: var(--text);
  border-color: color-mix(in srgb, var(--accent) 40%, var(--border));
}

.chip span {
  font-family: var(--mono);
  font-size: 0.72rem;
  color: var(--muted);
  background: var(--surface-2);
  border-radius: 999px;
  padding: 1px 7px;
}

.chip[aria-pressed="true"] {
  background: var(--accent);
  border-color: var(--accent);
  color: #06201d;
  font-weight: 600;
}

.chip[aria-pressed="true"] span {
  background: rgba(0, 0, 0, 0.14);
  color: inherit;
}

/* 工具卡片 */
.grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(258px, 1fr));
  gap: 14px;
  padding-bottom: 40px;
}

.card {
  position: relative;
  display: flex;
  flex-direction: column;
  gap: 8px;
  padding: 20px;
  border: 1px solid var(--border);
  border-radius: var(--radius);
  background: var(--surface);
  box-shadow: var(--shadow);
  transition: transform 0.16s ease, border-color 0.16s ease, box-shadow 0.16s ease;
  overflow: hidden;
}

.card::after {
  content: "";
  position: absolute;
  inset: 0;
  background: linear-gradient(135deg, var(--accent-soft), transparent 45%);
  opacity: 0;
  transition: opacity 0.16s ease;
  pointer-events: none;
}

.card:hover {
  transform: translateY(-3px);
  border-color: color-mix(in srgb, var(--accent) 50%, var(--border));
}

.card:hover::after {
  opacity: 1;
}

.card-head {
  display: flex;
  align-items: center;
  gap: 10px;
}

.card-icon {
  display: inline-grid;
  place-items: center;
  width: 34px;
  height: 34px;
  border-radius: 9px;
  background: var(--accent-soft);
  color: var(--accent);
  flex: none;
}

.card-icon svg {
  width: 18px;
  height: 18px;
}

.card-title {
  font-weight: 650;
  font-size: 1.02rem;
  letter-spacing: -0.01em;
}

.card-desc {
  font-size: 0.87rem;
  color: var(--muted);
  line-height: 1.6;
  flex: 1;
}

.card-tags {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  margin-top: 4px;
}

.card-tags i {
  font-style: normal;
  font-family: var(--mono);
  font-size: 0.68rem;
  color: var(--muted);
  border: 1px solid var(--border);
  border-radius: 5px;
  padding: 1px 6px;
}

.card-arrow {
  position: absolute;
  right: 18px;
  top: 18px;
  color: var(--muted);
  opacity: 0;
  transform: translateX(-4px);
  transition: 0.16s ease;
}

.card:hover .card-arrow {
  opacity: 1;
  transform: none;
  color: var(--accent);
}

.card.is-hidden {
  display: none;
}

.empty {
  display: none;
  padding: 60px 20px;
  text-align: center;
  color: var(--muted);
  border: 1px dashed var(--border);
  border-radius: var(--radius);
  margin-bottom: 40px;
}

.empty.is-visible {
  display: block;
}

.empty strong {
  display: block;
  color: var(--text);
  font-size: 1.1rem;
  margin-bottom: 6px;
}

/* 页脚 */
.site-footer {
  border-top: 1px solid var(--border);
  padding: 30px 0 44px;
  color: var(--muted);
  font-size: 0.85rem;
}

.footer-inner {
  display: flex;
  gap: 16px;
  flex-wrap: wrap;
  align-items: center;
  justify-content: space-between;
}

.site-footer a {
  color: var(--accent);
  text-decoration: underline;
  text-underline-offset: 3px;
}

@media (max-width: 640px) {
  .hero {
    padding-top: 40px;
  }
  .stats {
    gap: 16px;
  }
  .top-link.hide-sm {
    display: none;
  }
  .grid {
    grid-template-columns: 1fr;
  }
}

@media (prefers-reduced-motion: reduce) {
  html {
    scroll-behavior: auto;
  }
  .card,
  .chip,
  .card::after {
    transition: none;
  }
}

/* 搜索辅助 */
.sr-only {
  position: absolute;
  width: 1px;
  height: 1px;
  padding: 0;
  margin: -1px;
  overflow: hidden;
  clip: rect(0, 0, 0, 0);
  white-space: nowrap;
  border: 0;
}

.clear-btn {
  border: 1px solid var(--border);
  background: transparent;
  color: var(--muted);
  border-radius: 999px;
  padding: 7px 14px;
  font-size: 0.82rem;
  cursor: pointer;
}

.clear-btn:hover {
  color: var(--accent);
  border-color: var(--accent);
}

.result-note {
  margin: 0 0 14px;
  font-size: 0.82rem;
  color: var(--muted);
  font-family: var(--mono);
}
/* inline:assets/site.css:end */
</style>
<script>
(function () {
  try {
    var t = localStorage.getItem("pht-theme");
    if (t !== "light" && t !== "dark") {
      t = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
    }
    document.documentElement.setAttribute("data-theme", t);
  } catch (e) {
    document.documentElement.setAttribute("data-theme", "light");
  }
})();
</script>
<style>
  .nf { max-width: 640px; margin: 0 auto; padding: 96px 20px 120px; text-align: center; }
  .nf .code { font-family: var(--mono); font-size: clamp(3rem, 12vw, 5.5rem); font-weight: 700; line-height: 1; letter-spacing: -0.04em; color: var(--accent); }
  .nf h1 { font-size: clamp(1.3rem, 4vw, 1.7rem); margin: 18px 0 10px; }
  .nf p { color: var(--muted); margin: 0 auto 26px; max-width: 34em; }
  .nf .links { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
  .nf a { display: inline-block; padding: 9px 16px; border-radius: 10px; border: 1px solid var(--border); color: var(--text); text-decoration: none; font-size: 0.9rem; }
  .nf a.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  .nf a:hover { border-color: var(--accent); }
</style>
</head>
<body>
<main class="nf">
  <p class="code">404</p>
  <h1>这个页面不存在</h1>
  <p>链接可能已经失效，或者工具已经被重命名。回到首页可以搜索全部工具。</p>
  <div class="links">
    <a class="primary" href="index.html">返回首页</a>
    <a href="tools/json-formatter.html">JSON 格式化</a>
    <a href="tools/base64.html">Base64 编解码</a>
  </div>
</main>
</body>
</html>
